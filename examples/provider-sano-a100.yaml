# A batch Provider on Sano's A100 partition (HBEP-3, HBEP-4 Provider settings; issue #735, beta).
# Replace every <placeholder> and the stagingDir below. Apply profiles/sano.yaml first. Sano's
# compute nodes have no home directory, where ssh mode's agent reads its dial-home key, so the
# profile lists host-dialed alone and the Provider runs in it: the control plane reaches each job
# through the login node. Direct mode is no profile value (HBEP-4), so the profile does not list it;
# issue #735's probe P-D1 verified its dial-home path from both node classes (https://github.com/groundnuty/plgrid-llmlab-hpc-burst/issues/735#issuecomment-6995025741),
# and a served Instance in direct mode has not run yet.
#
# spec.stagingDir is required here: Sano's profile names none, because the shared file system lies
# at a cluster path that carries a user name. Give an absolute path on the shared file system that
# the login node and the compute nodes both mount, in a directory of your own. The value below is
# a stand-in that names nothing real. Like the account, the path is yours: it appears in no
# profile, status, event or log. No QOS is set, because the profile chooses one by the Allocation's
# GPU count (gpu1 for one A100), and reading a Provider that sets both is refused.
#
# credentialsRef.file is an ssh client configuration, mode 600, with a mode-600 key file (see
# examples/provider-helios-gh200.yaml and docs/quickstart.md).
apiVersion: hpcburst.groundnuty.github.io/v1alpha1
kind: Provider
metadata:
  name: sano-a100
  labels:
    hpcburst.groundnuty.github.io/organization: sano
    hpcburst.groundnuty.github.io/platform: sano
    hpcburst.groundnuty.github.io/partition: gpu
spec:
  platformProfileRef:
    name: sano
  account: <account>
  allowedPartitions:
    - gpu
  stagingDir: /path/to/shared/hpcburst-staging
  credentialsRef:
    file: /home/<user>/.config/hpcburst/credentials/sano-a100.ssh
