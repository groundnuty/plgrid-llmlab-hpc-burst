# PlatformProfile for Helios (Cyfronet, Slurm), alpha (HBEP-4, open questions 3, 7 and 8).
#
# It covers the alpha partitions: plgrid (CPU) and plgrid-gpu-gh200. Sano is not here.
#
# Where each value comes from (HBEP-4, open question 7). Every typed value has a
# comment that names one of three sources:
#   - a fact in this file's untyped block (spec.profile), as a path from spec.profile.
#     The same path, without "spec.profile.", leads to the fact in profiles/helios.draft.yaml
#     (spike S5; spike S1 added the facts of the hold check and of the compute nodes). A
#     partition is written partitions[name=<p>], since the draft lists partitions. The facts
#     added from issue #94 and its follow-ups (the hard limit of open files, QOS now, the
#     node-local storage measured in a GH200 job, and the SIF build's peak in $MEMFS) are in
#     this file only.
#   - "derived": a division of such facts, with the numbers shown.
#   - "framework default (HBEP-n, section)": no fact exists; the value is the design's.
# Slurm's "MB" is 2^20 bytes (the Slurm provider sends --mem=<MiB>M), so memory is in Mi.
#
# Content rules (HBEP-4, open question 8): no host name, address, user name, account,
# grant or job ID is in this file; accounts and grants are Provider settings.
apiVersion: hpcburst.groundnuty.github.io/v1alpha1
kind: PlatformProfile
metadata:
  name: helios
spec:
  providerKind: batch # spec.profile.kind

  partitions:
    - name: plgrid # spec.profile.facts.partitions[name=plgrid].name
      gpuModel: none # HBEP-4 writes "none" for a CPU partition; facts.partitions[name=plgrid].gres is "(none)"
      cpuArch: x86_64 # facts.partitions[name=plgrid].arch
      maxTime: 72h # facts.partitions[name=plgrid].max_time, "3-00:00:00"
      gpusPerNode: 0 # facts.partitions[name=plgrid].gres, "(none)"
      # This is a CPU partition for conformance runs only. It hosts no Instance
      # (`@hpc-burst-science-agent`, 31 Oct 2026). gpusPerNode 0 makes the Slurm provider refuse
      # any request for a GPU here (internal/slurm CheckRequest; test TestShippedCPUPartitionRefusesGPUAllocations).
      # Absent here: cpusPerGpu and memPerGpu (the partition has no GPU), and imageFormat.
      # imageFormat is not measured on this partition: S1's probe 2 ran on plgrid-gpu-gh200 only
      # (facts.containers.apptainer_compute_nodes holds that one partition). Absent means sif
      # (v1alpha1.ImageFormatOf), which matters only to an Instance, and none runs here.
    - name: plgrid-gpu-gh200 # spec.profile.facts.partitions[name=plgrid-gpu-gh200].name
      gpuModel: GH200 # HBEP-4 fixes the string. The GRES has no type, so the model is from the centre's documentation, cited in facts.partitions[name=plgrid-gpu-gh200].note ("4x GH200 96 GB")
      cpuArch: aarch64 # facts.partitions[name=plgrid-gpu-gh200].arch
      maxTime: 48h # facts.partitions[name=plgrid-gpu-gh200].max_time, "2-00:00:00"
      gpusPerNode: 4 # facts.partitions[name=plgrid-gpu-gh200].gres, "gpu:4 per node"
      cpusPerGpu: 72 # derived: facts.partitions[name=plgrid-gpu-gh200].cpus_per_node, 288, divided by the 4 GPUs of the GRES
      # Derived: facts.partitions[name=plgrid-gpu-gh200].max_mem_per_node_mb, 489500, divided by the 4 GPUs.
      # The centre documents a billing share of 120 GB per GPU (facts.other.billing) without saying
      # which GB; if it is decimal, a one-GPU request of this memory may be billed as more than one GPU.
      # tmpDir below is a RAM disk whose contents count against --mem. A cold build of vLLM v0.32.0's
      # SIF peaked there at 59473461248 bytes, 55.39 GiB, about 6.7 times the 8.8 GB SIF
      # (facts.storage.node_local.sif_build_peak_in_memfs, measured from the agent's buildPeakTmpBytes;
      # issue #94, comment 6557821833). That measurement replaces the earlier 24 GiB estimate, and memPerGpu
      # stays as derived: the agent removes the build tree once the SIF is cached, before the engine
      # loads its weights, so the build's peak and the engine do not hold memory at the same time
      # (HBEP-4, Platform profile schema; HBEP-7, The allocation agent; `@hpc-burst-science-agent`,
      # 1 Nov 2026).
      memPerGpu: 122375Mi
      imageFormat: sif # facts.containers.apptainer_compute_nodes.value.plgrid-gpu-gh200 (S1 probe 2: a SIF runs); also facts.partitions[name=plgrid-gpu-gh200].image_format
      # The job's temporary directory is the job's RAM disk (HBEP-4, Submission and Platform profile
      # schema; `@hpc-burst-science-agent`, 1 Nov 2026). The job's own TMPDIR on GH200 is on Lustre
      # (facts.storage.node_local.job_tmpdir_in_job), where the agent's run directory and Apptainer's
      # layer cache and build tree put tens of thousands of inodes during an image pull, on a scratch
      # quota that is already near its inode limit (issue #94, finding 1; facts.storage.scratch holds
      # the file quota). The node-local disk is refused at submission
      # (facts.storage.node_local.localfs_refused), and /tmp is not to be used (facts.storage.tmp_rule).
      tmpDir: $MEMFS # facts.storage.node_local.memfs ("path in $MEMFS"); memfs_in_job: a per-job tmpfs of about the node's RAM, counted against --mem
      tmpDirFeature: memfs # facts.storage.node_local.memfs ("request with -C memfs"); memfs_in_job: a job with -C memfs was accepted and had $MEMFS

  holdRelease: true # facts.slurm.hold_release.value: user_release_ok true on plgrid and plgrid-gpu-gh200 (S1's hold check)
  lostGrace: 2m # framework default (HBEP-4, Platform profile schema, lostGrace): above the measured gap of about 2 s between queue and accounting (S7's capture)
  inflightWindow: 5m # framework default (HBEP-4, Platform profile schema, inflightWindow): 5 min until the sbatch latency over ssh is measured (HBEP-4, Graduation criteria)
  unknownBound: 10m # framework default (HBEP-4, Platform profile schema, unknownBound): S4's default
  timeZone: Europe/Warsaw # facts.time.slurm_time_zone.value.iana
  requeueDefault: true # facts.slurm.job_requeue, 1
  minJobAge: 10s # facts.slurm.min_job_age_s, 10
  jsonDataParser: v0.0.42 # facts.slurm.squeue_json.note: meta.plugin.data_parser is data_parser/v0.0.42 (HBEP-4, The Slurm dialect), without the prefix
  stagingDir: $SCRATCH # facts.storage.scratch: a Lustre file system, reached through $SCRATCH (HBEP-4, Transport)
  # jobName.maxLength is measured, not a default: the conformance run on Helios plgrid of 31 Oct 2026 (step 5,
  # a 56-character job name submitted and read back unchanged from squeue and from sacct; issue #93,
  # comment 6550844149) is its source. The schema holds job-name rules per profile, not per partition, so this
  # value covers plgrid-gpu-gh200 too, which ran the same step on 1 Nov 2026 with the same result (the
  # conformance run on Helios plgrid-gpu-gh200, TestJobNameRoundTrip; issue #93, comment 6558126530). That is
  # sound because Helios runs one Slurm configuration for all its partitions, and the read-back is the safety
  # net against a partition-specific rename:
  # a job whose name came back shortened is refused and cancelled (HBEP-4, Risks)
  # (`@hpc-burst-science-agent`, option (b), 1 Nov 2026).
  jobName:
    maxLength: 56

  # Not set, because no fact states it (HBEP-4, Platform profile schema: an unstated fact is absent, not false):
  #   jobName.pattern: unset. No draft records a pattern, and the round trip above used the tag form, which a
  #     pattern would have to match; it records no restriction on the characters.
  #   jobCommentAccounted: unset. HBEP-4 makes it optional and only recorded: the tag is in the job
  #     name either way (`@hpc-burst-science-agent`, 31 Oct 2026).
  #   maxIdle: unset outside Athena (HBEP-4, Platform profile schema).

  drainWindow: 2h10m # framework default (HBEP-4, Platform profile schema, drainWindow; HBEP-5, Draining): the front's 2 h maxRequestDuration plus drainMargin
  drainMargin: 10m # framework default (HBEP-4, Platform profile schema, drainMargin; HBEP-5, Draining)
  handoverMargin: 30m # framework default (HBEP-4, Platform profile schema, handoverMargin; HBEP-7, submission plan)

  # framework default (HBEP-4, Platform profile schema, health; HBEP-7), tuned in beta
  health:
    probeInterval: 10s
    failureThreshold: 3
    noProgressTimeout: 30m # equal to HBEP-5's idleTimeout (HBEP-7, open question 6)
    errorOnlyWindow: 1m
    kvSkewTimeout: 2m
    agentTimeout: 2m
    registrationTimeout: 15m
    startTimeout: 1h
  # framework default (HBEP-4, Platform profile schema, restart; HBEP-7), tuned in beta
  restart:
    stopGrace: 10s
    attemptsPerRung: 2
    window: 30m
    backoff: 30s

  # The untyped block (HBEP-4, open question 3): the draft's root keys, facts and unknown, with the
  # envelope of each fact (value, method, source, date) and the facts of spike S1 added.
  # Nothing in alpha reads it.
  profile:
    draft: s5
    platform: helios
    organization: cyfronet
    kind: batch
    collected: "2026-10-30"         # UTC date
    facts:
      slurm:
        version: {value: "24.11.5", method: measured, source: "sinfo --version", date: "2026-10-30", note: "scontrol show config SLURM_VERSION and the slurmd version of every reporting node agree"}
        squeue_json:
          value: true
          method: measured
          source: "squeue --me --json"
          date: "2026-10-30"
          note: "exit 0 and the output parses as JSON. Top-level keys: jobs, last_backfill, last_update, meta, errors, warnings. meta.plugin.data_parser is data_parser/v0.0.42, accounting_storage is accounting_storage/slurmdbd."
        sacct_json:
          value: true
          method: measured
          source: "sacct --json -S now-1hours -X -u <self>"
          date: "2026-10-30"
          note: "exit 0 and the output parses as JSON. Top-level keys: jobs, meta, errors, warnings. Same data_parser as squeue. The brief's command was run with -u <self> added, to stay on the probing user's own jobs."
        jwt_token_command:
          value: false
          method: measured
          source: "scontrol token lifespan=60 >/dev/null 2>&1; echo $?  (exit code only; the token was discarded)"
          date: "2026-10-30"
          note: "exit code 1: a plain user cannot mint a JWT"
        auth_type: {value: "auth/munge", method: measured, source: "scontrol show config: AuthType", date: "2026-10-30"}
        auth_alt_types: {value: null, method: measured, source: "scontrol show config: AuthAltTypes", date: "2026-10-30", note: "scontrol prints (null). The auth_jwt client plugin file is installed, but no alternative auth type is enabled."}
        auth_alt_parameters: {value: null, method: measured, source: "scontrol show config: AuthAltParameters", date: "2026-10-30", note: "scontrol prints (null)"}
        slurmrestd_binary:
          value: true
          method: measured
          source: "command -v slurmrestd"
          date: "2026-10-30"
          note: "exit 0. The binary is part of the Slurm client installation on the login node. This says nothing about a running service."
        slurmrestd_service: {value: "not advertised; availability unknown", method: unknown, source: "docs.hpc.cyfronet.pl search index (249 pages) searched for slurmrestd, rest api, jwt, openapi", date: "2026-10-30", note: "no hit in the documentation pages. Not advertised there. That is not proof that no endpoint exists. JWT is not enabled, but slurmrestd can also run with local (unix-socket) auth, so whether a plain user can reach any REST endpoint is unverified."}
        min_job_age_s: {value: 10, method: measured, source: "scontrol show config: MinJobAge", date: "2026-10-30", note: "MinJobAge is the minimum age before a completed job's record is purged from the controller, so a completed job can disappear from squeue within about 10 s. Poll sacct for final states."}
        job_requeue: {value: 1, method: measured, source: "scontrol show config: JobRequeue", date: "2026-10-30", note: "jobs are requeueable by default. Submit with --no-requeue to prevent it."}
        requeue_exit: {value: null, method: measured, source: "scontrol show config: RequeueExit", date: "2026-10-30", note: "scontrol prints (null)"}
        requeue_exit_hold: {value: null, method: measured, source: "scontrol show config: RequeueExitHold", date: "2026-10-30", note: "scontrol prints (null)"}
        hold_release:
          method: measured
          date: "2026-10-30"
          source: "issue #18 (S1's hold check), commit 35babef on branch spike/s1-frp-dial-home. Per partition, one job as a plain user with the grant account of that job kind: sbatch --hold --no-requeue --parsable --time=00:02:00 --cpus-per-task=1 --mem=1G --job-name=hb-holdcheck-<label> --partition=<p> --account=<account> [--gres=gpu:1] --wrap='sleep 30'; squeue -j <id> -h -o '%T|%r' at once; scontrol release <id>; squeue again after 2 s; scancel <id>; sacct -j <id> -X -n -P -o State -S now-1hours. The --gres=gpu:1 option was used on plgrid-gpu-gh200 only."
          value:
            plgrid: {hold_honoured: true, state_reason_after_submit: "PENDING|JobHeldUser", user_release_ok: true, release_exit: 0, state_reason_after_release: "PENDING|Priority", final_state: "CANCELLED"}
            plgrid-gpu-gh200: {hold_honoured: true, state_reason_after_submit: "PENDING|JobHeldUser", user_release_ok: true, release_exit: 0, state_reason_after_release: "PENDING|Priority", final_state: "CANCELLED"}
          note: "On both partitions a plain user's sbatch --hold was honoured (reason JobHeldUser, not JobHeldAdmin) and the same user released it with scontrol release (exit 0, no message). Two seconds later the job was PENDING with reason Priority, so the release took effect and the job queued normally; it was cancelled at once and never ran. One job per partition, one trial each. Not tested: other job shapes (arrays, --begin), how long a held job may stay held before the site purges it, and the other partitions."
        limits:
          max_job_count: {value: 500000, method: measured, source: "scontrol show config: MaxJobCount", date: "2026-10-30"}
          max_array_size: {value: 10001, method: measured, source: "scontrol show config: MaxArraySize", date: "2026-10-30"}
          kill_wait_s: {value: 180, method: measured, source: "scontrol show config: KillWait", date: "2026-10-30"}
          over_time_limit_min: {value: 0, method: measured, source: "scontrol show config: OverTimeLimit", date: "2026-10-30"}
          unkillable_step_timeout_s: {value: 1800, method: measured, source: "scontrol show config: UnkillableStepTimeout", date: "2026-10-30"}
          max_step_count: {value: 40000, method: measured, source: "scontrol show config: MaxStepCount", date: "2026-10-30"}
          max_tasks_per_node: {value: 512, method: measured, source: "scontrol show config: MaxTasksPerNode", date: "2026-10-30"}
          enforce_part_limits: {value: "ANY", method: measured, source: "scontrol show config: EnforcePartLimits", date: "2026-10-30"}
          scheduler_parameters: {value: "bf_continue,bf_max_job_test=10000,bf_window=4320,default_queue_depth=10000,bf_interval=60,bf_min_age_reserve=300,sched_min_interval=2,pack_serial_at_end", method: measured, source: "scontrol show config: SchedulerParameters", date: "2026-10-30"}
          other_config: {value: "SchedulerType=sched/backfill; SelectType=select/cons_tres; SelectTypeParameters=CR_CPU_MEMORY; TaskPlugin=task/cgroup,task/affinity; ProctrackType=proctrack/cgroup; PrologFlags=Alloc,DeferBatch,NoHold; JobSubmitPlugins=lua; AccountingStorageEnforce=associations,limits,qos; GresTypes=gpu; MpiDefault=cray_shasta; TmpFS=/tmp; PreemptMode=OFF", method: measured, source: "scontrol show config", date: "2026-10-30"}
        qos:
          method: measured
          source: "sacctmgr -nP show qos format=Name,MaxWall,Priority,UsageFactor,MaxJobsPU,MaxSubmitPU"
          date: "2026-10-30"
          note: "This lists every QOS on the cluster. Which of them a given user may use is not shown. The QOS of the six public partitions comes from scontrol show partition. Not listed here: grid-* (experiment-specific, priority 0, no limits), 8k3* (priority 0, no limits), ignore-part-qos. UsageFactor is 1.0 for every QOS."
          value:
            - {name: plgrid, max_wall: null, priority: 0, max_jobs_per_user: 1000, max_submit_per_user: 2000}
            - {name: plgrid-now, max_wall: null, priority: 0, max_jobs_per_user: null, max_submit_per_user: 1}
            - {name: now, max_wall: "12:00:00", priority: 20000, max_jobs_per_user: null, max_submit_per_user: 1}
            - {name: llm, max_wall: "7-00:00:00", priority: 10000, max_jobs_per_user: null, max_submit_per_user: null}
            - {name: week, max_wall: "7-00:00:00", priority: 0, max_jobs_per_user: null, max_submit_per_user: null}
            - {name: 2weeks, max_wall: "14-00:00:00", priority: 0, max_jobs_per_user: null, max_submit_per_user: null}
            - {name: 4weeks, max_wall: "28-00:00:00", priority: 0, max_jobs_per_user: null, max_submit_per_user: null}
            - {name: normal, max_wall: null, priority: 0, max_jobs_per_user: null, max_submit_per_user: null}
            - {name: vip, max_wall: null, priority: 20000, max_jobs_per_user: null, max_submit_per_user: null}
            - {name: ip, max_wall: null, priority: 10000, max_jobs_per_user: null, max_submit_per_user: null}
            - {name: lip, max_wall: null, priority: 5000, max_jobs_per_user: null, max_submit_per_user: null}
            - {name: llip, max_wall: null, priority: 2500, max_jobs_per_user: null, max_submit_per_user: null}
            - {name: plgrid-services, max_wall: null, priority: 0, max_jobs_per_user: 2, max_submit_per_user: null}
        sbatch_test_only:
          method: measured
          date: "2026-10-30"
          source: "sbatch --test-only --wrap=true --time=00:01:00 --job-name=s5probe --ntasks=1 --mem=1G --partition=<p> (no --account, no --qos); the GPU run added --gres=gpu:1"
          note: "Run without --account and --qos, so Slurm used the probing user's default account. CPU partition plgrid: exit 0, a start estimate came back, no job was created. GPU partition plgrid-gpu-gh200: exit 1, 'allocation failure: Invalid account or account/partition combination specified'. The documented account naming rule (a resource suffix such as -gpu-gh200, https://docs.hpc.cyfronet.pl/environment/batch-system/accounts-and-grants/) is a likely reason, but no account was tried after the failure, so the cause was not isolated. Both results depend on the probing user's default account and grants."
          value: {plgrid: {exit: 0, outcome: "start estimate returned"}, plgrid-gpu-gh200: {exit: 1, outcome: "Invalid account or account/partition combination specified (with the probing user's default account)"}}
        qos_now_one_gpu:
          method: measured
          date: "2026-11-01"
          source: "issue #94, comment 6550908687 (the real-engine run). sbatch --test-only for 1 GPU on partition plgrid-gpu-gh200, with --no-requeue, under the account of the largest active GH200 grant (not named here); the job was then submitted under QOS now"
          note: "One estimate pair and one job, at one moment: the queue state of that run, not a rule. QOS now has a wall limit of 12 h and one submitted job per user (facts.slurm.qos), so this holds for short jobs. The estimate under QOS now was a range, and the job started at once. The date is that of the report comment; the run was no later."
          value: {partition: plgrid-gpu-gh200, gpus: 1, start_estimate_normal_qos: "16 days", start_estimate_qos_now: "13 to 29 min", started_at_once_under_qos_now: true}
      partitions:
        # The six partitions below are the ones the documentation or the QOS list
        # points users at. Time limits, node counts and hardware are per partition.
        - name: plgrid
          default: true
          max_time: "3-00:00:00"
          default_time: "00:15:00"
          nodes: 512
          cpus_per_node: "192"
          mem_per_node_mb: "386084 on 272 nodes, 773156 on 240 nodes"
          max_mem_per_node_mb: 384000
          def_mem_per_cpu_mb: 1536
          gres: "(none)"
          arch: "x86_64"
          features: "memfs,localfs"
          qos: plgrid
          priority_job_factor: 1000
          tres_billing_weights: "cpu=1,mem=0.0005M"
          os_kernel: "el9 kernel (Rocky 9) on 472 of 512 nodes; EL8 kernel (4.18) on 35 nodes; 5 nodes did not report an architecture or kernel"
          method: measured
          source: "sinfo -h -o '%P|%l|%L|%D|%c|%m|%G|%f'; scontrol show partition; scontrol show node (aggregated)"
          date: "2026-10-30"
          note: "The documentation lists plgrid with 272 nodes and 72 h (https://docs.hpc.cyfronet.pl/supercomputers/helios/). Measured: the partition holds 512 nodes, the 272 standard nodes plus the 240 bigmem nodes, but MaxMemPerNode is 384000, so the bigmem nodes add no memory here. The 72 h limit matches."
        - name: plgrid-now
          default: false
          max_time: "12:00:00"
          default_time: "00:15:00"
          nodes: 512
          cpus_per_node: "192"
          mem_per_node_mb: "386084 on 272 nodes, 773156 on 240 nodes"
          max_mem_per_node_mb: 384000
          def_mem_per_cpu_mb: 1536
          gres: "(none)"
          arch: "x86_64"
          features: "memfs,localfs"
          qos: plgrid-now
          priority_job_factor: 15000
          method: measured
          source: "sinfo; scontrol show partition; sacctmgr show qos (plgrid-now allows 1 submitted job per user)"
          date: "2026-10-30"
          note: "Not in the Helios documentation page that was read. Short jobs, high priority factor, one submitted job per user at a time."
        - name: plgrid-long
          default: false
          max_time: "7-00:00:00"
          default_time: "00:15:00"
          nodes: 272
          cpus_per_node: "192"
          mem_per_node_mb: "386084"
          max_mem_per_node_mb: 384000
          def_mem_per_cpu_mb: 1536
          gres: "(none)"
          arch: "x86_64"
          features: "memfs,localfs"
          qos: plgrid
          priority_job_factor: 500
          method: measured
          source: "sinfo; scontrol show partition; scontrol show node (aggregated)"
          date: "2026-10-30"
          note: "The documentation says 166 h and 'requires a grant with a maximum job runtime of 168 h'. Measured MaxTime is 7-00:00:00, which is 168 h. Access is restricted by the partition's AllowAccounts list of grant accounts, which is how the 168 h grant requirement is enforced; the list is not recorded here."
        - name: plgrid-bigmem
          default: false
          max_time: "3-00:00:00"
          default_time: "00:15:00"
          nodes: 240
          cpus_per_node: "192"
          mem_per_node_mb: "773156"
          max_mem_per_node_mb: 768000
          def_mem_per_cpu_mb: 3072
          gres: "(none)"
          arch: "x86_64"
          features: "memfs,localfs"
          qos: plgrid
          priority_job_factor: 5000
          tres_billing_weights: "cpu=1,mem=0.00025M"
          os_kernel: "el9 kernel (Rocky 9) on 204 nodes; EL8 kernel (4.18) on 35 nodes; 1 node did not report"
          method: measured
          source: "sinfo; scontrol show partition; scontrol show node (aggregated)"
          date: "2026-10-30"
          note: "The documentation lists RAM available for job allocations as 773170 MB; measured RealMemory is 773156 MB and MaxMemPerNode 768000."
        - name: plgrid-gpu-gh200
          default: false
          max_time: "2-00:00:00"
          default_time: "00:15:00"
          nodes: 110
          cpus_per_node: "288 (4 sockets of 72 Grace cores, 1 thread per core)"
          mem_per_node_mb: "489500"
          max_mem_per_node_mb: 489500
          def_mem_per_cpu_mb: 1536
          gres: "gpu:4 per node (GRES name 'gpu', no GPU type in the name; sinfo prints gpu:4(S:0-3)); request with --gres=gpu:N"
          arch: "aarch64"
          features: "memfs,localfs"
          qos: plgrid
          priority_job_factor: 1000
          tres_billing_weights: "cpu=0.01388,mem=0.00000816993M,GRES/gpu=1"
          os_kernel: "Rocky 9 kernel, the 64 KiB-page variant (kernel string ends +64k), on all 109 nodes that reported; 1 node did not report"
          image_format: sif
          image_format_note: "Measured by spike S1 probe 2 (issue #18) on 2026-10-30: Apptainer 1.5.4 on the compute nodes runs a SIF image. The PlatformProfile field is partitions[].imageFormat."
          method: measured
          source: "sinfo; scontrol show partition; scontrol show node (aggregated)"
          date: "2026-10-30"
          note: "Matches the documentation (110 nodes, 48 h, aarch64, 4x GH200 96 GB; https://docs.hpc.cyfronet.pl/supercomputers/helios/). The documented RAM available for jobs is 489600 MB; measured 489500 MB. Slurm output does not name the GPU model; that comes from the documentation. Account suffix -gpu-gh200 (documented)."
        - name: plgrid-gpu-rtx
          default: false
          max_time: "2-00:00:00"
          default_time: "00:15:00"
          nodes: 11
          cpus_per_node: "128 (2 sockets of 64 cores)"
