          date: "2026-10-30"
          note: "TZ is unset in the ssh session, so the zone comes from the system. CET is the winter offset; daylight saving ended on 2026-10-25 and the offset becomes +0200 (CEST) in summer. Slurm text output in this session prints local time without a zone marker. Epoch fields (for example in JSON output) are unaffected by the session zone, so plugins should prefer epoch or JSON timestamps over parsing text. This is the zone of a login session, not a property of the scheduler."
