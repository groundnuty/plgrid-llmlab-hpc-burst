          source: "issue #18, comment 6542078107 (S1 probe 2). S1 probe 2, one job on plgrid-gpu-gh200 (QOS now): command -v apptainer singularity; apptainer --version; rpm -q apptainer apptainer-suid; apptainer buildcfg | grep -i suid; apptainer exec docker://busybox:1.36 true (exit 0), then busybox --help (exit 0, applet list printed) and uname -m inside the container (aarch64)"
          date: "2026-10-30"
          note: "The compute node runs el9 on aarch64: apptainer-1.5.4-1.el9.aarch64 and apptainer-suid, the same upstream version as the login node (1.5.4, EL8 x86_64). /usr/bin/singularity is also on PATH. Apptainer is not an Lmod module: module avail apptainer lists nothing and module spider apptainer and singularity both report 'Unable to find' (login shell). The anonymous Docker Hub pull worked (about 4 s for busybox, converted to a SIF in the cache under $SCRATCH; the matching aarch64 image was chosen). The container ran in setuid mode: the uid_map inside is the identity map and apptainer exec --userns is refused. Apptainer warns that $SCRATCH is mounted nodev and that xattrs are not supported on it; neither stopped the run. One job, one node. Only plgrid-gpu-gh200 was probed: Apptainer on the other Helios partitions is not measured."
