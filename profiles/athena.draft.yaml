# Draft platform profile from spike S5 (issue #17). Not the final schema:
# HBEP-4 open question 3 decides that. Each fact: value, method, source, date.
#
# method is measured (a command run on a login node on the date shown),
# documented (the centre's user docs, fetched on the date shown) or unknown.
# All measured facts come from one login node of the platform, read-only,
# with no job run. Node-level numbers are a snapshot of the collection time.
draft: s5
platform: athena              # helios | athena | sano
organization: cyfronet        # cyfronet | sano
kind: batch
collected: 2026-10-30         # UTC date
facts:
  slurm:
    version:
      value: "23.11.7"
      method: measured
      source: "sinfo --version; scontrol show config (SLURM_VERSION)"
      date: 2026-10-30
    squeue_json:
      value: true
      method: measured
      source: "squeue --me --json"
      date: 2026-10-30
      note: "Exit 0, output parses as JSON. Top-level keys: errors, jobs, last_backfill, last_update, meta, warnings. meta.plugin names data_parser/v0.0.40 and accounting_storage/slurmdbd."
    sacct_json:
      value: true
      method: measured
      source: "sacct --json -S now-1hours -X"
      date: 2026-10-30
      note: "Exit 0, output parses as JSON. Top-level keys: errors, jobs, meta, warnings."
    jwt_token:
      value: false
      method: measured
      source: "scontrol token lifespan=60 >/dev/null 2>&1; echo $?"
      date: 2026-10-30
      note: "Exit code 1. Consistent with the auth lines below: JWT is not an enabled alternative auth type."
    auth_type:
      value: "auth/munge"
      method: measured
      source: "scontrol show config (AuthType)"
      date: 2026-10-30
    auth_alt_types:
      value: "(null)"
      method: measured
      source: "scontrol show config (AuthAltTypes)"
      date: 2026-10-30
    auth_alt_parameters:
      value: "(null)"
      method: measured
      source: "scontrol show config (AuthAltParameters)"
      date: 2026-10-30
    slurmrestd_binary:
      value: "present on PATH of the login node, executable, version 23.11.7"
      method: measured
      source: "command -v slurmrestd; slurmrestd -V"
      date: 2026-10-30
      note: "Lives in the site's Slurm release tree, not in /usr. JWT is not enabled (see jwt_token), but slurmrestd can also run with local (unix-socket) auth. Whether a slurmrestd service runs, where, and whether a plain user can reach it is not known."
    slurmrestd_advertised:
      value: false
      method: documented
      source: "https://docs.hpc.cyfronet.pl/ (pages: supercomputers/athena, environment/general-rules, environment/batch-system/{overview,commands,accounts-and-grants,examples}, environment/{variables,hpc-tools,local-storage-features}, software/{modules,services}, support)"
      date: 2026-10-30
      note: "Negative result: a text search of these pages for slurmrestd, REST API and JWT found nothing, and a web search for a Cyfronet REST API page found nothing. This is an absence of mention, not a statement by the centre."
    min_job_age:
      value: "10 sec"
      method: measured
      source: "scontrol show config (MinJobAge)"
      date: 2026-10-30
      note: "MinJobAge is the minimum age before a completed job's record is purged from the controller, so a completed job can disappear from squeue within about 10 s. Later state must come from sacct."
    job_requeue:
      value: "1"
      method: measured
      source: "scontrol show config (JobRequeue)"
      date: 2026-10-30
      note: "Jobs are requeueable by default."
    requeue_exit:
      value: "(null)"
      method: measured
      source: "scontrol show config (RequeueExit)"
      date: 2026-10-30
    requeue_exit_hold:
      value: "(null)"
      method: measured
      source: "scontrol show config (RequeueExitHold)"
      date: 2026-10-30
    max_job_count:
      value: 100000
      method: measured
      source: "scontrol show config (MaxJobCount)"
      date: 2026-10-30
    max_array_size:
      value: 20001
      method: measured
      source: "scontrol show config (MaxArraySize)"
      date: 2026-10-30
    kill_wait:
      value: "180 sec"
      method: measured
      source: "scontrol show config (KillWait)"
      date: 2026-10-30
      note: "Grace between SIGTERM and SIGKILL when a job is cancelled or reaches its time limit."
    over_time_limit:
      value: "0 min"
      method: measured
      source: "scontrol show config (OverTimeLimit)"
      date: 2026-10-30
    other_limits:
      value:
        MaxStepCount: 40000
        MaxTasksPerNode: 512
        MaxNodeCount: 48
        UnkillableStepTimeout: "300 sec"
        BatchStartTimeout: "10 sec"
        EnforcePartLimits: "ANY"
        AccountingStorageEnforce: "associations,limits,qos"
        SelectType: "select/cons_tres"
        SelectTypeParameters: "CR_CPU_MEMORY"
        TaskPlugin: "task/cgroup,task/affinity"
        ProctrackType: "proctrack/cgroup"
        GresTypes: "gpu"
        PreemptMode: "OFF"
        PriorityType: "priority/multifactor"
        SchedulerType: "sched/backfill"
        PrologFlags: "Alloc,DeferBatch,NoHold"
        JobSubmitPlugins: "lua"
        SrunPortRange: "0-0"
      method: measured
      source: "scontrol show config"
      date: 2026-10-30
      note: "A Lua job_submit plugin runs at submission and may reject or rewrite jobs (its content was not read). AccountingStorageEnforce makes a valid association mandatory."
    scheduler_parameters:
      value: "max_switch_wait=86400,default_queue_depth=2000,bf_max_job_test=2000,bf_max_job_part=1000,bf_continue,assoc_limit_continue,batch_sched_delay=10,bf_interval=30,kill_invalid_depend,sbatch_wait_nodes,salloc_wait_nodes,pack_serial_at_end,max_rpc_cnt=5000,bf_window=4320,bf_max_job_start=10000,disable_hetero_steps,sched_min_interval=2000000,sched_max_job_start=10000,max_script_size=1048576"
      method: measured
      source: "scontrol show config (SchedulerParameters)"
      date: 2026-10-30
      note: "Full string as printed. bf_window=4320 minutes (3 days)."
    qos:
      value:
        - {name: normal, max_wall: "", priority: 0, max_jobs_per_user: "", max_submit_per_user: "", max_tres_per_user: "", flags: ""}
        - {name: plgrid, max_wall: "", priority: 0, max_jobs_per_user: "", max_submit_per_user: 1000, max_tres_per_user: "", flags: "DenyOnLimit"}
        - {name: plgrid-now, max_wall: "", priority: 0, max_jobs_per_user: 1, max_submit_per_user: 1, max_tres_per_user: "cpu=16,gres/gpu=1,mem=125G", flags: "DenyOnLimit"}
        - {name: plgrid-services, max_wall: "", priority: 0, max_jobs_per_user: 2, max_submit_per_user: "", max_tres_per_user: "", flags: ""}
        - {name: 1week, max_wall: "7-00:00:00", priority: 0, max_jobs_per_user: 2, max_submit_per_user: "", max_tres_per_user: "", flags: "DenyOnLimit,PartitionTimeLimit"}
        - {name: tutorial, max_wall: "", priority: 100000, max_jobs_per_user: "", max_submit_per_user: "", max_tres_per_user: "", flags: "DenyOnLimit"}
        - {name: vip, max_wall: "", priority: 100000, max_jobs_per_user: "", max_submit_per_user: "", max_tres_per_user: "", flags: "DenyOnLimit"}
        - {name: ip, max_wall: "", priority: 50000, max_jobs_per_user: "", max_submit_per_user: "", max_tres_per_user: "", flags: "DenyOnLimit"}
        - {name: lip, max_wall: "", priority: 20000, max_jobs_per_user: "", max_submit_per_user: "", max_tres_per_user: "", flags: "DenyOnLimit"}
        - {name: llip, max_wall: "", priority: 10000, max_jobs_per_user: "", max_submit_per_user: "", max_tres_per_user: "", flags: "DenyOnLimit"}
      method: measured
      source: "sacctmgr -n -P show qos format=Name,MaxWall,Priority,MaxJobsPU,MaxSubmitPU,MaxTRESPU,Flags,Preempt"
      date: 2026-10-30
      note: "Empty string means no limit. The partition QoS is applied to every job in that partition: plgrid for plgrid-gpu-a100, plgrid-now for plgrid-now (see partitions). So a plain user may hold 1000 submitted jobs in plgrid-gpu-a100, but only one job (one GPU, 16 CPUs, 125 GB) in plgrid-now."

  # One entry per partition seen by a plain user (scontrol show partition lists
  # eight, none hidden). Per-node numbers are the same on every partition: the
  # 48 nodes are one hardware type. "arch_not_reported" counts nodes that were
  # DOWN+FAIL+NOT_RESPONDING at collection and so show an empty Arch field.
  # Node counts include those nodes.
  partitions:
    - name: plgrid-gpu-a100
      max_time: "2-00:00:00"
      default_time: "00:15:00"
      nodes: 48
      cpus_per_node: 128
      mem_per_node_mb: 1024000
      gres: "gpu:a100:8"
      arch: "x86_64"
      arch_not_reported: 23
      features: "memfs,localfs,gpustats (scratch on 5 of 48 nodes)"
      qos: "plgrid"
      default_partition: false
      priority_tier: 1
      priority_job_factor: 1000
      def_mem_per_cpu_mb: 8000
      access: "AllowAccounts lists grant accounts that end in -gpu-a100 plus a few administrative accounts (names omitted). This is the general-user GPU partition."
      image_format: sandbox
      image_format_note: "Measured by spike S1 probe 2 (issue #18) on 2026-10-30: Apptainer 1.4.5 on the compute nodes cannot run a SIF image (the kernel squashfs mount is refused and the squashfuse fallback fails), while a sandbox directory image runs. The PlatformProfile field is partitions[].imageFormat."
      method: measured
      source: "sinfo -h -o '%P|%a|%l|%L|%D|%c|%m|%G|%f|%d|%z'; scontrol show partition; scontrol show node -o (Arch, aggregated)"
      date: 2026-10-30
      note: "Docs list this partition with a 48 h limit, which agrees with the measured 2-00:00:00 (https://docs.hpc.cyfronet.pl/supercomputers/athena/)."
    - name: plgrid-now
      max_time: "01:00:00"
      default_time: "00:15:00"
      nodes: 24
      cpus_per_node: 128
      mem_per_node_mb: 1024000
      gres: "gpu:a100:8"
      arch: "x86_64"
      arch_not_reported: 3
      features: "memfs,localfs,gpustats (scratch on 2 of 24 nodes)"
      qos: "plgrid-now"
      default_partition: false
      priority_tier: 1
      priority_job_factor: 15000
      def_mem_per_cpu_mb: 8000
      access: "Same AllowAccounts pattern as plgrid-gpu-a100. The partition QoS caps a user at one running and one submitted job, with at most cpu=16, one GPU and 125 GB."
      method: measured
      source: "sinfo -h -o '%P|%a|%l|%L|%D|%c|%m|%G|%f|%d|%z'; scontrol show partition; sacctmgr show qos; scontrol show node -o"
      date: 2026-10-30
      note: "A short-job, high-priority lane on the first half of the nodes. The Athena docs page does not list it."
    - name: gpu-a100
      max_time: "2-00:00:00"
      default_time: "00:15:00"
      nodes: 48
      cpus_per_node: 128
      mem_per_node_mb: 1024000
      gres: "gpu:a100:8"
      arch: "x86_64"
      arch_not_reported: 23
      features: "memfs,localfs,gpustats (scratch on 5 of 48 nodes)"
      qos: "N/A"
      default_partition: true
      priority_tier: 2
      priority_job_factor: 1000
      def_mem_per_cpu_mb: 8000
      access: "AllowAccounts is a short list of non-grant (laboratory) accounts plus administrative ones. It is the cluster's default partition; a submission that names no partition was refused for the probing user's default account (see submission.sbatch_test_only)."
      method: measured
      source: "sinfo (partition name carries a * for default); scontrol show partition; scontrol show node -o"
      date: 2026-10-30
    - name: tutorial
      max_time: "2-00:00:00"
      default_time: "00:15:00"
      nodes: 48
      cpus_per_node: 128
      mem_per_node_mb: 1024000
      gres: "gpu:a100:8"
      arch: "x86_64"
      arch_not_reported: 23
      features: "memfs,localfs,gpustats (scratch on 5 of 48 nodes)"
      qos: "N/A"
      default_partition: false
      priority_tier: 1
      priority_job_factor: 5000
      def_mem_per_cpu_mb: 8000
      access: "AllowAccounts is a single training account plus administrative ones: training events only."
      method: measured
      source: "sinfo; scontrol show partition; scontrol show node -o"
      date: 2026-10-30
    - name: all
      max_time: "3-00:00:00"
      default_time: "00:15:00"
      nodes: 48
      cpus_per_node: 128
      mem_per_node_mb: 1024000
      gres: "gpu:a100:8"
      arch: "x86_64"
      arch_not_reported: 23
      features: "memfs,localfs,gpustats (scratch on 5 of 48 nodes)"
      qos: "N/A"
      default_partition: false
      priority_tier: 2
      priority_job_factor: 1000
      def_mem_per_cpu_mb: 8000
      access: "AllowAccounts lists three administrative accounts only: not for users."
      method: measured
      source: "sinfo; scontrol show partition; scontrol show node -o"
      date: 2026-10-30
    - name: 8k3-gpu
      max_time: "14-00:00:00"
      default_time: "00:15:00"
      nodes: 41
      cpus_per_node: 128
      mem_per_node_mb: 1024000
      gres: "gpu:a100:8"
      arch: "x86_64"
      arch_not_reported: 23
      features: "memfs,localfs,gpustats (scratch on 5 of 41 nodes)"
      qos: "N/A"
      default_partition: false
      priority_tier: 2
      priority_job_factor: 1000
      def_mem_per_cpu_mb: 8000
      access: "Dedicated to one project: AllowAccounts lists 16 project accounts, a reservation is required (ReqResv=YES) and submission is allowed from one named host only."
      method: measured
      source: "sinfo; scontrol show partition; scontrol show node -o"
      date: 2026-10-30
    - name: 8k3-gpu-r1
      max_time: "14-00:00:00"
      default_time: "00:15:00"
      nodes: 48
      cpus_per_node: 128
      mem_per_node_mb: 1024000
      gres: "gpu:a100:8"
      arch: "x86_64"
      arch_not_reported: 23
      features: "memfs,localfs,gpustats (scratch on 5 of 48 nodes)"
      qos: "N/A"
      default_partition: false
      priority_tier: 2
      priority_job_factor: 1000
      def_mem_per_cpu_mb: 8000
      access: "Same restriction as 8k3-gpu (project accounts, reservation required, one submit host)."
      method: measured
      source: "sinfo; scontrol show partition; scontrol show node -o"
      date: 2026-10-30
    - name: 8k3-gpu-r2
      max_time: "14-00:00:00"
      default_time: "00:15:00"
      nodes: 48
      cpus_per_node: 128
      mem_per_node_mb: 1024000
      gres: "gpu:a100:8"
      arch: "x86_64"
      arch_not_reported: 23
      features: "memfs,localfs,gpustats (scratch on 5 of 48 nodes)"
