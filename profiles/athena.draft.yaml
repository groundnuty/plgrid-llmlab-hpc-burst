  hardware:
    node_shape:
      value:
        sockets: 2
        cores_per_socket: 64
        threads_per_core: 1
        cpus: 128
        real_memory_mb: 1024000
        gpus_per_node: 8
        gres_name: "gpu:a100:8"
        tmp_disk_mb: 0
        arch: "x86_64"
      method: measured
      source: "scontrol show node -o (Sockets, CoresPerSocket, ThreadsPerCore, CPUTot, RealMemory, Gres, TmpDisk, Arch), aggregated; sinfo -h -o '%P|%d'"
      date: 2026-10-30
      note: "All 48 nodes have the same configured shape. Nodes that report their Arch report x86_64. Some nodes show the GRES as gpu:a100:8(S:0-1), a socket-affinity annotation of the same resource."
    node_documented:
      value:
        cpu: "2x AMD EPYC 7742 64-Core at 2.25 GHz"
        ram_gb: 1024
        ram_available_for_jobs_mb: 1024000
        proportional_ram_per_gpu_mb: 128000
        proportional_cpus_per_gpu: 16
        accelerator: "8x NVIDIA A100-SXM4-40GB"
        interconnect: "InfiniBand HDR"
      method: documented
      source: "https://docs.hpc.cyfronet.pl/supercomputers/athena/"
      date: 2026-10-30
      note: "The GPU model and its 40 GB memory size are known only from the docs; the Slurm GRES name a100 does not carry the memory size. The measured shape above agrees on CPUs, sockets and RAM."
    billing_weights:
      value: "cpu=0.0625, mem=0.0078125G, GRES/gpu=1 (every partition); DefMemPerCPU=8000 MB"
      method: measured
      source: "scontrol show partition (TRESBillingWeights, DefMemPerCPU)"
      date: 2026-10-30
    state_snapshot:
      value: "48 nodes: 23 DOWN+FAIL+NOT_RESPONDING, 4 MIXED, 20 MIXED+RESERVED, 1 IDLE+RESERVED"
      method: measured
      source: "sinfo -h -o '%T|%D'; scontrol show node -o (State, aggregated)"
      date: 2026-10-30
      note: "A transient snapshot, not a platform property. At collection time 23 of 48 nodes did not respond and 21 of the 25 responding nodes carried a reservation flag (reservation names and owners were not read). Capacity open to ordinary jobs can be far below the nominal 48 nodes."

  submission:
    sbatch_test_only:
      value: "refused on the default partition gpu-a100 with the probing user's default account: Invalid account or account/partition combination specified"
      method: measured
      source: "sbatch --test-only --job-name=s5probe --time=00:05:00 --wrap=true"
      date: 2026-10-30
      note: "Exit 1, 'allocation failure: Invalid account or account/partition combination specified'. No -A or -p was given, so the default partition gpu-a100 and the probing user's default account were tried. The likely cause is that the partition's AllowAccounts (laboratory accounts) does not include that account; this was not isolated. No grant was chosen and no further test was run, per the spike rules. That a plain user also needs an explicit partition, plgrid-gpu-a100, is inferred from the default partition's AllowAccounts and the docs, not tested. Whether plgrid-gpu-a100 with a valid -A accepts a test-only job is not measured."
    account_naming:
      value: "grantname-gpu-a100 (the suffix is mandatory; sbatch -A grantname alone fails)"
      method: documented
      source: "https://docs.hpc.cyfronet.pl/environment/batch-system/accounts-and-grants/"
      date: 2026-10-30
      note: "The same page lists the error 'Invalid account or account/partition combination specified' as the symptom of a missing suffix, an inactive grant, an exhausted grant or an expired grant. New grants synchronise with the PLGrid portal every hour."
    grant_helper_tools:
      value: "hpc-grants, hpc-fs, hpc-jobs, hpc-jobs-history"
      method: measured
      source: "command -v hpc-grants hpc-fs hpc-jobs hpc-jobs-history"
      date: 2026-10-30
      note: "All four exist on the login node. Documented in https://docs.hpc.cyfronet.pl/environment/hpc-tools/. Their output was not collected (it holds grant and quota data)."

  login_node:
    os_and_arch:
      value: "Rocky Linux 9.8, x86_64, AMD EPYC-Rome, 32 CPUs"
      method: measured
      source: "cat /etc/os-release; uname -m; lscpu"
      date: 2026-10-30
      note: "One login node. python3 and jq are on PATH (python3 is the system one)."

  containers:
    apptainer_or_singularity_login_node:
      value: false
      method: measured
      source: "command -v apptainer singularity (non-login and login shell); bash -lc 'module -t spider Apptainer / Singularity' (Lmod: Unable to find); rpm -qa | grep -i -E 'apptainer|singularity|enroot|pyxis' (printed nothing)"
      date: 2026-10-30
      note: "On the login node, neither binary is on PATH, neither is an Lmod module (checked in a login shell), and the rpm query printed no such package. The docs say the module tree on Athena is unsupported and that module spider should be run on a compute node for the full list (https://docs.hpc.cyfronet.pl/software/modules/), so this says nothing about compute nodes. The Athena docs pages searched do not mention containers or Apptainer at all."
    apptainer_version:
      value: "none installed on the login node"
      method: measured
      source: "apptainer --version (command not found)"
      date: 2026-10-30
    other_runtimes_login_node:
      value: "none found on PATH: enroot, podman, docker. Not searched for: charliecloud, udocker, sarus, shifter"
      method: measured
      source: "command -v enroot podman docker (non-login and login shell); bash -lc 'module -t spider enroot' (Lmod: Unable to find)"
      date: 2026-10-30
      note: "Login node only. Absence of these on the login node does not show that no runtime exists on the compute nodes."
    pyxis_enroot:
      value: false
      method: measured
      source: "command -v enroot; srun --help | grep -i container; ls /etc/slurm/plugstack.conf*; scontrol show config (PlugStackConfig)"
      date: 2026-10-30
      note: "No enroot, no plugstack.conf and PlugStackConfig=(null), so no SPANK plugin is configured as seen from the login node. srun --help shows only the stock --container and --container-id (OCI bundle) flags, no --container-image. Pyxis is absent on the login node."
    slurm_oci_login_node_view:
      value: "srun lists --container and --container-id; JobContainerType=(null); the /etc/slurm file-name listing has no oci.conf"
      method: measured
      source: "srun --help | grep -i container; scontrol show config (JobContainerType); ls /etc/slurm"
      date: 2026-10-30
      note: "This is what the login node shows. It does not establish whether Slurm's native OCI support is configured for execution on the compute nodes (oci.conf is read where the job runs, and the compute nodes were not inspected)."
    slurm_oci_compute_nodes:
      value: null
      method: unknown
      source: "needs a job; S5 runs none"
      date: 2026-10-30
      note: "Whether Slurm's native OCI container support, or any other container runtime, works on the compute nodes is not known."
    user_namespaces_login_node:
      value: false
      method: measured
      source: "cat /proc/sys/user/max_user_namespaces; unshare -U true; echo $?"
      date: 2026-10-30
      note: "max_user_namespaces is 0. unshare -U and unshare -Ur both exit 1 with 'No space left on device', the error the kernel gives when the namespace limit is 0."
    user_namespaces_compute_nodes:
      value: null
      method: unknown
      source: "needs a job"
      date: 2026-10-30

  storage:
    home_fstype:
      value: "nfs"
      method: measured
      source: "stat -f -c %T $HOME"
      date: 2026-10-30
    home_limit:
      value: "10 GB"
      method: documented
      source: "https://docs.hpc.cyfronet.pl/environment/variables/"
      date: 2026-10-30
    scratch_fstype:
      value: "lustre"
      method: measured
      source: "stat -f -c %T $SCRATCH"
      date: 2026-10-30
    scratch_retention:
      value: "files older than 30 days and job directories older than 7 days are deleted automatically"
      method: documented
      source: "https://docs.hpc.cyfronet.pl/supercomputers/athena/ ; https://docs.hpc.cyfronet.pl/environment/variables/"
      date: 2026-10-30
      note: "The docs say working data belongs in $SCRATCH and computations must not use /tmp; use $SCRATCH or $TMPDIR (https://docs.hpc.cyfronet.pl/environment/general-rules/)."
    group_storage_fstype:
      value: "lustre"
      method: measured
      source: "stat -f -c %T $PLG_GROUPS_STORAGE"
      date: 2026-10-30
    group_storage_properties:
      value: "long-term storage for the life of the grant; transparent compression; quota counts actual disk use (du), not apparent size (ls)"
      method: documented
      source: "https://docs.hpc.cyfronet.pl/supercomputers/athena/ ; https://docs.hpc.cyfronet.pl/environment/variables/"
      date: 2026-10-30
    node_features:
      value: "memfs and localfs on every node; scratch on 5 of 48 nodes; gpustats on every node"
      method: measured
      source: "sinfo -h -o '%P|%f'; scontrol show node -o (AvailableFeatures)"
      date: 2026-10-30
      note: "memfs and localfs are the two local-storage features the docs describe (below). The scratch and gpustats features are not described in the docs pages searched."
    node_local_tmpdisk:
      value: 0
      method: measured
      source: "sinfo -h -o '%P|%d'; scontrol show node -o (TmpDisk)"
      date: 2026-10-30
      note: "TmpDisk is 0 on every partition, so Slurm does not track node-local disk. Local space comes from the memfs and localfs features below."
    memfs:
      value: "RAM-backed volume for the job, requested with -C memfs, path in $MEMFS; counts against the job's memory (--mem); single-node jobs only"
      method: documented
      source: "https://docs.hpc.cyfronet.pl/environment/local-storage-features/"
      date: 2026-10-30
    localfs:
      value: "per-node scratch volume for the job, requested with -C localfs, path in $SCRATCH_LOCAL; optimised for many small files; lost when the job ends"
      method: documented
      source: "https://docs.hpc.cyfronet.pl/environment/local-storage-features/"
      date: 2026-10-30
      note: "Size and filesystem type of the volume are not stated in the docs and are unknown without a job."
    tmpdir_variable:
      value: "unset on the login node"
      method: measured
      source: "shell test for a non-empty $TMPDIR on the login node (printed: unset)"
      date: 2026-10-30
      note: "Value on compute nodes is unknown (needs a job). The docs name $TMPDIR as an allowed temp location."

  time:
    slurm_time_zone:
      value: "Europe/Warsaw, CET +0100 on 2026-10-30"
      method: measured
      source: "date +'%Z %z'; echo TZ=$TZ; timedatectl | grep -i zone; scontrol show config | head -1 compared with date -u"
      date: 2026-10-30
      note: "TZ is unset; timedatectl reports Europe/Warsaw. Slurm client output is in local time: scontrol printed 07:15:25 when date -u printed 06:15:25. Warsaw observes daylight saving, so expect +0200 (CEST) in summer; that part is inferred from the zone name, not measured. This is the zone of a login session's text output, not a property of the scheduler. Epoch fields (for example in JSON output) are unaffected by the session zone, so plugins should prefer epoch or JSON timestamps over parsing text. Compute-node zone is unknown."

  login_node_policy:
    computations_on_login_node:
      value: "prohibited: any computation launched on the access host is killed without notice; the host is for preparing input files and submitting jobs"
      method: documented
      source: "https://docs.hpc.cyfronet.pl/environment/general-rules/"
      date: 2026-10-30
      note: "A per-user memory limit applies to all processes on the host and a process over it is killed (the limit is not stated)."
    long_running_process_allowed:
      value: null
      method: unknown
      source: "https://docs.hpc.cyfronet.pl/environment/general-rules/ (read; the page does not address a lightweight long-running non-compute process such as a poller or a tunnel)"
      date: 2026-10-30
      note: "Not stated either way, and not tested, per the spike rules. The prohibition above covers computations; whether a lightweight poller counts is not documented."
    ssh_connection_limits:
      value: null
      method: unknown
      source: "not probed: S5 did not attempt to read /etc/ssh/sshd_config or sshd_config.d on Athena"
      date: 2026-10-30
      note: "No read was attempted, so nothing is known about MaxStartups, MaxSessions or login throttling here. HBEP-4 mentions throttling from parallel logins."
    gpu_only:
      value: "Athena is for GPU-enabled jobs only; extensive workloads that do not use GPUs lead to account suspension"
      method: documented
      source: "https://docs.hpc.cyfronet.pl/supercomputers/athena/"
      date: 2026-10-30
    compile_and_build:
      value: "not on the login node: it has no development libraries; compile inside a job on a compute node"
      method: documented
      source: "https://docs.hpc.cyfronet.pl/supercomputers/athena/ and https://docs.hpc.cyfronet.pl/environment/general-rules/"
      date: 2026-10-30
    software_tree:
      value: "Lmod modules; the module tree on Athena is unsupported, install your own software in $HOME or the group directory"
      method: documented
      source: "https://docs.hpc.cyfronet.pl/supercomputers/athena/"
      date: 2026-10-30
    lmod_on_login_node:
      value: "Lmod is present; module spider lists CUDA and Python modules"
      method: measured
      source: "bash -lc 'type module; module -t spider CUDA; module -t spider Python'"
      date: 2026-10-30

  reachability:
    compute_node_outbound_internet:
      value: null
      method: unknown
      source: "needs a job; S5 runs none"
      date: 2026-10-30
      prior_observation: "none for Athena; its compute-node outbound access was never tested. The docs pages searched do not mention internet access, proxies or firewalls."
    compute_node_inbound_from_outside:
      value: null
      method: unknown
      source: "https://docs.hpc.cyfronet.pl/ (pages listed under slurmrestd_advertised) say nothing on inbound access to compute nodes; measuring it needs a job"
      date: 2026-10-30

unknown:
  - fact: "compute-node outbound internet"
    reason: "needs a job; S5 runs none. No prior observation; the docs are silent."
  - fact: "compute-node inbound from outside"
    reason: "the docs are silent and a test needs a job"
  - fact: "container runtimes on compute nodes (Apptainer, Singularity, enroot or others), their versions, and whether Slurm's native OCI support is configured there"
    reason: "none of apptainer, singularity, enroot, podman or docker was found on the login node, and the docs do not mention containers; that says nothing about compute nodes, and a check needs a job"
  - fact: "user namespaces on compute nodes"
    reason: "needs a job; the login node has max_user_namespaces=0, which says nothing about compute nodes"
  - fact: "size, filesystem type and permissions of $SCRATCH_LOCAL and $MEMFS on a compute node, and the value of $TMPDIR there"
    reason: "variables exist only inside a job"
  - fact: "GPU driver and CUDA version on compute nodes"
    reason: "not visible from the login node; needs a job"
  - fact: "time zone of compute nodes"
    reason: "needs a job; only the login node was read"
  - fact: "whether sbatch --test-only succeeds with a valid grant account on plgrid-gpu-a100"
    reason: "the default test failed on account/partition; the spike rules forbid choosing a grant"
  - fact: "the login node's per-user memory limit and any process-count or CPU-time limit"
    reason: "the docs state that a limit exists but not its value; probing it was out of scope"
  - fact: "whether a lightweight long-running process (a poller) on the login node is allowed"
    reason: "the docs prohibit computations on the login node but do not address a lightweight poller; S5 must not test it"
  - fact: "ssh connection limits of the login node (MaxStartups, MaxSessions)"
    reason: "not probed: S5 did not attempt to read sshd_config on Athena; HBEP-4 mentions throttling from parallel logins"
  - fact: "whether a slurmrestd service is running and where it is reachable"
    reason: "the binary exists and the docs do not advertise a service; JWT is not enabled, but slurmrestd can also run with local (unix-socket) auth, so reachability for a plain user is unverified"
