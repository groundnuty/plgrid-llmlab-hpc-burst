# PlatformProfile for Athena (Cyfronet, Slurm), alpha (HBEP-4, open questions 3, 7 and 8).
#
# It covers the alpha partition plgrid-gpu-a100, and plgrid-now for conformance runs and short
# checks only (see its entry). Athena is for GPU jobs only.
#
# Where each value comes from (HBEP-4, open question 7). Every typed value has a
# comment that names one of three sources:
#   - a fact in this file's untyped block (spec.profile), as a path from spec.profile.
#     The same path, without "spec.profile.", leads to the fact in profiles/athena.draft.yaml
#     (spike S5; spike S1 added the facts of the hold check and of the compute nodes). A
#     partition is written partitions[name=<p>], since the draft lists partitions.
#   - "derived": a division of such facts, with the numbers shown.
#   - "framework default (HBEP-n, section)": no fact exists; the value is the design's.
# Slurm's "MB" is 2^20 bytes (the Slurm provider sends --mem=<MiB>M), so memory is in Mi.
#
# Content rules (HBEP-4, open question 8): no host name, address, user name, account,
# grant or job ID is in this file; accounts and grants are Provider settings.
apiVersion: hpcburst.groundnuty.github.io/v1alpha1
kind: PlatformProfile
metadata:
  name: athena
spec:
  providerKind: batch # spec.profile.kind

  partitions:
    - name: plgrid-gpu-a100 # spec.profile.facts.partitions[name=plgrid-gpu-a100].name
      gpuModel: A100 # HBEP-4 fixes the string. facts.hardware.node_documented.value.accelerator is "8x NVIDIA A100-SXM4-40GB"; facts.partitions[name=plgrid-gpu-a100].gres is "gpu:a100:8"
      cpuArch: x86_64 # facts.partitions[name=plgrid-gpu-a100].arch
      maxTime: 48h # facts.partitions[name=plgrid-gpu-a100].max_time, "2-00:00:00"
      gpusPerNode: 8 # facts.partitions[name=plgrid-gpu-a100].gres, "gpu:a100:8"
      cpusPerGpu: 16 # facts.hardware.node_documented.value.proportional_cpus_per_gpu
      memPerGpu: 128000Mi # facts.hardware.node_documented.value.proportional_ram_per_gpu_mb, 128000 (the node's 1024000 divided by its 8 GPUs)
      imageFormat: sandbox # facts.containers.apptainer_compute_nodes.value.plgrid-gpu-a100 (S1 probe 2: a SIF fails, a sandbox runs); also facts.partitions[name=plgrid-gpu-a100].image_format
      qos: plgrid # facts.partitions[name=plgrid-gpu-a100].qos, "plgrid" (scontrol show partition, 30 Oct 2026): the QOS Slurm applies to every job on this partition; its limit is typed in qos below

    # plgrid-now: three things (`@hpc-burst-science-agent`, 1 Nov 2026, issue #93).
    #   - cpusPerGpu and memPerGpu are left absent on purpose, so that no Instance is planned here: the
    #     lifecycle controller refuses to size an Instance on a partition that does not give them
    #     (internal/lifecycle, partitionSizing; TestShippedAthenaNowCannotBeSized pins it). Sourcing them
    #     (the QoS cap is cpu=16 and 125G, typed in qos below) would lift that refusal; that waits for
    #     PartitionTooShort, the last step of the QoS work (`@hpc-burst-science-agent`, 1 Nov 2026).
    #   - It is for conformance runs and short checks only: maxTime 1h is shorter than drainWindow (2h10m)
    #     plus handoverMargin (30m), both below. The profile lists it so that the conformance harness can run there.
    #   - Both hold until HBEP-7's PartitionTooShort check lands (maxTime must exceed drainWindow plus
    #     handoverMargin plus health.startTimeout, or the ModelDeployment goes Degraded). No marker field or
    #     controller check is added before then.
    # The measured limits (1 h, one GPU, one running and one submitted job per user) are facts in the untyped
    # block, cited on each value below. The per-user limits are typed in qos (plgrid-now), which this
    # partition names: gpusPerNode stays the node's 8, and the most GPUs one Allocation may request is the
    # smaller of that and the QOS's maxGpusPerUser, 1 (HBEP-4, Submission, GPU sizing and QOS limits).
    # imageFormat is absent as well: probe 2 ran on plgrid-gpu-a100 only.
    - name: plgrid-now # spec.profile.facts.partitions[name=plgrid-now].name
      gpuModel: A100 # HBEP-4 fixes the string. facts.partitions[name=plgrid-now].gres is "gpu:a100:8", the same node type as plgrid-gpu-a100 (facts.hardware.node_documented.value.accelerator, "8x NVIDIA A100-SXM4-40GB")
      cpuArch: x86_64 # facts.partitions[name=plgrid-now].arch
      maxTime: 1h # facts.partitions[name=plgrid-now].max_time, "01:00:00"
      gpusPerNode: 8 # facts.partitions[name=plgrid-now].gres, "gpu:a100:8": the field is a node fact. The per-user cap of one GPU (facts.slurm.qos.value[name=plgrid-now].max_tres_per_user, "cpu=16,gres/gpu=1,mem=125G") is typed in qos below, maxGpusPerUser, and the most GPUs one Allocation may request is the smaller of the two, 1 (`@hpc-burst-science-agent`, 1 Nov 2026). Nothing sizes an Instance here until cpusPerGpu and memPerGpu are given: the absent sizing keeps Instances off this partition
      qos: plgrid-now # facts.partitions[name=plgrid-now].qos, "plgrid-now" (scontrol show partition): the QOS Slurm applies to every job on this partition; its limits are typed in qos below

  # The QOSes that a partition's qos or a Provider's qos names, with the limits the plan reads (HBEP-4,
  # QOS limits and Platform profile schema; `@hpc-burst-science-agent`, 1 Nov 2026). An absent limit is no
  # limit as far as the plan knows. Each partition's QOS is typed: plgrid for plgrid-gpu-a100 and plgrid-now for
  # the partition of that name. A Provider that sets no qos runs under the association's default, which the
  # profile cannot know.
  qos:
    - name: plgrid # facts.slurm.qos.value[name=plgrid] (sacctmgr, 30 Oct 2026): the QOS of plgrid-gpu-a100
      # No wall limit and no per-user TRES limit (facts.slurm.qos.value[name=plgrid].max_wall and .max_tres_per_user are empty), so the partition's maxTime, 48h, is the limit.
      maxSubmitPerUser: 1000 # facts.slurm.qos.value[name=plgrid].max_submit_per_user, 1000. Its max_jobs_per_user is empty, and its flag DenyOnLimit has no typed field
    - name: plgrid-now # facts.slurm.qos.value[name=plgrid-now] (sacctmgr, 30 Oct 2026)
      # maxWall is absent: the QOS has none (facts.slurm.qos.value[name=plgrid-now].max_wall is empty); the partition's maxTime, 1h, is the limit.
      maxSubmitPerUser: 1 # facts.slurm.qos.value[name=plgrid-now].max_submit_per_user, 1 (max_jobs_per_user is 1 as well)
      maxGpusPerUser: 1 # facts.slurm.qos.value[name=plgrid-now].max_tres_per_user, "cpu=16,gres/gpu=1,mem=125G", the GPU entry
      maxCpusPerUser: 16 # the same max_tres_per_user, the CPU entry
      maxMemPerUser: 125Gi # the same max_tres_per_user, the memory entry: Slurm's G is 2^30 bytes, so 125Gi, which is 128000 MiB, the same as plgrid-gpu-a100's memPerGpu

  holdRelease: true # facts.slurm.hold_release.value.plgrid-gpu-a100: user_release_ok true (S1's hold check); facts.slurm.plgrid_now_conformance: the provider's held submit and one release on plgrid-now, 1 Nov 2026
  lostGrace: 2m # framework default (HBEP-4, Platform profile schema, lostGrace): above the measured gap of about 2 s between queue and accounting (S7's capture)
  inflightWindow: 5m # framework default (HBEP-4, Platform profile schema, inflightWindow): 5 min until the sbatch latency over ssh is measured (HBEP-4, Graduation criteria)
  unknownBound: 10m # framework default (HBEP-4, Platform profile schema, unknownBound): S4's default
  timeZone: Europe/Warsaw # facts.time.slurm_time_zone.value, "Europe/Warsaw, CET +0100 on 2026-10-30"
  requeueDefault: true # facts.slurm.job_requeue, "1"
  minJobAge: 10s # facts.slurm.min_job_age, "10 sec"
  # facts.slurm.squeue_json.note: meta.plugin names data_parser/v0.0.40 (HBEP-4, The Slurm dialect), without the
  # prefix. The draft kept no real v0.0.40 document, so the Slurm provider checks it here before alpha (HBEP-4, Graduation criteria).
  jsonDataParser: v0.0.40
  stagingDir: $SCRATCH # facts.storage.scratch_fstype: a Lustre file system, reached through $SCRATCH (HBEP-4, Transport)
  maxIdle: 30m # HBEP-4, Platform profile schema, maxIdle: Athena 30 min (HBEP-7, Retention); motivated by facts.login_node_policy.gpu_only (GPU jobs only)
  # jobName.maxLength is measured, not a default: the conformance run on Athena plgrid-now of 1 Nov 2026
  # (step 5, a 56-character job name submitted and read back unchanged from squeue and from sacct; issue #93, comment 6557645735) is
  # its source, recorded as the fact
  # facts.slurm.plgrid_now_conformance.value.job_name_56_characters_unchanged_in_squeue_and_sacct. The schema holds job-name rules per profile, not per partition, so this value covers
  # plgrid-gpu-a100 too, which has not run the step. That is sound because Athena runs one Slurm
  # configuration for all its partitions, and the read-back is the safety net against a partition-specific rename:
  # a job whose name came back shortened is refused and cancelled (HBEP-4, Risks)
  # (`@hpc-burst-science-agent`, option (b), 1 Nov 2026).
  jobName:
    maxLength: 56

  # Not set, because no fact states it (HBEP-4, Platform profile schema: an unstated fact is absent, not false):
  #   jobName.pattern: unset. No draft records a pattern, and the round trip above used the tag form, which a
  #     pattern would have to match; it records no restriction on the characters.
  #   jobCommentAccounted: unset. HBEP-4 makes it optional and only recorded: the tag is in the job
  #     name either way (`@hpc-burst-science-agent`, 31 Oct 2026).

  drainWindow: 2h10m # framework default (HBEP-4, Platform profile schema, drainWindow; HBEP-5, Draining): the front's 2 h maxRequestDuration plus drainMargin
  drainMargin: 10m # framework default (HBEP-4, Platform profile schema, drainMargin; HBEP-5, Draining)
  handoverMargin: 30m # framework default (HBEP-4, Platform profile schema, handoverMargin; HBEP-7, submission plan)

  # framework default (HBEP-4, Platform profile schema, health; HBEP-7), tuned in beta
  health:
    probeInterval: 10s
    failureThreshold: 3
    noProgressTimeout: 30m # equal to HBEP-5's idleTimeout (HBEP-7, open question 6)
    errorOnlyWindow: 1m
    kvSkewTimeout: 2m
    agentTimeout: 2m
    registrationTimeout: 15m
    startTimeout: 1h
  # framework default (HBEP-4, Platform profile schema, restart; HBEP-7), tuned in beta
  restart:
    stopGrace: 10s
    attemptsPerRung: 2
    window: 30m
    backoff: 30s

  # The untyped block (HBEP-4, open question 3): the draft's root keys, facts and unknown, with the
  # envelope of each fact (value, method, source, date) and the facts of spike S1 added.
  # Nothing in alpha reads it.
  profile:
    draft: s5
    platform: athena
    organization: cyfronet
    kind: batch
    collected: "2026-10-30"         # UTC date
    facts:
      slurm:
        version:
          value: "23.11.7"
          method: measured
          source: "sinfo --version; scontrol show config (SLURM_VERSION)"
          date: "2026-10-30"
        squeue_json:
          value: true
          method: measured
          source: "squeue --me --json"
          date: "2026-10-30"
          note: "Exit 0, output parses as JSON. Top-level keys: errors, jobs, last_backfill, last_update, meta, warnings. meta.plugin names data_parser/v0.0.40 and accounting_storage/slurmdbd."
        sacct_json:
          value: true
          method: measured
          source: "sacct --json -S now-1hours -X"
          date: "2026-10-30"
          note: "Exit 0, output parses as JSON. Top-level keys: errors, jobs, meta, warnings."
        jwt_token:
          value: false
          method: measured
          source: "scontrol token lifespan=60 >/dev/null 2>&1; echo $?"
          date: "2026-10-30"
          note: "Exit code 1. Consistent with the auth lines below: JWT is not an enabled alternative auth type."
        auth_type:
          value: "auth/munge"
          method: measured
          source: "scontrol show config (AuthType)"
          date: "2026-10-30"
        auth_alt_types:
          value: "(null)"
          method: measured
          source: "scontrol show config (AuthAltTypes)"
          date: "2026-10-30"
        auth_alt_parameters:
          value: "(null)"
          method: measured
          source: "scontrol show config (AuthAltParameters)"
          date: "2026-10-30"
        slurmrestd_binary:
          value: "present on PATH of the login node, executable, version 23.11.7"
          method: measured
          source: "command -v slurmrestd; slurmrestd -V"
          date: "2026-10-30"
          note: "Lives in the site's Slurm release tree, not in /usr. JWT is not enabled (see jwt_token), but slurmrestd can also run with local (unix-socket) auth. Whether a slurmrestd service runs, where, and whether a plain user can reach it is not known."
        slurmrestd_advertised:
          value: false
          method: documented
          source: "https://docs.hpc.cyfronet.pl/ (pages: supercomputers/athena, environment/general-rules, environment/batch-system/{overview,commands,accounts-and-grants,examples}, environment/{variables,hpc-tools,local-storage-features}, software/{modules,services}, support)"
          date: "2026-10-30"
          note: "Negative result: a text search of these pages for slurmrestd, REST API and JWT found nothing, and a web search for a Cyfronet REST API page found nothing. This is an absence of mention, not a statement by the centre."
        min_job_age:
          value: "10 sec"
          method: measured
          source: "scontrol show config (MinJobAge)"
          date: "2026-10-30"
          note: "MinJobAge is the minimum age before a completed job's record is purged from the controller, so a completed job can disappear from squeue within about 10 s. Later state must come from sacct."
        job_requeue:
          value: "1"
          method: measured
          source: "scontrol show config (JobRequeue)"
          date: "2026-10-30"
          note: "Jobs are requeueable by default."
        requeue_exit:
          value: "(null)"
          method: measured
          source: "scontrol show config (RequeueExit)"
          date: "2026-10-30"
        requeue_exit_hold:
          value: "(null)"
          method: measured
          source: "scontrol show config (RequeueExitHold)"
          date: "2026-10-30"
        hold_release:
          method: measured
          date: "2026-10-30"
          source: "issue #18 (S1's hold check), commit 35babef on branch spike/s1-frp-dial-home. One job as a plain user with the grant account for the A100 jobs: sbatch --hold --no-requeue --parsable --time=00:02:00 --cpus-per-task=1 --mem=1G --job-name=hb-holdcheck-athena-a100 --partition=plgrid-gpu-a100 --account=<account> --gres=gpu:1 --wrap='sleep 30'; squeue -j <id> -h -o '%T|%r' at once; scontrol release <id>; squeue again after 2 s; scancel <id>; sacct -j <id> -X -n -P -o State -S now-1hours."
          value:
            plgrid-gpu-a100: {hold_honoured: true, state_reason_after_submit: "PENDING|JobHeldUser", user_release_ok: true, release_exit: 0, state_reason_after_release: "PENDING|Priority", final_state: "CANCELLED"}
          note: "A plain user's sbatch --hold was honoured (reason JobHeldUser, not JobHeldAdmin) and the same user released it with scontrol release (exit 0, no message). Two seconds later the job was PENDING with reason Priority, so the release took effect and the job queued normally; it was cancelled at once and never ran. One job, one trial. Not tested: other job shapes (arrays, --begin), how long a held job may stay held before the site purges it, and the other partitions."
        plgrid_now_conformance:
          value: {hold_honoured_and_released_by_the_provider: true, running_hard_end_is_start_plus_limit_utc: true, cancel_on_delete_read_cancelled_from_accounting: true, job_name_56_characters_unchanged_in_squeue_and_sacct: true, sbatch_latency_over_ssh_ms: [87.5, 98.2, 87.9], sacct_tres_allocated_and_requested_gpu: "gres gpu count 1 (untyped), with cpu 4, mem 32768 and billing 1", data_parser: "v0.0.40"}
          method: measured
          source: "the conformance run of internal/providerctl/conformance on plgrid-now, 1 Nov 2026, 11:30Z to 11:33Z, TestConformance: 1 GPU, 4 CPUs, 32Gi, 5 min, --no-requeue; issue #93, comment 6557645735"
          date: "2026-11-01"
          note: "The run passed all five steps (held submit and one release, Running with its hard end, cancel on delete, adoption of a job whose record was lost, the 56-character name). The sacct reply of the running and of the cancelled job carry the same tres list. plgrid-now is the partition the run used, so the hold fact above (plgrid-gpu-a100, S1) and this one agree on one Slurm configuration; plgrid-gpu-a100 itself has not run the conformance."
        max_job_count:
          value: 100000
          method: measured
          source: "scontrol show config (MaxJobCount)"
          date: "2026-10-30"
        max_array_size:
          value: 20001
          method: measured
          source: "scontrol show config (MaxArraySize)"
          date: "2026-10-30"
        kill_wait:
          value: "180 sec"
          method: measured
          source: "scontrol show config (KillWait)"
          date: "2026-10-30"
          note: "Grace between SIGTERM and SIGKILL when a job is cancelled or reaches its time limit."
        over_time_limit:
          value: "0 min"
          method: measured
          source: "scontrol show config (OverTimeLimit)"
          date: "2026-10-30"
        other_limits:
          value:
            MaxStepCount: 40000
            MaxTasksPerNode: 512
            MaxNodeCount: 48
            UnkillableStepTimeout: "300 sec"
            BatchStartTimeout: "10 sec"
            EnforcePartLimits: "ANY"
            AccountingStorageEnforce: "associations,limits,qos"
            SelectType: "select/cons_tres"
            SelectTypeParameters: "CR_CPU_MEMORY"
            TaskPlugin: "task/cgroup,task/affinity"
            ProctrackType: "proctrack/cgroup"
            GresTypes: "gpu"
            PreemptMode: "OFF"
            PriorityType: "priority/multifactor"
            SchedulerType: "sched/backfill"
            PrologFlags: "Alloc,DeferBatch,NoHold"
            JobSubmitPlugins: "lua"
            SrunPortRange: "0-0"
          method: measured
          source: "scontrol show config"
          date: "2026-10-30"
          note: "A Lua job_submit plugin runs at submission and may reject or rewrite jobs (its content was not read). AccountingStorageEnforce makes a valid association mandatory."
        scheduler_parameters:
          value: "max_switch_wait=86400,default_queue_depth=2000,bf_max_job_test=2000,bf_max_job_part=1000,bf_continue,assoc_limit_continue,batch_sched_delay=10,bf_interval=30,kill_invalid_depend,sbatch_wait_nodes,salloc_wait_nodes,pack_serial_at_end,max_rpc_cnt=5000,bf_window=4320,bf_max_job_start=10000,disable_hetero_steps,sched_min_interval=2000000,sched_max_job_start=10000,max_script_size=1048576"
          method: measured
          source: "scontrol show config (SchedulerParameters)"
          date: "2026-10-30"
          note: "Full string as printed. bf_window=4320 minutes (3 days)."
        qos:
          value:
            - {name: normal, max_wall: "", priority: 0, max_jobs_per_user: "", max_submit_per_user: "", max_tres_per_user: "", flags: ""}
            - {name: plgrid, max_wall: "", priority: 0, max_jobs_per_user: "", max_submit_per_user: 1000, max_tres_per_user: "", flags: "DenyOnLimit"}
            - {name: plgrid-now, max_wall: "", priority: 0, max_jobs_per_user: 1, max_submit_per_user: 1, max_tres_per_user: "cpu=16,gres/gpu=1,mem=125G", flags: "DenyOnLimit"}
            - {name: plgrid-services, max_wall: "", priority: 0, max_jobs_per_user: 2, max_submit_per_user: "", max_tres_per_user: "", flags: ""}
            - {name: 1week, max_wall: "7-00:00:00", priority: 0, max_jobs_per_user: 2, max_submit_per_user: "", max_tres_per_user: "", flags: "DenyOnLimit,PartitionTimeLimit"}
            - {name: tutorial, max_wall: "", priority: 100000, max_jobs_per_user: "", max_submit_per_user: "", max_tres_per_user: "", flags: "DenyOnLimit"}
            - {name: vip, max_wall: "", priority: 100000, max_jobs_per_user: "", max_submit_per_user: "", max_tres_per_user: "", flags: "DenyOnLimit"}
            - {name: ip, max_wall: "", priority: 50000, max_jobs_per_user: "", max_submit_per_user: "", max_tres_per_user: "", flags: "DenyOnLimit"}
            - {name: lip, max_wall: "", priority: 20000, max_jobs_per_user: "", max_submit_per_user: "", max_tres_per_user: "", flags: "DenyOnLimit"}
            - {name: llip, max_wall: "", priority: 10000, max_jobs_per_user: "", max_submit_per_user: "", max_tres_per_user: "", flags: "DenyOnLimit"}
          method: measured
          source: "sacctmgr -n -P show qos format=Name,MaxWall,Priority,MaxJobsPU,MaxSubmitPU,MaxTRESPU,Flags,Preempt"
          date: "2026-10-30"
          note: "Empty string means no limit. The partition QoS is applied to every job in that partition: plgrid for plgrid-gpu-a100, plgrid-now for plgrid-now (see partitions). So a plain user may hold 1000 submitted jobs in plgrid-gpu-a100, but only one job (one GPU, 16 CPUs, 125 GB) in plgrid-now."

      # One entry per partition seen by a plain user (scontrol show partition lists
      # eight, none hidden). Per-node numbers are the same on every partition: the
      # 48 nodes are one hardware type. "arch_not_reported" counts nodes that were
      # DOWN+FAIL+NOT_RESPONDING at collection and so show an empty Arch field.
      # Node counts include those nodes.
      partitions:
        - name: plgrid-gpu-a100
          max_time: "2-00:00:00"
          default_time: "00:15:00"
          nodes: 48
          cpus_per_node: 128
          mem_per_node_mb: 1024000
          gres: "gpu:a100:8"
          arch: "x86_64"
          arch_not_reported: 23
          features: "memfs,localfs,gpustats (scratch on 5 of 48 nodes)"
          qos: "plgrid"
          default_partition: false
          priority_tier: 1
          priority_job_factor: 1000
          def_mem_per_cpu_mb: 8000
          access: "AllowAccounts lists grant accounts that end in -gpu-a100 plus a few administrative accounts (names omitted). This is the general-user GPU partition."
          image_format: sandbox
          image_format_note: "Measured by spike S1 probe 2 (issue #18) on 2026-10-30: Apptainer 1.4.5 on the compute nodes cannot run a SIF image (the kernel squashfs mount is refused and the squashfuse fallback fails), while a sandbox directory image runs. The PlatformProfile field is partitions[].imageFormat."
          method: measured
          source: "sinfo -h -o '%P|%a|%l|%L|%D|%c|%m|%G|%f|%d|%z'; scontrol show partition; scontrol show node -o (Arch, aggregated)"
          date: "2026-10-30"
          note: "Docs list this partition with a 48 h limit, which agrees with the measured 2-00:00:00 (https://docs.hpc.cyfronet.pl/supercomputers/athena/)."
        - name: plgrid-now
          max_time: "01:00:00"
          default_time: "00:15:00"
          nodes: 24
          cpus_per_node: 128
          mem_per_node_mb: 1024000
          gres: "gpu:a100:8"
          arch: "x86_64"
          arch_not_reported: 3
          features: "memfs,localfs,gpustats (scratch on 2 of 24 nodes)"
          qos: "plgrid-now"
          default_partition: false
          priority_tier: 1
          priority_job_factor: 15000
          def_mem_per_cpu_mb: 8000
          access: "Same AllowAccounts pattern as plgrid-gpu-a100. The partition QoS caps a user at one running and one submitted job, with at most cpu=16, one GPU and 125 GB."
          method: measured
          source: "sinfo -h -o '%P|%a|%l|%L|%D|%c|%m|%G|%f|%d|%z'; scontrol show partition; sacctmgr show qos; scontrol show node -o"
          date: "2026-10-30"
          note: "A short-job, high-priority lane on the first half of the nodes. The Athena docs page does not list it."
        - name: gpu-a100
          max_time: "2-00:00:00"
          default_time: "00:15:00"
          nodes: 48
          cpus_per_node: 128
          mem_per_node_mb: 1024000
          gres: "gpu:a100:8"
          arch: "x86_64"
          arch_not_reported: 23
          features: "memfs,localfs,gpustats (scratch on 5 of 48 nodes)"
          qos: "N/A"
          default_partition: true
          priority_tier: 2
          priority_job_factor: 1000
          def_mem_per_cpu_mb: 8000
          access: "AllowAccounts is a short list of non-grant (laboratory) accounts plus administrative ones. It is the cluster's default partition; a submission that names no partition was refused for the probing user's default account (see submission.sbatch_test_only)."
          method: measured
          source: "sinfo (partition name carries a * for default); scontrol show partition; scontrol show node -o"
