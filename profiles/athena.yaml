      containers:
        apptainer_or_singularity_login_node:
          value: false
          method: measured
          source: "command -v apptainer singularity (non-login and login shell); bash -lc 'module -t spider Apptainer / Singularity' (Lmod: Unable to find); rpm -qa | grep -i -E 'apptainer|singularity|enroot|pyxis' (printed nothing)"
          date: "2026-10-30"
          note: "On the login node, neither binary is on PATH, neither is an Lmod module (checked in a login shell), and the rpm query printed no such package. The docs say the module tree on Athena is unsupported and that module spider should be run on a compute node for the full list (https://docs.hpc.cyfronet.pl/software/modules/), so this says nothing about compute nodes. The Athena docs pages searched do not mention containers or Apptainer at all."
        apptainer_version:
          value: "none installed on the login node"
          method: measured
          source: "apptainer --version (command not found)"
          date: "2026-10-30"
        apptainer_compute_nodes:
          value:
            plgrid-gpu-a100:
              present: true
              version: "1.4.5"
              path: /usr/bin/apptainer
              install: "setuid (apptainer-suid RPM; starter-suid mode 4755, owner root)"
              exec_works: "partly: a directory (sandbox) image runs; a SIF (squashfs) image fails"
              exec_sif_works: false
              exec_sandbox_works: true
              arch: x86_64
          method: measured
          source: "issue #18, comment 6542078107 (S1 probe 2). S1 probe 2, three jobs on plgrid-gpu-a100 (two different nodes): command -v apptainer singularity; apptainer --version; rpm -q apptainer apptainer-suid; apptainer buildcfg | grep -i suid; apptainer exec docker://busybox:1.36 true (exit 255 on every attempt: six on one node, two on the other); apptainer build --sandbox from the same image (exit 0) then apptainer exec on the directory: true (exit 0) and busybox uname -m inside the container (x86_64), on both nodes; apptainer --debug exec; unsquashfs -s on the login node"
          date: "2026-10-30"
          note: "Apptainer exists on the compute nodes only: apptainer-1.4.5-2.el9.x86_64 and apptainer-suid, at /usr/bin/apptainer, plus /usr/bin/singularity. It is not an Lmod module (module avail apptainer lists nothing; module spider apptainer and singularity report 'Unable to find'), and the login node has neither. The anonymous Docker Hub pull and the conversion to a SIF succeed (a 2.2 MB gzip squashfs that unsquashfs reads on the login node), but running the SIF fails every time with 'image driver squashfuse_ll instance exited with error ... Something went wrong trying to read the squashfs image'. The debug log shows why that driver is used: in setuid mode the kernel squashfs mount is 'not allowed because ECL not activated' (and squashfs is not listed in /proc/filesystems on the node), so Apptainer falls back to the squashfuse_ll image driver, and that driver fails on both nodes. /dev/fuse is world read-write. The root cause of the squashfuse_ll failure was not found. A sandbox directory needs no squashfs mount and works: build it with apptainer build --sandbox <dir> docker://<image>, then apptainer exec <dir>. The container ran in setuid mode (identity uid_map; apptainer exec --userns refused). Three jobs, two nodes, one partition. Whether a SIF built on another machine (not converted on the node) behaves differently was not tested."
        other_runtimes_login_node:
          value: "none found on PATH: enroot, podman, docker. Not searched for: charliecloud, udocker, sarus, shifter"
          method: measured
          source: "command -v enroot podman docker (non-login and login shell); bash -lc 'module -t spider enroot' (Lmod: Unable to find)"
          date: "2026-10-30"
          note: "Login node only. Absence of these on the login node does not show that no runtime exists on the compute nodes."
        pyxis_enroot:
          value: false
          method: measured
          source: "command -v enroot; srun --help | grep -i container; ls /etc/slurm/plugstack.conf*; scontrol show config (PlugStackConfig)"
          date: "2026-10-30"
          note: "No enroot, no plugstack.conf and PlugStackConfig=(null), so no SPANK plugin is configured as seen from the login node. srun --help shows only the stock --container and --container-id (OCI bundle) flags, no --container-image. Pyxis is absent on the login node."
        slurm_oci_login_node_view:
          value: "srun lists --container and --container-id; JobContainerType=(null); the /etc/slurm file-name listing has no oci.conf"
          method: measured
          source: "srun --help | grep -i container; scontrol show config (JobContainerType); ls /etc/slurm"
          date: "2026-10-30"
          note: "This is what the login node shows. It does not establish whether Slurm's native OCI support is configured for execution on the compute nodes (oci.conf is read where the job runs, and the compute nodes were not inspected)."
        slurm_oci_compute_nodes:
          value: null
          method: unknown
          source: "needs a job; S5 runs none"
          date: "2026-10-30"
          note: "Whether Slurm's native OCI container support, or any container runtime other than Apptainer, works on the compute nodes is not known. Apptainer on the compute nodes was measured later: see apptainer_compute_nodes."
        user_namespaces_login_node:
          value: false
          method: measured
          source: "cat /proc/sys/user/max_user_namespaces; unshare -U true; echo $?"
          date: "2026-10-30"
          note: "max_user_namespaces is 0. unshare -U and unshare -Ur both exit 1 with 'No space left on device', the error the kernel gives when the namespace limit is 0."
        user_namespaces_compute_nodes:
          value: {plgrid-gpu-a100: false}
          method: measured
          source: "issue #18, comment 6542078107 (S1 probe 2). S1 probe 2 job on plgrid-gpu-a100: unshare -U true; unshare -Ur true; apptainer exec --userns; cat /proc/sys/user/max_user_namespaces"
          date: "2026-10-30"
          note: "unshare -U and unshare -Ur both fail with 'No space left on device' (the kernel's report of a zero limit) and apptainer exec --userns fails with 'maximum number of user namespaces exceeded'. Reading /proc/sys/user/max_user_namespaces itself failed with 'Cannot allocate memory', so the limit's value was not read; the failures above are the evidence. Containers therefore depend on the setuid Apptainer install."

