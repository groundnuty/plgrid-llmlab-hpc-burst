          value: "grantname-gpu-a100 (the suffix is mandatory; sbatch -A grantname alone fails)"
          method: documented
          source: "https://docs.hpc.cyfronet.pl/environment/batch-system/accounts-and-grants/"
          date: "2026-10-30"
          note: "The same page lists the error 'Invalid account or account/partition combination specified' as the symptom of a missing suffix, an inactive grant, an exhausted grant or an expired grant. New grants synchronise with the PLGrid portal every hour."
        grant_helper_tools:
          value: "hpc-grants, hpc-fs, hpc-jobs, hpc-jobs-history"
          method: measured
          source: "command -v hpc-grants hpc-fs hpc-jobs hpc-jobs-history"
          date: "2026-10-30"
          note: "All four exist on the login node. Documented in https://docs.hpc.cyfronet.pl/environment/hpc-tools/. Their output was not collected (it holds grant and quota data)."
        plgrid_now_start:
          value: "a one-GPU test-only job on plgrid-now, 5 min limit, was estimated to start at once with 1 CPU, and with 4 CPUs and 32768M; with 16 CPUs and 128000M (the QoS cap) it was estimated to start 52 min later"
          method: measured
          source: "sbatch --test-only --no-requeue --partition=plgrid-now --account=<account> --nodes=1 --gres=gpu:1 --time=<5 or 2 min> [--cpus-per-task=<c> --mem=<m>M] --wrap=true; five calls on 2026-11-01 between 11:22Z and 11:31Z (issue #93, comment 6557645735)"
          date: "2026-11-01"
          note: "Slurm prints the estimate in local time (Europe/Warsaw, CET +0100 since 25 Oct), so an estimate equal to the probe instant converted to UTC means a start at once. A transient snapshot: 2 of the partition's 24 nodes were mixed, 2 allocated, 3 failed and 17 in a reservation, so a request that needs most of a node's CPUs and memory finds none free. The same calls showed the partition's limits again: MaxTime 01:00:00 (scontrol show partition) and, on the partition's QoS, MaxTRESPerUser cpu=16,gres/gpu=1,mem=125G, MaxJobsPerUser 1, MaxSubmitJobsPerUser 1, no MaxWall, DenyOnLimit (sacctmgr show qos), as in slurm.qos."

