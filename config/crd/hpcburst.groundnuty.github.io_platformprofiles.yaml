---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: platformprofiles.hpcburst.groundnuty.github.io
spec:
  group: hpcburst.groundnuty.github.io
  names:
    categories:
    - hpcburst
    kind: PlatformProfile
    listKind: PlatformProfileList
    plural: platformprofiles
    singular: platformprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerKind
      name: ProviderKind
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PlatformProfile is what is true for everyone on a platform, as data
          (HBEP-3, HBEP-4). All Providers of one platform share one.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PlatformProfileSpec is the platform's kind and its profile data. HBEP-4
              owns the schema. For alpha the fields that the Slurm provider and the
              deployment ID read are typed; the rest of the profile is an untyped block.
              The typed fields carry the names HBEP-11 gives them, in camelCase like every
              field of the API (HBEP-11's hold_release is holdRelease), and the scheduling
              facts of spikes S4 and S5 are typed beside them (HBEP-11, API, PlatformProfile
              schema). A fact the platform does not state, or one
              that does not apply to its kind, is absent: an absent bool is unknown, not
              false. The schema defaults (drainWindow, drainMargin, handoverMargin, health,
              restart) are written on every profile, a managed one included; HBEP-4 gives a
              managed profile no batch fields, so nothing reads them there.
            properties:
              drainMargin:
                default: 10m
                description: |-
                  DrainMargin is the margin above a request's longest duration in the
                  drain window. An Instance's window is DrainWindow, or its
                  ModelDeployment's routing.maxRequestDuration plus this margin when that
                  is shorter. The front and the lifecycle controller both read it, so
                  both compute the same drain start (InstanceDrainWindow; HBEP-4; HBEP-5,
                  Draining).
                maxLength: 63
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                type: string
                x-kubernetes-validations:
                - message: drainMargin must be a duration that fits Go's time.Duration
                    (at most 2562047h)
                  rule: duration(self) >= duration('0s')
              drainWindow:
                default: 2h10m
                description: |-
                  DrainWindow is HBEP-5's drain window: an Instance drains from its hard
                  end minus this. It is at least the front's maxRequestDuration (2 h)
                  plus DrainMargin, so its default is 2 h 10 min (owner decision, 30 Oct
                  2026). A ModelDeployment may only shorten it, through
                  routing.maxRequestDuration (InstanceDrainWindow; HBEP-4, open question
                  11). The front checks the bound and raises DrainWindowShort when a
                  profile breaks it (HBEP-5, Draining).
                maxLength: 63
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                type: string
                x-kubernetes-validations:
                - message: drainWindow must be a positive duration that fits Go's
                    time.Duration (above 0s, at most 2562047h)
                  rule: duration(self) > duration('0s')
              handoverMargin:
                default: 30m
                description: |-
                  HandoverMargin is the margin in HBEP-7's submission plan: a replacement
                  is submitted at the drain start minus (the p90 observed queue wait + the
                  start-to-ready time + this margin), never before its predecessor's start.
                maxLength: 63
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                type: string
                x-kubernetes-validations:
                - message: handoverMargin must be a duration that fits Go's time.Duration
                    (at most 2562047h)
                  rule: duration(self) >= duration('0s')
              health:
                default: {}
                description: Health holds HBEP-7's malfunction thresholds and start
                  deadlines.
                properties:
                  agentTimeout:
                    default: 2m
                    description: |-
                      AgentTimeout is how long an agent may send no report before its
                      Instance is AgentUnreachable.
                    maxLength: 63
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: agentTimeout must be a positive duration that fits
                        Go's time.Duration (above 0s, at most 2562047h)
                      rule: duration(self) > duration('0s')
                  errorOnlyWindow:
                    default: 1m
                    description: ErrorOnlyWindow is how long every answer may be a
                      server error.
                    maxLength: 63
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: errorOnlyWindow must be a positive duration that fits
                        Go's time.Duration (above 0s, at most 2562047h)
                      rule: duration(self) > duration('0s')
                  failureThreshold:
                    default: 3
                    description: FailureThreshold is how many failed probes in a row
                      are a malfunction.
                    format: int32
                    minimum: 1
                    type: integer
                  kvSkewTimeout:
                    default: 2m
                    description: |-
                      KVSkewTimeout is how long one worker may sit at a full KV cache with
                      requests waiting while another idles. It needs several workers, so alpha
                      does not use it.
                    maxLength: 63
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: kvSkewTimeout must be a positive duration that fits
                        Go's time.Duration (above 0s, at most 2562047h)
                      rule: duration(self) > duration('0s')
                  noProgressTimeout:
                    default: 30m
                    description: |-
                      NoProgressTimeout is how long requests may run with the generated-token
                      counter unchanged. A request in prefill generates no token, so in alpha
                      it is 30 min, equal to the front's idleTimeout, and a slow prefill that
                      the front allows is never restarted (HBEP-4, Platform profile schema;
                      HBEP-7, open question 6; HBEP-5).
                    maxLength: 63
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: noProgressTimeout must be a positive duration that
                        fits Go's time.Duration (above 0s, at most 2562047h)
                      rule: duration(self) > duration('0s')
                  probeInterval:
                    default: 10s
                    description: ProbeInterval is how often the agent probes the engine's
                      health.
                    maxLength: 63
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: probeInterval must be a positive duration that fits
                        Go's time.Duration (above 0s, at most 2562047h)
                      rule: duration(self) > duration('0s')
                  registrationTimeout:
                    default: 15m
                    description: |-
                      RegistrationTimeout is the longest time from the job's start to its
                      agent's registration.
                    maxLength: 63
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: registrationTimeout must be a positive duration that
                        fits Go's time.Duration (above 0s, at most 2562047h)
                      rule: duration(self) > duration('0s')
                  startTimeout:
                    default: 1h
                    description: |-
                      StartTimeout is the longest time from an Instance's own start
                      instruction to ready.
                    maxLength: 63
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: startTimeout must be a positive duration that fits
                        Go's time.Duration (above 0s, at most 2562047h)
                      rule: duration(self) > duration('0s')
                type: object
              holdRelease:
                default: false
                description: |-
                  HoldRelease says whether a plain user's sbatch --hold is honoured and
                  that user can lift it. It is verified per platform. False runs the
                  fallback mode of spike S4 (HBEP-7, open question 11).
                type: boolean
              inflightWindow:
                description: |-
                  InflightWindow is how long an unresolved submission attempt is waited
                  on. It must exceed the worst remote sbatch time, because a local timeout
                  does not stop a remote sbatch. The platform's measured value is set
                  here; there is no default.
                maxLength: 63
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                type: string
                x-kubernetes-validations:
                - message: inflightWindow must be a positive duration that fits Go's
                    time.Duration (above 0s, at most 2562047h)
                  rule: duration(self) > duration('0s')
              jobCommentAccounted:
                description: |-
                  JobCommentAccounted says whether accounting keeps the job comment. Where
                  it does not, the job name is the only tag that survives in accounting
                  (spike S4).
                type: boolean
              jobName:
                description: JobName holds the platform's job-name rules.
                properties:
                  maxLength:
                    description: |-
                      MaxLength is the longest job name the platform accepts. Absent when the
                      platform states none.
                    format: int32
                    maximum: 4096
                    minimum: 1
                    type: integer
                  pattern:
                    description: |-
                      Pattern is a regular expression (RE2) that a job name matches, when the
                      platform restricts the characters of a name. Absent when it does not.
                    maxLength: 256
                    minLength: 1
                    type: string
                type: object
              jsonDataParser:
                description: |-
                  JSONDataParser is the version of the scheduler's JSON output without its
                  "data_parser/" prefix: "v0.0.40" or "v0.0.42" for Slurm. Every reply's
                  meta.plugin.data_parser, with the prefix stripped, must equal it, or the
                  reply is not interpreted and the Provider gets DialectMismatch (HBEP-4,
                  The Slurm dialect). A plugin parses only the versions it knows.
                maxLength: 64
                minLength: 1
                pattern: ^[A-Za-z0-9][A-Za-z0-9_./-]*$
                type: string
              lostGrace:
                default: 2m
                description: |-
                  LostGrace is how long a recorded job may be absent from both the queue
                  listing and accounting before it is reported Lost.
                maxLength: 63
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                type: string
                x-kubernetes-validations:
                - message: lostGrace must be a positive duration that fits Go's time.Duration
                    (above 0s, at most 2562047h)
                  rule: duration(self) > duration('0s')
              maxIdle:
                description: |-
                  MaxIdle releases an Allocation with no Instance after this long, even
                  when its retention policy says keep (HBEP-7, Retention). It counts from
                  the Allocation's idle-since annotation (AnnotationIdleSince). Unset,
                  there is no cap.
                maxLength: 63
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                type: string
                x-kubernetes-validations:
                - message: maxIdle must be a positive duration that fits Go's time.Duration
                    (above 0s, at most 2562047h)
                  rule: duration(self) > duration('0s')
              minJobAge:
                description: |-
                  MinJobAge is how long a finished job stays in the queue listing before
                  the scheduler purges it (for Slurm, MinJobAge). A plugin that reads only
                  the queue loses the final state of a job older than this, so it asks
                  accounting (HBEP-4).
                maxLength: 63
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                type: string
                x-kubernetes-validations:
                - message: minJobAge must be a duration that fits Go's time.Duration
                    (at most 2562047h)
                  rule: duration(self) >= duration('0s')
              partitions:
                description: Partitions lists the accelerator class of each partition.
                items:
                  description: |-
                    PartitionProfile is what the framework reads of one partition: its name and
                    its accelerator class (HBEP-11, API, PlatformProfile schema).
                  properties:
                    cpuArch:
                      description: CPUArch is the CPU architecture, for example "aarch64"
                        or "x86_64".
                      maxLength: 63
                      minLength: 1
                      type: string
                    cpusPerGpu:
                      description: CPUsPerGPU is the CPUs an Allocation requests per
                        GPU.
                      format: int32
                      maximum: 4096
                      minimum: 1
                      type: integer
                    gpuModel:
                      description: GPUModel is the GPU model. A partition without
                        GPUs names "none".
                      maxLength: 63
                      minLength: 1
                      type: string
                    gpusPerNode:
                      description: GPUsPerNode is the most GPUs one Allocation may
                        request here.
                      format: int32
                      maximum: 1024
                      minimum: 0
                      type: integer
                    imageFormat:
                      description: |-
                        ImageFormat is the container image format Apptainer runs on the
                        partition's compute nodes: sif, a single image file, or sandbox, an
                        unpacked directory. The allocation agent builds and runs the engine
                        image in this format, which the lifecycle controller sends it in the
                        desired state (agentapi.AgentSettings.ImageFormat). It is not a
                        deployment-ID input: both formats run the same image digest. Spike S1's
                        probe 2 measured it: on Helios plgrid-gpu-gh200 a SIF runs (sif); on
                        Athena plgrid-gpu-a100 Apptainer cannot run a SIF on the compute nodes
                        and a sandbox directory runs (sandbox). Absent, the platform has not
                        stated it, and the agent is sent sif, Apptainer's own format
                        (ImageFormatOf).
                      enum:
                      - sif
                      - sandbox
                      type: string
                    maxTime:
                      description: |-
                        MaxTime is the partition's longest time limit (HBEP-4, Platform profile
                        schema, the fields the lifecycle controller reads).
                      maxLength: 63
                      pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                      type: string
                      x-kubernetes-validations:
                      - message: maxTime must be a positive duration that fits Go's
                          time.Duration (above 0s, at most 2562047h)
                        rule: duration(self) > duration('0s')
                    memPerGpu:
                      anyOf:
                      - type: integer
                      - type: string
                      description: MemPerGPU is the memory an Allocation requests
                        per GPU.
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    name:
                      description: Name of the partition.
                      maxLength: 253
                      minLength: 1
                      type: string
                    tmpDir:
                      description: |-
                        TmpDir is the job's temporary directory on this partition: the batch
                        script sets TMPDIR to it before it starts the allocation agent, which
                        keeps its run directory (the engine's socket) and Apptainer's build tree
                        there. It has stagingDir's form, an absolute path or one that starts
                        with an environment variable, but the variable is one the job sets, such
                        as $SCRATCH_LOCAL, the node-local disk of Helios's localfs feature, so it
                        is expanded inside the job, never on the login node. A variable that is
                        unset or empty there stops the job before the agent starts. Absent, the
                        job keeps the TMPDIR the scheduler gives it (science-agent ruling, 1 Nov
                        2026, issue #125: on Helios plgrid-gpu-gh200 that TMPDIR is on Lustre,
                        near its inode quota).
                      maxLength: 1024
                      minLength: 1
                      pattern: ^(/|\$[A-Za-z_][A-Za-z0-9_]*)[A-Za-z0-9._:=,/-]*$
                      type: string
                      x-kubernetes-validations:
                      - message: tmpDir must not contain a '..' segment
                        rule: '!self.split(''/'').exists(s, s == ''..'')'
                    tmpDirFeature:
                      description: |-
                        TmpDirFeature is the Slurm node feature that TmpDir needs, such as
                        localfs, the feature that gives a Helios job its node-local disk in
                        $SCRATCH_LOCAL. The Slurm provider then submits with
                        --constraint=<feature>, so the job lands on a node that sets TmpDir's
                        variable. One feature name, never a constraint expression. Absent, no
                        constraint is added (science-agent ruling, 1 Nov 2026, issue #125). It
                        requires TmpDir.
                      maxLength: 64
                      minLength: 1
                      pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                      type: string
                  required:
                  - cpuArch
                  - gpuModel
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: tmpDirFeature is the node feature that tmpDir needs,
                      so it requires tmpDir
                    rule: '!has(self.tmpDirFeature) || has(self.tmpDir)'
                maxItems: 256
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              profile:
                description: |-
                  Profile is the rest of the profile, untyped: the facts that are not typed
                  above, with the provenance envelope of each (value, method, source and
                  date; HBEP-4, open question 7), until HBEP-4 fixes the schema.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              providerKind:
                description: |-
                  ProviderKind is managed, batch or static: the kind of provider the
                  platform offers (HBEP-3, Vocabulary, Provider). It is not the object's
                  own kind, which is PlatformProfile.
                enum:
                - managed
                - batch
                - static
                type: string
              requeueDefault:
                description: |-
                  RequeueDefault says whether the scheduler requeues a job by default (for
                  Slurm, JobRequeue). The framework submits with --no-requeue either way;
                  the fact records what a job without it would do (HBEP-4).
                type: boolean
              restart:
                default: {}
                description: Restart holds HBEP-7's restart ladder.
                properties:
                  attemptsPerRung:
                    default: 2
                    description: AttemptsPerRung is how many times each rung is tried
                      within Window.
                    format: int32
                    minimum: 1
                    type: integer
                  backoff:
                    default: 30s
                    description: Backoff is the time between two attempts.
                    maxLength: 63
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: backoff must be a duration that fits Go's time.Duration
                        (at most 2562047h)
                      rule: duration(self) >= duration('0s')
                  stopGrace:
                    default: 10s
                    description: |-
                      StopGrace is how long the agent waits after a polite stop before it
                      kills a part.
                    maxLength: 63
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: stopGrace must be a duration that fits Go's time.Duration
                        (at most 2562047h)
                      rule: duration(self) >= duration('0s')
                  window:
                    default: 30m
                    description: Window is the time over which attempts are counted.
                    maxLength: 63
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: window must be a positive duration that fits Go's time.Duration
                        (above 0s, at most 2562047h)
                      rule: duration(self) > duration('0s')
                type: object
              stagingDir:
                description: |-
                  StagingDir is where the agent binary, Allocation directories, images
                  and checkpoints live: an absolute path, or one that starts with an
                  environment variable set on login and compute nodes, such as $SCRATCH,
                  which the provider resolves on the login node once per connection
                  (HBEP-4, Transport).
                maxLength: 1024
                minLength: 1
                pattern: ^(/|\$[A-Za-z_][A-Za-z0-9_]*)[A-Za-z0-9._:=,/-]*$
                type: string
                x-kubernetes-validations:
                - message: 'stagingDir must not contain a ''..'' segment: agent.json
                    refuses one (agentapi.AgentConfig)'
                  rule: '!self.split(''/'').exists(s, s == ''..'')'
              timeZone:
                description: |-
                  TimeZone is the IANA name of the time zone in which the scheduler prints
                  local times, for example "Europe/Warsaw" or "UTC". A plugin that has to
                  parse a text time uses it, and converts every time to UTC; epoch fields
                  need no zone (HBEP-4, local time in scheduler output).
                maxLength: 64
                minLength: 1
                pattern: ^[A-Za-z][A-Za-z0-9_+-]*(/[A-Za-z0-9_+-]+)*$
                type: string
              unknownBound:
                default: 10m
                description: |-
                  UnknownBound is how long, in fallback mode, an Unknown attempt may stay
                  unresolved before an operator is asked.
                maxLength: 63
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                type: string
                x-kubernetes-validations:
                - message: unknownBound must be a positive duration that fits Go's
                    time.Duration (above 0s, at most 2562047h)
                  rule: duration(self) > duration('0s')
            required:
            - providerKind
            type: object
            x-kubernetes-validations:
            - message: jobName.maxLength must allow the job tag's 56 characters (HBEP-3,
                Allocation and job identity)
              rule: '!has(self.jobName) || !has(self.jobName.maxLength) || self.jobName.maxLength
                >= 56'
          status:
            description: PlatformProfileStatus is the observed state of a PlatformProfile.
            properties:
              lastChecked:
                description: |-
                  LastChecked is when the profile's facts were last checked. No
                  component writes it in alpha: nothing checks a profile's facts yet
                  (docs/development.md, Writers).
                format: date-time
                type: string
              lastReconcileTime:
                description: LastReconcileTime is when the controller last reconciled
                  the object.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation the controller last
                  reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
