---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: providers.hpcburst.groundnuty.github.io
spec:
  group: hpcburst.groundnuty.github.io
  names:
    categories:
    - hpcburst
    kind: Provider
    listKind: ProviderList
    plural: providers
    singular: provider
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.platformProfileRef.name
      name: Profile
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Provider is our access to one platform: an account or grant, its credentials
          and its settings (HBEP-3). Provider names are DNS-1123 labels because they
          appear in client model names and never contain '@', '/' or '.'.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProviderSpec is our access to one platform: provider settings (HBEP-4) and a
              credentials reference. Organization, platform, partition and account are
              also labels on the Provider (HBEP-3), so queries select by label.
            properties:
              account:
                description: |-
                  Account is the account (or grant account) jobs are charged to. Provider
                  names appear in client model names, so the account is a label and a
                  field here, never part of the name.
                maxLength: 253
                type: string
              allowedPartitions:
                description: AllowedPartitions lists the platform partitions this
                  provider may use.
                items:
                  maxLength: 253
                  minLength: 1
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              credentialsRef:
                description: |-
                  CredentialsRef refers to the provider's credentials: a mode-600 file on
                  the control-plane host, or a Secret. The API never holds credentials.
                properties:
                  file:
                    description: File is the path of a mode-600 file on the control-plane
                      host.
                    maxLength: 4096
                    minLength: 1
                    type: string
                  secretRef:
                    description: SecretRef names a key of a Secret (the team option).
                    properties:
                      key:
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        maxLength: 63
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                type: object
                x-kubernetes-validations:
                - message: name exactly one of file and secretRef
                  rule: has(self.file) != has(self.secretRef)
              grant:
                description: Grant names the grant the account belongs to.
                maxLength: 253
                type: string
              platformProfileRef:
                description: |-
                  PlatformProfileRef names the PlatformProfile of the provider's platform.
                  Several providers can share one platform and one profile.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - platformProfileRef
            type: object
          status:
            description: ProviderStatus is the observed state of a Provider.
            properties:
              conditions:
                description: |-
                  Conditions of the provider, for example a credentials file that others
                  can read, or an unreachable platform.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastReconcileTime:
                description: LastReconcileTime is when the controller last reconciled
                  the object.
                format: date-time
                type: string
              lastSuccessfulStatusRead:
                description: |-
                  LastSuccessfulStatusRead is when the provider's status was last read
                  successfully; its age is the age of the control plane's view.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation the controller last
                  reconciled.
                format: int64
                type: integer
              queueWaits:
                description: |-
                  QueueWaits are the last MaxQueueWaits observed queue waits, oldest first
                  (HBEP-4, Provider status). Each is one recorded job's wait from
                  submission to start, from its accounting record's submit and start
                  times, never from when the controller saw the change. Entries are keyed
                  by job ID, so a repeated observe adds nothing; a new entry beyond the
                  cap drops the oldest (AddQueueWait). The lifecycle controller plans
                  replacements from them (HBEP-7, Handover), and they live here so a
                  restarted controller plans from the same waits.
                items:
                  description: |-
                    QueueWait is one recorded job's wait in the queue: from its submission to its
                    start, both from the job's accounting record (HBEP-4, Provider status).
                  properties:
                    jobID:
                      description: JobID is the job's ID.
                      maxLength: 64
                      minLength: 1
                      type: string
                    startTime:
                      description: StartTime is when the job started.
                      format: date-time
                      type: string
                    submitTime:
                      description: SubmitTime is when the scheduler accepted the job.
                      format: date-time
                      type: string
                  required:
                  - jobID
                  - startTime
                  - submitTime
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-map-keys:
                - jobID
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'a Provider name must be a DNS-1123 label: lowercase letters, digits
            and ''-'', starting and ending with a letter or digit, at most 63 characters,
            so no ''.'', ''@'' or ''/'''
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name)
            <= 63
    served: true
    storage: true
    subresources:
      status: {}
