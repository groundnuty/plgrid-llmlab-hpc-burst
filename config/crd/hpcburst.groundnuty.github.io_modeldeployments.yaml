---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: modeldeployments.hpcburst.groundnuty.github.io
spec:
  group: hpcburst.groundnuty.github.io
  names:
    categories:
    - hpcburst
    kind: ModelDeployment
    listKind: ModelDeploymentList
    plural: modeldeployments
    shortNames:
    - md
    singular: modeldeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .spec.instances
      name: Desired
      type: integer
    - jsonPath: .status.readyInstances
      name: Ready
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelDeployment is what to serve (HBEP-3). It owns its Instances, as a
          ReplicaSet owns its pods; it owns no Allocation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelDeploymentSpec is what to serve: model, serving spec, number of
              instances, where, until when, and the default retention policy.
            properties:
              endTime:
                description: |-
                  EndTime is when the deployment ends: its Instances drain and end without
                  replacement.
                format: date-time
                type: string
              instances:
                default: 1
                description: |-
                  Instances is the number of Instances wanted. It is the scale
                  subresource's replica count.
                format: int32
                minimum: 0
                type: integer
              model:
                description: Model is the model name clients send. Names follow LLMLab's.
                maxLength: 256
                minLength: 1
                type: string
              providers:
                description: Providers says where the deployment may run.
                properties:
                  names:
                    description: Names lists Providers by name.
                    items:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: set
                  selector:
                    description: |-
                      Selector selects Providers by their labels, for example every provider
                      on one platform.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
                x-kubernetes-validations:
                - message: name at least one provider, or give a label selector
                  rule: (has(self.names) && size(self.names) > 0) || has(self.selector)
              retentionPolicy:
                description: |-
                  RetentionPolicy is the default retention policy of the Allocations that
                  host this deployment's Instances. When it is absent, the default is to
                  keep until the deployment's end time (HBEP-7, open question 13).
                properties:
                  idleLimit:
                    description: IdleLimit is how long an Allocation may be idle before
                      it is released.
                    maxLength: 63
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  mode:
                    default: Keep
                    description: Mode is Keep (the default) or ReleaseWhenIdle.
                    enum:
                    - Keep
                    - ReleaseWhenIdle
                    type: string
                  until:
                    description: |-
                      Until is the date a kept Allocation is kept until: a date, a grant's end
                      or a deadline. When it is absent, the default is the deployment's end
                      time (HBEP-7, open question 13).
                    format: date-time
                    type: string
                required:
                - mode
                type: object
                x-kubernetes-validations:
                - message: idleLimit is required with mode ReleaseWhenIdle and refused
                    with mode Keep
                  rule: 'self.mode == ''ReleaseWhenIdle'' ? has(self.idleLimit) :
                    !has(self.idleLimit)'
              serving:
                description: Serving is the serving spec. It may change while the
                  deployment serves.
                properties:
                  chatTemplate:
                    description: |-
                      ChatTemplate is the text of one chat template, when the spec gives one.
                      A checkpoint's own list of named templates is not given here: the
                      deployment-ID library refuses one that has no entry named default and
                      tells the operator to name the template in the spec.
                    maxLength: 262144
                    type: string
                  checkpoint:
                    description: |-
                      CheckpointSpec names the checkpoint to serve. Its per-file SHA-256 list is
                      computed by the controller and kept in the identity record.
                    properties:
                      hubTokenRef:
                        description: |-
                          HubTokenRef refers to the token for a gated repository. It is referenced
                          like provider credentials and is never a deployment-ID input.
                        properties:
                          file:
                            description: File is the path of a mode-600 file on the
                              control-plane host.
                            maxLength: 4096
                            minLength: 1
                            type: string
                          secretRef:
                            description: SecretRef names a key of a Secret (the team
                              option).
                            properties:
                              key:
                                maxLength: 253
                                minLength: 1
                                type: string
                              name:
                                maxLength: 253
                                minLength: 1
                                type: string
                              namespace:
                                maxLength: 63
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            - namespace
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: name exactly one of file and secretRef
                          rule: has(self.file) != has(self.secretRef)
                      repository:
                        description: |-
                          Repository is the checkpoint's repository, for example on the Hugging
                          Face Hub.
                        maxLength: 256
                        minLength: 1
                        type: string
                      revision:
                        description: |-
                          Revision is the checkpoint's full commit ID: 40 lowercase hex
                          characters. A branch, a tag or an abbreviated ID is refused, because a
                          mutable reference cannot be hashed meaningfully (HBEP-3, HBEP-9).
                        maxLength: 64
                        type: string
                        x-kubernetes-validations:
                        - message: 'revision must be a full commit id: 40 lowercase
                            hex characters; a branch name, a tag or an abbreviated
                            id is refused'
                          rule: self.matches('^[0-9a-f]{40}$')
                    required:
                    - repository
                    - revision
                    type: object
                  engine:
                    description: EngineSpec names the engine and its image.
                    properties:
                      imageDigest:
                        description: |-
                          ImageDigest is the engine image's digest: "sha256:" and 64 lowercase hex
                          characters (HBEP-3, the v1 canonical object).
                        maxLength: 71
                        type: string
                        x-kubernetes-validations:
                        - message: imageDigest must be 'sha256:' followed by 64 lowercase
                            hex characters
                          rule: self.matches('^sha256:[0-9a-f]{64}$')
                      name:
                        description: Name of the engine, for example "vllm".
                        maxLength: 63
                        minLength: 1
                        type: string
                      version:
                        description: Version of the engine.
                        maxLength: 63
                        minLength: 1
                        type: string
                    required:
                    - imageDigest
                    - name
                    - version
                    type: object
                  env:
                    description: Env lists the engine's environment variables.
                    items:
                      description: |-
                        EnvVar is one environment variable of the engine. Names are POSIX names in
                        uppercase ASCII, so every key of the hashed object is ASCII.
                      properties:
                        name:
                          maxLength: 128
                          minLength: 1
                          type: string
                        value:
                          maxLength: 8192
                          type: string
                      required:
                      - name
                      - value
                      type: object
                      x-kubernetes-validations:
                      - message: 'an environment variable name matches ^[A-Z_][A-Z0-9_]*$:
                          uppercase ASCII letters, digits and underscores, not starting
                          with a digit'
                        rule: self.name.matches('^[A-Z_][A-Z0-9_]*$')
                      - message: 'a key is never written in a spec: use checkpoint.hubTokenRef
                          (HF_TOKEN is refused)'
                        rule: self.name != 'HF_TOKEN'
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  flags:
                    description: |-
                      Flags are the engine flags, in order. A flag given more than once is
                      listed more than once.
                    items:
                      description: |-
                        EngineFlag is one engine flag. The spec lists flags as ordered pairs, so no
                        command line is parsed (HBEP-3, Deployment ID). The name rules keep every key
                        of the hashed object ASCII and give one spelling per flag: vLLM reads
                        max_num_seqs and max-num-seqs as the same flag (vllm/utils/argparse_utils.py,
                        v0.32.0, lines 120 and 338-344), so only the dashed spelling is admitted.
                      properties:
                        name:
                          description: Name is the flag's long name without its leading
                            dashes.
                          maxLength: 128
                          minLength: 1
                          type: string
                        value:
                          description: |-
                            Value is the flag's value as the user wrote it. A boolean flag is given
                            under its positive name, with "true" or "false". A value that is JSON
                            stays the string given.
                          maxLength: 8192
                          type: string
                      required:
                      - name
                      - value
                      type: object
                      x-kubernetes-validations:
                      - message: 'an engine flag name is a long name without leading
                          dashes: write ''max-model-len'', not ''--max-model-len'',
                          and never a short alias such as ''-tp'''
                        rule: '!self.name.startsWith(''-'')'
                      - message: 'an engine flag name matches ^[a-z0-9][a-z0-9-]*$:
                          lowercase ASCII letters, digits and hyphens, so no underscores,
                          no uppercase and no ''='''
                        rule: self.name.matches('^[a-z0-9][a-z0-9-]*$')
                      - message: 'a short flag alias such as tp, pp or dp is refused:
                          write the long flag name, for example tensor-parallel-size'
                        rule: '!(self.name in [''ac'', ''asc'', ''cc'', ''dc'', ''dcp'',
                          ''dp'', ''dpa'', ''dpb'', ''dpe'', ''dph'', ''dpl'', ''dpm'',
                          ''dpn'', ''dpp'', ''dpr'', ''ep'', ''n'', ''pcp'', ''pp'',
                          ''q'', ''r'', ''sc'', ''tp''])'
                      - message: 'a key is never written in a spec: use credentialsRef
                          or checkpoint.hubTokenRef (api-key and hf-token are refused)'
                        rule: '!(self.name in [''api-key'', ''hf-token''])'
                      - message: 'the framework passes model, revision and chat-template
                          itself: set checkpoint and chatTemplate instead'
                        rule: '!(self.name in [''model'', ''revision'', ''chat-template''])'
                    maxItems: 128
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - checkpoint
                - engine
                type: object
            required:
            - instances
            - model
            - providers
            - serving
            type: object
          status:
            description: ModelDeploymentStatus is the observed state of a ModelDeployment.
            properties:
              activeIDs:
                description: ActiveIDs lists every ID that still has Instances.
                items:
                  description: |-
                    ActiveDeploymentID is a deployment ID that still has Instances, as a
                    Deployment lists its ReplicaSets.
                  properties:
                    acceleratorClass:
                      description: |-
                        AcceleratorClass is a partition's GPU model and CPU architecture, as the
                        platform profile names them. It is an input of the deployment ID (HBEP-3).
                        The JSON keys are those of the canonical object's accelerator entry.
                      properties:
                        cpu_arch:
                          description: CPUArch is the CPU architecture, for example
                            "aarch64" or "x86_64".
                          maxLength: 63
                          minLength: 1
                          type: string
                        gpu_model:
                          description: GPUModel is the GPU model. A partition without
                            GPUs names "none".
                          maxLength: 63
                          minLength: 1
                          type: string
                      required:
                      - cpu_arch
                      - gpu_model
                      type: object
                    id:
                      description: |-
                        DeploymentID is a deployment ID (HBEP-3): the SHA-256 of the canonical
                        object, in lowercase hex. Names and labels carry its display form, the first
                        12 characters, and records keep all 64. The API stores it as a validated
                        string; the package that computes it is separate.
                      maxLength: 64
                      pattern: ^([0-9a-f]{12}|[0-9a-f]{64})$
                      type: string
                    instances:
                      description: Instances is how many Instances of this ID exist.
                      format: int32
                      type: integer
                  required:
                  - acceleratorClass
                  - id
                  - instances
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentIDs:
                description: |-
                  CurrentIDs lists the current deployment ID of each accelerator class
                  (HBEP-3, Current IDs, the file list and rollout).
                items:
                  description: ClassDeploymentID is the current deployment ID of one
                    accelerator class.
                  properties:
                    acceleratorClass:
                      description: |-
                        AcceleratorClass is a partition's GPU model and CPU architecture, as the
                        platform profile names them. It is an input of the deployment ID (HBEP-3).
                        The JSON keys are those of the canonical object's accelerator entry.
                      properties:
                        cpu_arch:
                          description: CPUArch is the CPU architecture, for example
                            "aarch64" or "x86_64".
                          maxLength: 63
                          minLength: 1
                          type: string
                        gpu_model:
                          description: GPUModel is the GPU model. A partition without
                            GPUs names "none".
                          maxLength: 63
                          minLength: 1
                          type: string
                      required:
                      - cpu_arch
                      - gpu_model
                      type: object
                    id:
                      description: |-
                        DeploymentID is a deployment ID (HBEP-3): the SHA-256 of the canonical
                        object, in lowercase hex. Names and labels carry its display form, the first
                        12 characters, and records keep all 64. The API stores it as a validated
                        string; the package that computes it is separate.
                      maxLength: 64
                      pattern: ^([0-9a-f]{12}|[0-9a-f]{64})$
                      type: string
                  required:
                  - acceleratorClass
                  - id
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              desiredInstances:
                description: |-
                  DesiredInstances is the number of Instances the controller currently
                  aims for.
                format: int32
                type: integer
              instances:
                description: |-
                  Instances is the number of Instances that exist and have not ended. It
                  is the scale subresource's status count.
                format: int32
                type: integer
              lastReconcileTime:
                description: LastReconcileTime is when the controller last reconciled
                  the object.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation the controller last
                  reconciled.
                format: int64
                type: integer
              readyInstances:
                description: ReadyInstances is the number of Instances that take traffic.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      scale:
        specReplicasPath: .spec.instances
        statusReplicasPath: .status.instances
      status: {}
