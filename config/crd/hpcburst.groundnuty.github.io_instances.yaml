---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: instances.hpcburst.groundnuty.github.io
spec:
  group: hpcburst.groundnuty.github.io
  names:
    categories:
    - hpcburst
    kind: Instance
    listKind: InstanceList
    plural: instances
    shortNames:
    - inst
    singular: instance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.allocationRef.name
      name: Allocation
      type: string
    - jsonPath: .spec.deploymentID
      name: ID
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Instance is one copy of a deployment inside one Allocation, as a lifecycle
          resource (HBEP-3). Its ModelDeployment owns it. It carries a drain finalizer
          (FinalizerDrain).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              InstanceSpec names the Instance's deployment ID, its identity record and its
              Allocation. It is immutable: an Instance never changes its ID or its
              Allocation (HBEP-3, HBEP-11).
            properties:
              allocationRef:
                description: |-
                  AllocationRef names the Allocation, in the Instance's namespace, that
                  the Instance runs in. An Instance is bound to one Allocation for life.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deploymentID:
                description: DeploymentID is the full deployment ID.
                maxLength: 64
                pattern: ^[0-9a-f]{64}$
                type: string
              identityRecord:
                description: |-
                  IdentityRecord is the name of the identity record, a ControllerRevision in
                  the Instance's namespace, named id-<first 12 hex of the ID>.
                maxLength: 253
                minLength: 1
                type: string
            required:
            - allocationRef
            - deploymentID
            - identityRecord
            type: object
            x-kubernetes-validations:
            - message: 'an Instance''s spec is immutable: replace the Instance instead
                of editing it'
              rule: self == oldSelf
            - message: identityRecord must be 'id-' followed by the first 12 characters
                of deploymentID
              rule: size(self.deploymentID) >= 12 && self.identityRecord == 'id-'
                + self.deploymentID.substring(0, 12)
          status:
            description: |-
              InstanceStatus is the observed state of an Instance. The job ID, node, URL
              and lease end are the Instance's metadata (HBEP-3): a handover replaces the
              Instance, so they never change within one.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              jobID:
                description: JobID is the provider job's ID.
                type: string
              lastReconcileTime:
                description: LastReconcileTime is when the controller last reconciled
                  the object.
                format: date-time
                type: string
              leaseEnd:
                description: LeaseEnd is the hard end of the Instance's lease.
                format: date-time
                type: string
              node:
                description: Node the Instance runs on.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation the controller last
                  reconciled.
                format: int64
                type: integer
              phase:
                description: Phase of the Instance.
                enum:
                - pending
                - starting
                - verifying
                - ready
                - draining
                - ended
                type: string
              url:
                description: URL the front reaches the Instance at.
                type: string
              verdict:
                description: Verdict mirrors the verification record's verdict.
                enum:
                - pass
                - fail
                type: string
              verificationRecord:
                description: |-
                  VerificationRecord is the name of the Instance's verification record, a
                  ControllerRevision written once, pass or fail, before the Instance can
                  become ready.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
