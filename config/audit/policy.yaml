# The API server's audit policy (HBEP-10, Audit; HBEP-11, Single-user host; issue #660, PR B). hpcburst up
# writes it to <state>/audit-policy.yaml at every start (internal/launcher), and internal/testenv's audit option
# takes the same bytes, so the policy a test reads the log under is the one that is installed. Rules are
# evaluated in order and the first match decides, so their order is part of the policy.
#
#   1. None             the controllers' Lease reads and renewals IN hpcburst-system, where their leader locks live:
#                       they carry no decision, and they would fill most of the log. A Lease CREATE is not listed
#                       here and stays at Metadata, and so does any Lease request in another namespace, which no
#                       controller role grants: a level is chosen from the request alone, before the answer, so a
#                       controller's request for a kube-system Lease must still leave a line, refused or not. A
#                       REFUSED request for a Lease inside hpcburst-system is not logged.
#   2. RequestResponse  this framework's Operations, their status, Approvals and ApprovalPolicies, for the WRITES
#                       (create, update, patch, delete and deletecollection): the log then holds each write with its
#                       purpose, the plan and the per-target outcomes of the controller's status writes, and each
#                       Approval with the plan it names. The READS (get, list, watch) fall through to Metadata: the
#                       controllers list these kinds on every reconcile pass, and a list logged with its whole answer
#                       was most of an idle controller's log (measured in internal/audit/e2e, issue #660, S3). A
#                       subresource is its own resource here: operations/status is not matched by operations.
#   3. Request          the lifecycle controller's writes to Allocations (update, patch, delete and deletecollection),
#                       so a release cause is logged before the delete that follows. A create stays at Metadata.
#   4. Metadata         everything else: the user, the verb, the object, the time and the answer, and never a
#                       body, so no Secret's content is logged.
#
# RequestReceived is omitted, as in the policy this replaces: each request is logged once, when it is
# answered (ResponseComplete), or when a watch's response starts. The objects' managedFields are left out of every
# body that is logged (omitManagedFields): they are about a quarter of a body's bytes, and the plan, the approvals
# and the release cause are the content.
#
# The three user names are the controllers' ServiceAccounts of hpcburst-system (config/rbac/controllers.yaml).
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
omitManagedFields: true
rules:
  - level: None
    users:
      - system:serviceaccount:hpcburst-system:hpcburst-lifecycle
      - system:serviceaccount:hpcburst-system:hpcburst-provider
      - system:serviceaccount:hpcburst-system:hpcburst-front
    verbs: ["get", "update", "list", "watch"]
    namespaces: ["hpcburst-system"]
    resources:
      - group: coordination.k8s.io
        resources: ["leases"]
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    resources:
      - group: hpcburst.groundnuty.github.io
        resources: ["operations", "operations/status", "approvals", "approvalpolicies"]
  - level: Request
    users:
      - system:serviceaccount:hpcburst-system:hpcburst-lifecycle
    verbs: ["update", "patch", "delete", "deletecollection"]
    resources:
      - group: hpcburst.groundnuty.github.io
        resources: ["allocations"]
  - level: Metadata
