# Refuses deleting the framework's custom resource definitions (HBEP-11, Risks
# and Admission). Deleting a CRD deletes every resource of that kind, and the
# Allocation finalizers would cancel every provider job.
#
# Uninstalling the framework removes the binding first, as an explicit step:
#   kubectl delete validatingadmissionpolicybinding hpcburst-protect-crds
# This file is written by hand. hack/generate.sh does not touch it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hpcburst-protect-crds
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apiextensions.k8s.io"]
        apiVersions: ["*"]
        operations: ["DELETE"]
        resources: ["customresourcedefinitions"]
  validations:
    # A delete carries the object being deleted as oldObject; object is null.
    - expression: "oldObject.spec.group != 'hpcburst.groundnuty.github.io'"
      reason: Forbidden
      messageExpression: >-
        'refusing to delete the custom resource definition ' + oldObject.metadata.name +
        ': it would delete every resource of that kind and cancel their provider jobs.' +
        ' Remove the binding hpcburst-protect-crds first (HBEP-11)'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hpcburst-protect-crds
spec:
  policyName: hpcburst-protect-crds
  validationActions: ["Deny"]
