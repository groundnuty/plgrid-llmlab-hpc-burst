# THROWAWAY, never merged: a DEBUG run of #503's second PR (internal/alpha/standin_test.go patched by debug-standin.patch) (row A sends no requeue) over the stand-in on a hosted runner (IMPL-COMMON: stand-ins go
# there). The two stand-ins of row A, each in its own job, once: the plain one (TestStandInNowServe: the
# live steps over the real stack and the fake Slurm; it must end NOT RUN for the cold start only, and assert that the stack's release,
# not the cleanup or the time limit, ended the job) and the warm one (TestStandInNowServeWarm: the pre-staged row passes). Read-only: no
# secret, cache restore only, nothing saved.
name: l503g-debug-state-x10-plain
on:
  pull_request:
    paths:
      - .github/workflows/l503g-debug-state-x10-plain.yml
permissions:
  contents: read
jobs:
  standin:
    name: standin ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain-a
            run: '^TestStandInNowServe$'
          - name: plain-b
            run: '^TestStandInNowServe$'
    env:
      K3S_VERSIONS: '["1.36.5"]'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Go version from go.mod
        id: goversion
        run: |
          # A failing script must fail this step: "echo ...$(cmd)" would hide its exit status.
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Go archive
        id: goarchive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}

      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"
          echo "::add-matcher::$GITHUB_WORKSPACE/.github/go-problem-matcher.json"

      - name: Check the Go on PATH is the pinned toolchain
        id: gocheck
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"

      # The modules are downloaded here, before anything builds: go mod download, tried again when it
      # fails, then go mod verify (hack/go-mod-download.sh, issue #346). Nothing is cached between runs.
      - name: Download and verify the Go modules
        run: bash hack/go-mod-download.sh

      # The pinned binaries come from the cache when it has them (see the top of this file). The
      # two rehearsal jobs share one entry. The path lines of the restore and the save must match.
      - name: Restore the cached pinned binaries
        id: binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/k3s-bin
            ${{ runner.temp }}/frp
          key: binaries-rehearsal-k3s-${{ join(fromJSON(env.K3S_VERSIONS), '-') }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-frp.sh', 'hack/fetch-k3s.sh', 'internal/launcher/k3s-pins.txt') }}

      # The rehearsal's hpcburst up starts k3s 1.36.5 only.
      - name: Fetch the pinned k3s binary
        run: |
          echo "HPCBURST_BIN_DIR=$RUNNER_TEMP/k3s-bin" >> "$GITHUB_ENV"
          bash hack/fetch-k3s.sh "$RUNNER_TEMP/k3s-bin" ${{ join(fromJSON(env.K3S_VERSIONS), ' ') }}

      - name: Fetch the pinned frp binaries
        run: |
          bash hack/fetch-frp.sh "$RUNNER_TEMP/frp"
          echo "HPCBURST_FRP_DIR=$RUNNER_TEMP/frp" >> "$GITHUB_ENV"

      - name: Restore the cached Envoy binary
        id: envoy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/envoy
          key: envoy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-envoy.sh', 'internal/agent/envoypin/envoy-pins.txt') }}

      - name: Fetch the pinned Envoy binary
        run: |
          bash hack/fetch-envoy.sh "$RUNNER_TEMP/envoy"
          {
            echo "HPCBURST_ENVOY_DIR=$RUNNER_TEMP/envoy"
            echo "HPCBURST_REQUIRE_ENVOY=1"
          } >> "$GITHUB_ENV"

      - name: Provide OpenSSH's sshd for the login node
        run: |
          if ! test -x /usr/sbin/sshd; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          sudo systemctl disable --now ssh.socket ssh.service 2> /dev/null || true
          /usr/sbin/sshd -V 2>&1 | head -1
          echo "HPCBURST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"

      # hack/rehearsal.sh runs the test in a transient systemd user scope, which it stops however
      # the run ends, so nothing the test started outlives it. A hosted runner's user has no
      # systemd user manager until lingering starts one.
      - name: Start a systemd user manager for this user
        run: |
          if ! dpkg -s dbus-user-session > /dev/null 2>&1; then
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q dbus-user-session
          fi
          sudo loginctl enable-linger "$(id -un)"
          rt="/run/user/$(id -u)"
          timeout 60 sh -c "until test -S '$rt/systemd/private' && test -S '$rt/bus'; do sleep 1; done"
          echo "XDG_RUNTIME_DIR=$rt" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$rt/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$rt" DBUS_SESSION_BUS_ADDRESS="unix:path=$rt/bus" systemd-run --user --scope -q true

      # Issue #146's two tests and #298's host-dialed mode only: issue #193's part 3 runs in its own
      # job (rehearsal-part3), so each job stays under its time budget.

      - name: Build the stack's binaries and the alpha test binary
        run: |
          out="$RUNNER_TEMP/standin"
          mkdir -p "$out"
          go build -o "$out/" ./cmd/hpcburst ./cmd/hpcburst-controller ./cmd/hpcburst-front ./cmd/hb-agent
          go test -c -o "$out/alpha.test" ./internal/alpha
          echo "STANDIN_OUT=$out" >> "$GITHUB_ENV"
      - name: Build the stack's binaries and the alpha test binary
        run: |
          out="$RUNNER_TEMP/standin"
          mkdir -p "$out"
          go build -o "$out/" ./cmd/hpcburst ./cmd/hpcburst-controller ./cmd/hpcburst-front ./cmd/hb-agent
          go test -c -o "$out/alpha.test" ./internal/alpha
          echo "STANDIN_OUT=$out" >> "$GITHUB_ENV"

      - name: Run the row A stand-in (${{ matrix.name }})
        working-directory: internal/alpha
        run: |
          log="$RUNNER_TEMP/standin.log"
          rc=0
          HPCBURST_ALPHA_STANDIN=1 HPCBURST_REHEARSAL=1 HPCBURST_REHEARSAL_BIN="$STANDIN_OUT" HPCBURST_REQUIRE_FRP=1 HPCBURST_REQUIRE_SSHD=1 \
            systemd-run --user --scope -q -p MemoryMax=6G -p MemorySwapMax=0 \
            "$STANDIN_OUT/alpha.test" -test.v -test.count=10 -test.timeout 60m -test.run '${{ matrix.run }}' > "$log" 2>&1 || rc=$?
          echo "exit=$rc"
          echo "iterations: pass $(grep -c -E '^--- PASS' "$log"), fail $(grep -c -E '^--- FAIL' "$log") of 10"
          echo "pass lines: $(grep -c -E '^--- PASS' "$log")"
          echo "fail lines: $(grep -c -E '^--- FAIL' "$log")"
          echo "skip lines: $(grep -c -E '^\s*--- SKIP' "$log")"
          grep -n -E "the job was sent TERM|time limit|restart count|--- (PASS|FAIL)|worker-rung restart, from|the run's jobs are ended|the deployment is deleted|DEBUG" "$log" | cut -c1-400 || true
          sed -n '/DEBUG: the controller.s lines/,/^--- FAIL/p' "$log" | head -60 | cut -c1-300 || true
          echo "--- the state dumps of every iteration (patched in by debug-state.patch):"
          grep -E -A45 'DEBUG\[[a-z ]*\]: [0-9]+ events' "$log" | grep -v '^--$' | head -500 | cut -c1-260 || true
          grep -B2 -A25 -E '^--- FAIL' "$log" | head -200 | cut -c1-400 || true
          exit "$rc"
