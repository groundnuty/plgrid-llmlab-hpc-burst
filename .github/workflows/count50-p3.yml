# One-off workflow for a throwaway draft PR (issue #343, PR 3), never merged.
# It runs the relay keeper's multi-process tests (internal/relaykeeper/keeperproc)
# and internal/relaykeeper's whole package with -count=50 under two CPU spinners,
# with HPCBURST_REQUIRE_SSHD=1 so a missing sshd fails instead of skipping; and it
# applies each test's named one-line product mutant by hand, after a baseline run
# under the same flags, and requires the named test to fail.
#
# The Go and sshd steps are ci.yml's go job's, with the Go archive's cache restored
# only, never saved. No secret is read, nothing is pushed.
name: count50-p3

on:
  pull_request:
    paths:
      - .github/workflows/count50-p3.yml

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  HPCBURST_REQUIRE_SSHD: "1"

defaults:
  run:
    shell: bash

jobs:
  keeperproc:
    name: keeperproc ${{ matrix.test }} -count=50
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        test:
          - TestAHandOverAfterAKilledLeaderCutsNoStream
          - TestAKilledKeepersRelaysDieByPdeathsig
          - TestAKilledDoubleLeavesTheRelaysAndTheirStream
          - TestAnAgentFencedAtAnAlphaEpochAcceptsTheKeepersFirstRelays
          - TestAKeeperRestartTakesAHigherEpochAndRefusesAStaleDouble
          - TestANewLeadersIncompleteSetStopsNoRelay
          - TestAfterAKeeperRestartOnlyAFreshSetStartsRelays
          - TestDuringALeaderOutageAnExpiredSetRestartsNothing
          - TestAnAcknowledgedFinalEndIsNotRestarted
          - TestAnAllocationEndedForGoodGetsNoRelay
          - TestASecondProvidersSetForAHeldLoginHostIsRefused
    steps:
      - name: Check out the PR's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Read the Go version from go.mod
        id: goversion
        run: |
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Go archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}

      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"

      - name: Check the Go on PATH is the pinned toolchain
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"

      - name: Provide OpenSSH's sshd for the rehearsal login node
        run: |
          if ! test -x /usr/sbin/sshd; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          sudo systemctl disable --now ssh.socket ssh.service 2> /dev/null || true
          /usr/sbin/sshd -V 2>&1 | head -1
          echo "HPCBURST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"

      - name: Build the test binary
        run: go test -c -o "$RUNNER_TEMP/kp.test" ./internal/relaykeeper/keeperproc/

      - name: Run it 50 times under two CPU spinners
        working-directory: internal/relaykeeper/keeperproc
        run: |
          # Two spinners at the lowest priority, each bounded by timeout, so they
          # end by themselves; the runner ends what is left at the job's end.
          for i in 1 2; do timeout 100m nice -n 19 sh -c 'while :; do :; done' & done
          log="$RUNNER_TEMP/count50.log"
          rc=0
          "$RUNNER_TEMP/kp.test" -test.run '^${{ matrix.test }}$' -test.count 50 -test.v -test.timeout 100m > "$log" 2>&1 || rc=$?
          passes=$(grep -c -E '^--- PASS: ${{ matrix.test }} ' "$log" || true)
          fails=$(grep -c -E '^--- FAIL: ${{ matrix.test }} ' "$log" || true)
          skips=$(grep -c -E '^--- SKIP' "$log" || true)
          leaks=$(grep -E '^rehearsal: [0-9]+ leaked' "$log" || echo "no leak line")
          {
            echo "### ${{ matrix.test }}"
            echo "passes: $passes of 50; fails: $fails; skips: $skips; $leaks; exit $rc"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E '^(--- FAIL|    [a-z_]+_test\.go:[0-9]+:)' "$log" | head -200 || true
          test "$rc" = 0 && test "$passes" = 50 && test "$skips" = 0 && grep -q '^rehearsal: 0 leaked' "$log"

  relaykeeper:
    name: internal/relaykeeper -count=50
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the PR's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Read the Go version from go.mod
        id: goversion
        run: |
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Go archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}

      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"

      - name: Check the Go on PATH is the pinned toolchain
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"

      - name: Provide OpenSSH's sshd
        run: |
          if ! test -x /usr/sbin/sshd; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          sudo systemctl disable --now ssh.socket ssh.service 2> /dev/null || true
          echo "HPCBURST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"

      - name: Run the whole package 50 times under two CPU spinners
        run: |
          for i in 1 2; do timeout 55m nice -n 19 sh -c 'while :; do :; done' & done
          log="$RUNNER_TEMP/relaykeeper.log"
          rc=0
          go test -count=50 -timeout 50m -v ./internal/relaykeeper/ > "$log" 2>&1 || rc=$?
          {
            echo "### internal/relaykeeper -count=50"
            echo "passes: $(grep -c '^--- PASS' "$log" || true); fails: $(grep -c '^--- FAIL' "$log" || true); skips: $(grep -c -E '^\s*--- SKIP' "$log" || true); exit $rc"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E '^(--- FAIL|    [a-z_]+_test\.go:[0-9]+:)' "$log" | head -200 || true
          tail -3 "$log"
          exit "$rc"

  mutants:
    name: mutant ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: adopt-replaces
            file: internal/relaykeeper/ownerrunner.go
            from: 'in != nil && in.want.Entry == e && in.host == host'
            to: 'in != nil && false && in.want.Entry == e && in.host == host'
            tests: TestAHandOverAfterAKilledLeaderCutsNoStream
          # The same mutant, named by the Runner's own test, in the other
          # package: each package's test binary is built and run apart.
          - id: adopt-replaces-runner
            pkg: internal/relaykeeper
            file: internal/relaykeeper/ownerrunner.go
            from: 'in != nil && in.want.Entry == e && in.host == host'
            to: 'in != nil && false && in.want.Entry == e && in.host == host'
            tests: TestAWantOfTheSameIdentityKeepsEachRelayListedOnce
          - id: no-pdeathsig
            file: internal/hostdial/pidfd.go
            from: 'Pdeathsig: syscall.SIGKILL, PidFD: fd'
            to: 'PidFD: fd'
            tests: TestAKilledKeepersRelaysDieByPdeathsig
          - id: no-pidfd
            file: internal/relaykeeper/ownerrunner.go
            from: 'Pidfd: true,'
            to: 'Pidfd: false,'
            tests: TestAKilledKeepersRelaysDieByPdeathsig
          - id: epoch-one
            file: internal/relaykeeper/process.go
            from: 'OwnerRunnerOptions{Epoch: epoch,'
            to: 'OwnerRunnerOptions{Epoch: 1,'
            tests: TestAnAgentFencedAtAnAlphaEpochAcceptsTheKeepersFirstRelays
          - id: epoch-fixed
            file: internal/relaykeeper/process.go
            from: 'OwnerRunnerOptions{Epoch: epoch,'
            to: 'OwnerRunnerOptions{Epoch: EpochBase + 1,'
            tests: TestAKeeperRestartTakesAHigherEpochAndRefusesAStaleDouble
          - id: no-fence
            file: internal/relaykeeper/keeper.go
            from: 'if seen && epoch < f.HighestEpoch {'
            to: 'if false && seen && epoch < f.HighestEpoch {'
            tests: TestAKeeperRestartTakesAHigherEpochAndRefusesAStaleDouble
          - id: incomplete-stops
            file: internal/relaykeeper/keeper.go
            from: 'if s.Complete {'
            to: 'if true {'
            tests: TestANewLeadersIncompleteSetStopsNoRelay
          - id: no-expiry
            file: internal/relaykeeper/keeper.go
            from: 'case !k.o.Now().Before(hs.expires):'
            to: 'case false && !k.o.Now().Before(hs.expires):'
            tests: TestAfterAKeeperRestartOnlyAFreshSetStartsRelays TestDuringALeaderOutageAnExpiredSetRestartsNothing
          - id: held-end-ignored
            file: internal/relaykeeper/keeper.go
            from: 'e == j.entry && len(k.endsOf(j.provider, e)) == 0'
            to: 'e == j.entry'
            tests: TestAnAcknowledgedFinalEndIsNotRestarted
          - id: ended-for-good-ignored
            file: internal/relaykeeper/keeper.go
            from: 'if e.EndedForGood {'
            to: 'if false && e.EndedForGood {'
            tests: TestAnAllocationEndedForGoodGetsNoRelay
          - id: holder-ignored
            file: internal/relaykeeper/keeper.go
            from: 'if holder != "" {'
            to: 'if false && holder != "" {'
            tests: TestASecondProvidersSetForAHeldLoginHostIsRefused
    steps:
      - name: Check out the PR's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Read the Go version from go.mod
        id: goversion
        run: |
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Go archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}

      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"

      - name: Check the Go on PATH is the pinned toolchain
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"

      - name: Provide OpenSSH's sshd
        run: |
          if ! test -x /usr/sbin/sshd; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          sudo systemctl disable --now ssh.socket ssh.service 2> /dev/null || true
          echo "HPCBURST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"

      - name: Baseline, then the mutant, under the same flags
        working-directory: ${{ matrix.pkg || 'internal/relaykeeper/keeperproc' }}
        env:
          MUT_FILE: ${{ matrix.file }}
          MUT_FROM: ${{ matrix.from }}
          MUT_TO: ${{ matrix.to }}
          MUT_TESTS: ${{ matrix.tests }}
          MUT_PKG: ${{ matrix.pkg || 'internal/relaykeeper/keeperproc' }}
        run: |
          root=$(git rev-parse --show-toplevel)
          run="^($(echo "$MUT_TESTS" | tr ' ' '|'))\$"
          build() { (cd "$root" && go test -c -o "$RUNNER_TEMP/kp.test" "./$MUT_PKG/"); }
          runit() { rc=0; "$RUNNER_TEMP/kp.test" -test.run "$run" -test.count 1 -test.v -test.timeout 30m > "$1" 2>&1 || rc=$?; echo "$rc"; }
          build
          base=$(runit "$RUNNER_TEMP/base.log")
          for t in $MUT_TESTS; do
            grep -q "^--- PASS: $t " "$RUNNER_TEMP/base.log" || { echo "::error::baseline: $t did not pass (exit $base)"; tail -50 "$RUNNER_TEMP/base.log"; exit 1; }
          done
          test "$base" = 0 || { echo "::error::baseline exit $base"; exit 1; }
          python3 -I - "$root/$MUT_FILE" <<'EOF'
          import os, sys
          p = sys.argv[1]
          s = open(p).read()
          n = s.count(os.environ["MUT_FROM"])
          if n != 1:
              sys.exit(f"the mutant's line occurs {n} times in {p}, want once")
          open(p, "w").write(s.replace(os.environ["MUT_FROM"], os.environ["MUT_TO"]))
          EOF
          (cd "$root" && git diff --stat && git diff | head -20)
          build
          mut=$(runit "$RUNNER_TEMP/mut.log")
          killed=1
          for t in $MUT_TESTS; do
            if grep -q "^--- FAIL: $t " "$RUNNER_TEMP/mut.log"; then
              echo "killed by $t:"; grep -A6 "^--- FAIL: $t " "$RUNNER_TEMP/mut.log" | head -12
            else
              echo "::error::$t did not fail under the mutant"; killed=0
            fi
          done
          echo "### mutant ${{ matrix.id }}: baseline exit $base, mutant exit $mut, killed by every named test: $killed" >> "$GITHUB_STEP_SUMMARY"
          test "$killed" = 1 && test "$mut" != 0
