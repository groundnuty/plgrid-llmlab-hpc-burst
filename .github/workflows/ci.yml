# Continuous integration for the root Go module (issue #54).
#
# It runs the repository's own checks on every pull request and on every push to main:
#   go              gofmt, go vet, go test (through hack/go-test.sh: the packages)
#   go own-timeout  hack/go-test.sh's groups, the tests that run on their own -timeout (issue #295), in a
#                   job of their own so that neither job comes near its 30 minutes
#   tidy         go mod tidy -diff, in a job of its own that restores no module cache (its Go tarball
#                is the only thing it restores)
#   crd          hack/check.sh: generated-CRD drift, envtest with the pinned binaries, sha256 checks
#   launcher-k3s hack/test-launcher.sh against the pinned k3s binaries, run as an ordinary user
#
# The go, go own-timeout, crd and launcher-k3s jobs also fetch the pinned frp binaries
# (hack/fetch-frp.sh) and set HPCBURST_REQUIRE_FRP=1, so the tests that start frps and frpc fail rather
# than skip without them.
# The go, go own-timeout and crd jobs also fetch the pinned Envoy binary (hack/fetch-envoy.sh, issue
# #429) and set HPCBURST_REQUIRE_ENVOY=1, so the tests that run Envoy fail rather than skip without it.
# launcher-k3s runs only internal/launcher and cmd/hpcburst, which run no Envoy.
# The go, go own-timeout and crd jobs also provide OpenSSH's sshd (HPCBURST_SSHD) for the ssh-mode tunnel tests,
# which fail under HPCBURST_REQUIRE_FRP=1 without it; the runner's sshd service is never started.
#
# The pinned binaries are cached between runs (issue #290), so that an outage of GitHub's release
# downloads does not fail every job. A job that fetches restores its binaries from actions/cache,
# runs the same fetch scripts as before, and saves what they installed when the cache had no entry.
# The scripts check every file against its pin on every run, restored or not, and download what does
# not match, so the cache only decides whether a download is needed, never what runs. Each cache has
# one exact key: the runner's OS and architecture, a hash of the files that name the pins (the
# scripts hold the frp and Kubernetes pins, internal/launcher/k3s-pins.txt holds k3s's and
# internal/agent/envoypin/envoy-pins.txt Envoy's), and, for k3s, the versions the job fetches. No
# restore-keys, so an old entry is never used for a new pin.
#
# GitHub scopes a cache to the branch that saved it: a run reads its own branch's caches and the
# default branch's, and a pull request's own cache is visible to no other pull request. So what
# serves every pull request is the entry saved by a run on main: the push to main after each merge
# (this workflow's push trigger), or a run started by hand (workflow_dispatch, on main) when entries
# have been evicted (GitHub drops one that was not read for 7 days). The save step runs right after
# the fetch steps, not at the end of the job, so a test that fails later does not leave main unseeded.
#
# Go itself comes from a pinned tarball, not from actions/setup-go (issue #294). That action downloads
# the toolchain from GitHub's release assets in every job, checks no digest of it, and caches no
# toolchain between runs. Every job runs the same five steps in its place. hack/fetch-go.sh reads go.mod's
# version, checks the tarball against hack/go-pins.txt (the sha256 go.dev lists), extracts it anew into
# $RUNNER_TEMP/go-toolchain every run, and checks go/bin/go against its own pin. The workflow puts that
# directory first on PATH and exports GOROOT as that tree. The last step (id gocheck) shows that the go
# on PATH is the pinned one and that `go env GOROOT` is that tree. A later step that runs even when an
# earlier one failed (!cancelled()) must also require steps.gocheck.outcome == 'success', so that
# nothing runs on a Go that was not verified.
#
# What the cache holds is the tarball only, never the tree, under one exact key (the Go version, the OS
# and architecture, and a hash of the script and its pins; no restore-keys). The script checks the
# tarball on every run, restored or not: one that does not match is deleted and downloaded again from
# go.dev, and a download that does not match fails the job. The Go save step runs only on a push and on
# workflow_dispatch, so a pull request never writes a Go entry of its own.
#
# Go modules are not cached between runs, on purpose (issue #290: an untidy go.mod must never hide
# behind a cache), so every job downloads them, and one transient error from proxy.golang.org, an
# HTTP/2 stream reset on a zip, failed a job before any test ran (issue #346, PR #344). Two layers keep
# that from failing a job, and neither stores a module anywhere:
#   - The env below sets GOPROXY=https://proxy.golang.org|direct. The go command (Go 1.26.0,
#     cmd/go/internal/modfetch/proxy.go) falls through to the next entry after any error when the
#     separator is a pipe, and only after a 404 or 410 when it is a comma, which is the default; so a
#     500 or a reset stream is now answered by the module's own origin (git over https, which the
#     runners have). Every download is checked against go.sum whichever source answered, and
#     GOFLAGS, GONOSUMDB, GOSUMDB and the other module settings stay as they were. It reaches every go
#     command of every job, tidy's go mod tidy -diff included.
#   - Each job that builds has a step right after the Go check that runs hack/go-mod-download.sh: go mod
#     download, retried up to three times, then go mod verify. tidy has none: it must start from an empty
#     module cache and its go mod tidy -diff must not be retried, since it exits 1 for "untidy" and for
#     "a download failed" alike, so it relies on the pipe alone.
#
# The workflow reads no secret and pushes nothing. Every action is pinned by commit SHA.
#
# crd and launcher-k3s call scripts from hack/. A missing script fails the job: a job that
# skipped for lack of its script would turn a rename into a check that quietly stopped running.
# One skip remains, and it is explicit: launcher-k3s leaves out the store-full tests on a runner
# without FUSE, and says so in the job summary and in a check annotation.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Seeds the caches from main by hand; see above.
  workflow_dispatch:
  # The release workflow (release.yml, HBEP-15 Releases) calls these same jobs for a pushed tag, so it
  # runs the required checks rather than a copy of them. No job is renamed for it: the five required
  # checks stay go, go own-timeout, tidy, crd and envtest, and launcher-k3s. Under a call,
  # github.event_name and github.ref are the caller's, so the cache-save steps above also run for a tag,
  # and write entries scoped to that tag, which no other run reads; the restores still read the default
  # branch's.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the run in progress for it. A push to main is never
# cancelled: its group is its own commit, so every commit on main keeps its own result (a shared
# group would let a newer waiting run replace an older waiting one).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # hack/fetch-go.sh installs the version go.mod names. A go.mod that asks for something newer must
  # fail the job, not make the go command download a toolchain on its own.
  GOTOOLCHAIN: local
  # The proxy first, and the module's own origin when the proxy fails in any way, not only on a 404 or
  # 410 (see the top of this file, issue #346). It must stay a pipe: with a comma, a 500 or a reset
  # stream fails the download. hack/gotoolchain's tests read this value and run the real go command
  # against stand-ins that fail.
  GOPROXY: "https://proxy.golang.org|direct"

defaults:
  run:
    # An explicit shell makes GitHub run bash with -e and -o pipefail; the default has no pipefail,
    # so a failing command in front of "| tee" would pass.
    shell: bash

jobs:
  go:
    name: go
    runs-on: ubuntu-24.04
    # No build cache is restored, so the Kubernetes libraries compile from scratch.
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go comes from a pinned tarball, not from actions/setup-go (see the top of this file).
      - name: Read the Go version from go.mod
        id: goversion
        run: |
          # A failing script must fail this step: "echo ...$(cmd)" would hide its exit status.
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Go archive
        id: goarchive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}

      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"
          echo "::add-matcher::$GITHUB_WORKSPACE/.github/go-problem-matcher.json"

      - name: Save the Go archive to the cache
        if: steps.goarchive.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: ${{ steps.goarchive.outputs.cache-primary-key }}

      - name: Check the Go on PATH is the pinned toolchain
        id: gocheck
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"

      # The modules are downloaded here, before anything builds: go mod download, tried again when it
      # fails, then go mod verify (hack/go-mod-download.sh, issue #346). Nothing is cached between runs.
      - name: Download and verify the Go modules
        run: bash hack/go-mod-download.sh

      - name: Go version
        run: go version

      # The pinned binaries come from the cache when it has them (see the top of this file): frp,
      # and the Kubernetes binaries that hack/test-binaries.sh keeps under HPCBURST_TOOLS_CACHE.
      # The go, go own-timeout and crd jobs share one entry. The path lines of the restore and the save must match.
      - name: Choose where the Kubernetes test binaries are cached
        run: echo "HPCBURST_TOOLS_CACHE=$RUNNER_TEMP/hpcburst-tools" >> "$GITHUB_ENV"

      - name: Restore the cached pinned binaries
        id: binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/frp
            ${{ runner.temp }}/hpcburst-tools
          key: binaries-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-frp.sh', 'hack/test-binaries.sh') }}

      # The tunnel tests of HBEP-6 start frps and frpc. HPCBURST_REQUIRE_FRP=1 makes
      # internal/testenv.FrpBinaries fail, instead of skip, when they are missing; the script
      # checks the release's sha256 before it extracts anything.
      - name: Fetch the pinned frp binaries
        run: |
          bash hack/fetch-frp.sh "$RUNNER_TEMP/frp"
          {
            echo "HPCBURST_FRP_DIR=$RUNNER_TEMP/frp"
            echo "HPCBURST_REQUIRE_FRP=1"
          } >> "$GITHUB_ENV"

      # The Kubernetes binaries are fetched here, not inside go test, so that they are verified and
      # saved before any test runs, and a log shows whether this run downloaded them.
      - name: Fetch the pinned Kubernetes binaries
        run: bash hack/test-binaries.sh

      - name: Save the pinned binaries to the cache
        if: steps.binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/frp
            ${{ runner.temp }}/hpcburst-tools
          key: ${{ steps.binaries.outputs.cache-primary-key }}

      # Envoy 1.40.2, beta's Instance router (HBEP-5; issue #429), for the tests that run it. Its cache
      # entry is its own, keyed by the script and the pins file it reads, so a change to the frp or
      # Kubernetes pins does not download Envoy's 107 MB again, nor the reverse. hack/fetch-envoy.sh
      # checks the binary against internal/agent/envoypin/envoy-pins.txt on every run, restored or not.
      # HPCBURST_REQUIRE_ENVOY=1 makes internal/testenv.EnvoyBinary fail, instead of skip, without it.
      - name: Restore the cached Envoy binary
        id: envoy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/envoy
          key: envoy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-envoy.sh', 'internal/agent/envoypin/envoy-pins.txt') }}

      - name: Fetch the pinned Envoy binary
        run: |
          bash hack/fetch-envoy.sh "$RUNNER_TEMP/envoy"
          {
            echo "HPCBURST_ENVOY_DIR=$RUNNER_TEMP/envoy"
            echo "HPCBURST_REQUIRE_ENVOY=1"
          } >> "$GITHUB_ENV"

      - name: Save the Envoy binary to the cache
        if: steps.envoy.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/envoy
          key: ${{ steps.envoy.outputs.cache-primary-key }}

      # The ssh-mode tunnel tests (internal/agent) run OpenSSH's sshd as this user, in inetd
      # mode, with no service and no root. With HPCBURST_REQUIRE_FRP=1 a missing sshd fails them.
      # The package is installed only when sshd is missing, with policy-rc.d refusing to start
      # its service. The system ssh units are then disabled every time, installed or not, so
      # the runner keeps no listening sshd.
      - name: Provide OpenSSH's sshd for the tunnel tests
        run: |
          if ! test -x /usr/sbin/sshd; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          sudo systemctl disable --now ssh.socket ssh.service 2> /dev/null || true
          /usr/sbin/sshd -V 2>&1 | head -1
          echo "HPCBURST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"

      - name: gofmt
        run: |
          # Only the root module's own files. gofmt on a directory would descend into spikes/
          # and third_party/forked/, which are separate modules.
          # shellcheck disable=SC2016 # the $d is a Go template variable, not a shell one
          files=$(go list -f '{{$d := .Dir}}{{range .GoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}{{range .CgoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}{{range .IgnoredGoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}{{range .TestGoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}{{range .XTestGoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}' ./...)
          echo "checking $(echo "$files" | grep -c .) Go files"
          # gofmt -l exits 0 even when it lists files, so fail on any output.
          unformatted=$(echo "$files" | xargs -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error title=gofmt::these files are not formatted; run gofmt -w on them"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: |
          log="$RUNNER_TEMP/go-test.log"
          rc=0
          bash hack/go-test.sh packages 2>&1 | tee "$log" || rc=$?
          # A skipped test reports as success, so list every one in the job summary.
          skips=$(grep -c -E '^\s*--- SKIP' "$log" || true)
          {
            echo "### go test"
            echo "Skipped tests: $skips (each one is coverage that did not run)."
            if [ "$skips" != "0" ]; then
              echo '```'
              # At most 100 lines, to keep the summary readable: the count above is the total, and the
              # job log has every one. To show more, change the 100. One awk reads the whole log: a
              # reader that stops early (head -100) left grep and sed writing to a closed pipe, which
              # under pipefail and -e could fail this step once more than 100 tests skipped (#237).
              awk '/^[[:space:]]*--- SKIP/ { sub(/^ */, ""); if (++n <= 100) print } END { if (n > 100) print "... and " (n - 100) " more in the job log" }' "$log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  go-own:
    name: go own-timeout
    runs-on: ubuntu-24.04
    # hack/go-test.sh's groups, the tests that run on their own -timeout, apart from the go job (issue
    # #295): the two together ran 1,174-1,331 s of the go job's 30 minutes, 1.35x at worst, and with the
    # groups here the go job keeps about 840 s of its 30 minutes and this job about 640 s of its own.
    # The same setup as the go job, step for step, since the groups need the same Go, the pinned frp and
    # Kubernetes binaries and sshd; no build cache is restored, so the Kubernetes libraries compile
    # from scratch here too. This job's name is a required check of main: a rename would stop every merge.
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go comes from a pinned tarball, not from actions/setup-go (see the top of this file).
      - name: Read the Go version from go.mod
        id: goversion
        run: |
          # A failing script must fail this step: "echo ...$(cmd)" would hide its exit status.
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Go archive
        id: goarchive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}

      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"
          echo "::add-matcher::$GITHUB_WORKSPACE/.github/go-problem-matcher.json"

      - name: Save the Go archive to the cache
        if: steps.goarchive.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: ${{ steps.goarchive.outputs.cache-primary-key }}

      - name: Check the Go on PATH is the pinned toolchain
        id: gocheck
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"

      # The modules are downloaded here, before anything builds: go mod download, tried again when it
      # fails, then go mod verify (hack/go-mod-download.sh, issue #346). Nothing is cached between runs.
      - name: Download and verify the Go modules
        run: bash hack/go-mod-download.sh

      - name: Go version
        run: go version

      # The pinned binaries come from the cache when it has them (see the top of this file): frp,
      # and the Kubernetes binaries that hack/test-binaries.sh keeps under HPCBURST_TOOLS_CACHE.
      # The go, go own-timeout and crd jobs share one entry. The path lines of the restore and the save must match.
      - name: Choose where the Kubernetes test binaries are cached
        run: echo "HPCBURST_TOOLS_CACHE=$RUNNER_TEMP/hpcburst-tools" >> "$GITHUB_ENV"

      - name: Restore the cached pinned binaries
        id: binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/frp
            ${{ runner.temp }}/hpcburst-tools
          key: binaries-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-frp.sh', 'hack/test-binaries.sh') }}

      # The tunnel tests of HBEP-6 start frps and frpc. HPCBURST_REQUIRE_FRP=1 makes
      # internal/testenv.FrpBinaries fail, instead of skip, when they are missing; the script
      # checks the release's sha256 before it extracts anything.
      - name: Fetch the pinned frp binaries
        run: |
          bash hack/fetch-frp.sh "$RUNNER_TEMP/frp"
          {
            echo "HPCBURST_FRP_DIR=$RUNNER_TEMP/frp"
            echo "HPCBURST_REQUIRE_FRP=1"
          } >> "$GITHUB_ENV"

      # The Kubernetes binaries are fetched here, not inside go test, so that they are verified and
      # saved before any test runs, and a log shows whether this run downloaded them.
      - name: Fetch the pinned Kubernetes binaries
        run: bash hack/test-binaries.sh

      - name: Save the pinned binaries to the cache
        if: steps.binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/frp
            ${{ runner.temp }}/hpcburst-tools
          key: ${{ steps.binaries.outputs.cache-primary-key }}

      # Envoy 1.40.2, beta's Instance router (HBEP-5; issue #429), for the tests that run it. Its cache
      # entry is its own, keyed by the script and the pins file it reads, so a change to the frp or
      # Kubernetes pins does not download Envoy's 107 MB again, nor the reverse. hack/fetch-envoy.sh
      # checks the binary against internal/agent/envoypin/envoy-pins.txt on every run, restored or not.
      # HPCBURST_REQUIRE_ENVOY=1 makes internal/testenv.EnvoyBinary fail, instead of skip, without it.
      - name: Restore the cached Envoy binary
        id: envoy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/envoy
          key: envoy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-envoy.sh', 'internal/agent/envoypin/envoy-pins.txt') }}

      - name: Fetch the pinned Envoy binary
        run: |
          bash hack/fetch-envoy.sh "$RUNNER_TEMP/envoy"
          {
            echo "HPCBURST_ENVOY_DIR=$RUNNER_TEMP/envoy"
            echo "HPCBURST_REQUIRE_ENVOY=1"
          } >> "$GITHUB_ENV"

      - name: Save the Envoy binary to the cache
        if: steps.envoy.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/envoy
          key: ${{ steps.envoy.outputs.cache-primary-key }}

      # The ssh-mode tunnel tests (internal/agent) run OpenSSH's sshd as this user, in inetd
      # mode, with no service and no root. With HPCBURST_REQUIRE_FRP=1 a missing sshd fails them.
      # The package is installed only when sshd is missing, with policy-rc.d refusing to start
      # its service. The system ssh units are then disabled every time, installed or not, so
      # the runner keeps no listening sshd.
      - name: Provide OpenSSH's sshd for the tunnel tests
        run: |
          if ! test -x /usr/sbin/sshd; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          sudo systemctl disable --now ssh.socket ssh.service 2> /dev/null || true
          /usr/sbin/sshd -V 2>&1 | head -1
          echo "HPCBURST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"

      # The steps below run even when an earlier one failed (!cancelled()), but never on a Go that
      # was not verified: without steps.gocheck.outcome a failed install or check would leave PATH
      # without the pinned Go, and hack/go-test.sh would run the runner image's own, unchecked one.
      #
      # One test of internal/lifecycle runs on its own, under its own timeout, so that the package
      # stays clear of go test's 10-minute one, which keeps catching a real hang (issue #282). The step
      # fails unless the test really ran and passed. It runs even if the packages failed. hack/check.sh
      # runs the same parts, so the crd job runs this test too.
      - name: go test, one test on its own timeout
        if: ${{ !cancelled() && steps.gocheck.outcome == 'success' }}
        run: bash hack/go-test.sh own lease

      # internal/lifecycle's other tests that start a control plane, in three groups, and
      # cmd/hpcburst-controller's two failover tests run on their own for the same reason (issue #295):
      # with them, each package was within 1.5x of the 10 minutes on main's slow runs. Each step fails
      # unless every one of its tests ran and passed, with nothing skipped, and hack/check.sh runs the
      # same groups, so the crd job runs these tests too.
      - name: go test, internal/lifecycle's caches tests on their own timeout
        if: ${{ !cancelled() && steps.gocheck.outcome == 'success' }}
        run: bash hack/go-test.sh own lifecycle-caches

      - name: go test, internal/lifecycle's two-copy tests on their own timeout
        if: ${{ !cancelled() && steps.gocheck.outcome == 'success' }}
        run: bash hack/go-test.sh own lifecycle-copies

      - name: go test, internal/lifecycle's other control-plane tests on their own timeout
        if: ${{ !cancelled() && steps.gocheck.outcome == 'success' }}
        run: bash hack/go-test.sh own lifecycle-control-plane

      - name: go test, cmd/hpcburst-controller's failover tests on their own timeout
        if: ${{ !cancelled() && steps.gocheck.outcome == 'success' }}
        run: bash hack/go-test.sh own controller-failover

      # hack/livechecks' dry runs through hack/live-checks.sh, which build and run the real test
      # binaries and agent, run in two groups of their own for the same reason (PR #306): each step
      # fails unless every one of its tests ran and passed, with nothing skipped.
      - name: go test, hack/livechecks' host-dialed dry runs on their own timeout
        if: ${{ !cancelled() && steps.gocheck.outcome == 'success' }}
        run: bash hack/go-test.sh own livechecks-hostdialed

      - name: go test, hack/livechecks' other dry runs on their own timeout
        if: ${{ !cancelled() && steps.gocheck.outcome == 'success' }}
        run: bash hack/go-test.sh own livechecks-dry

  tidy:
    name: tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go comes from a pinned tarball (see the top of this file). The only thing restored is that
      # tarball, never a module cache, which could make an untidy go.mod look tidy; the next step
      # asserts the module cache is empty.
      - name: Read the Go version from go.mod
        id: goversion
        run: |
          # A failing script must fail this step: "echo ...$(cmd)" would hide its exit status.
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Go archive
        id: goarchive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}

      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"
          echo "::add-matcher::$GITHUB_WORKSPACE/.github/go-problem-matcher.json"

      - name: Save the Go archive to the cache
        if: steps.goarchive.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: ${{ steps.goarchive.outputs.cache-primary-key }}

      - name: Check the Go on PATH is the pinned toolchain
        id: gocheck
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"

      - name: Assert that the module cache is empty
        run: |
          modcache=$(go env GOMODCACHE)
          if [ -n "$(find "$modcache" -mindepth 1 -print -quit 2>/dev/null)" ]; then
            echo "::error title=module cache::$modcache is not empty, so a cache was restored"
            du -sh "$modcache"
            find "$modcache" -mindepth 1 -maxdepth 3 | head -20
            exit 1
          fi
          echo "module cache $modcache is empty: nothing was restored"

      - name: go mod tidy -diff
        run: |
          if ! go mod tidy -diff; then
            echo "::error title=go mod tidy::go.mod or go.sum is not tidy; run go mod tidy and commit the result"
            exit 1
          fi
          echo "go.mod and go.sum are tidy"

  crd:
    name: crd and envtest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go comes from a pinned tarball (see the top of this file), and no module cache is restored here
      # either, because hack/check.sh runs go mod tidy -diff itself.
      - name: Read the Go version from go.mod
        id: goversion
        run: |
          # A failing script must fail this step: "echo ...$(cmd)" would hide its exit status.
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Go archive
        id: goarchive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}

      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"
          echo "::add-matcher::$GITHUB_WORKSPACE/.github/go-problem-matcher.json"

      - name: Save the Go archive to the cache
        if: steps.goarchive.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: ${{ steps.goarchive.outputs.cache-primary-key }}

      - name: Check the Go on PATH is the pinned toolchain
        id: gocheck
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"

      # The modules are downloaded here, before anything builds: go mod download, tried again when it
      # fails, then go mod verify (hack/go-mod-download.sh, issue #346). Nothing is cached between runs.
      - name: Download and verify the Go modules
        run: bash hack/go-mod-download.sh

      # The pinned binaries come from the cache when it has them (see the top of this file): frp,
      # and the Kubernetes binaries that hack/test-binaries.sh keeps under HPCBURST_TOOLS_CACHE.
      # The go, go own-timeout and crd jobs share one entry. The path lines of the restore and the save must match.
      - name: Choose where the Kubernetes test binaries are cached
        run: echo "HPCBURST_TOOLS_CACHE=$RUNNER_TEMP/hpcburst-tools" >> "$GITHUB_ENV"

      - name: Restore the cached pinned binaries
        id: binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/frp
            ${{ runner.temp }}/hpcburst-tools
          key: binaries-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-frp.sh', 'hack/test-binaries.sh') }}

      # The tunnel tests of HBEP-6 start frps and frpc. HPCBURST_REQUIRE_FRP=1 makes
      # internal/testenv.FrpBinaries fail, instead of skip, when they are missing; the script
      # checks the release's sha256 before it extracts anything.
      - name: Fetch the pinned frp binaries
        run: |
          bash hack/fetch-frp.sh "$RUNNER_TEMP/frp"
          {
            echo "HPCBURST_FRP_DIR=$RUNNER_TEMP/frp"
            echo "HPCBURST_REQUIRE_FRP=1"
          } >> "$GITHUB_ENV"

      # The Kubernetes binaries are fetched here, not inside go test, so that they are verified and
      # saved before any test runs, and a log shows whether this run downloaded them.
      - name: Fetch the pinned Kubernetes binaries
        run: bash hack/test-binaries.sh

      - name: Save the pinned binaries to the cache
        if: steps.binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/frp
            ${{ runner.temp }}/hpcburst-tools
          key: ${{ steps.binaries.outputs.cache-primary-key }}

      # Envoy 1.40.2, beta's Instance router (HBEP-5; issue #429), for the tests that run it. Its cache
      # entry is its own, keyed by the script and the pins file it reads, so a change to the frp or
      # Kubernetes pins does not download Envoy's 107 MB again, nor the reverse. hack/fetch-envoy.sh
      # checks the binary against internal/agent/envoypin/envoy-pins.txt on every run, restored or not.
      # HPCBURST_REQUIRE_ENVOY=1 makes internal/testenv.EnvoyBinary fail, instead of skip, without it.
      - name: Restore the cached Envoy binary
        id: envoy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/envoy
          key: envoy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-envoy.sh', 'internal/agent/envoypin/envoy-pins.txt') }}

      - name: Fetch the pinned Envoy binary
        run: |
          bash hack/fetch-envoy.sh "$RUNNER_TEMP/envoy"
          {
            echo "HPCBURST_ENVOY_DIR=$RUNNER_TEMP/envoy"
            echo "HPCBURST_REQUIRE_ENVOY=1"
          } >> "$GITHUB_ENV"

      - name: Save the Envoy binary to the cache
        if: steps.envoy.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/envoy
          key: ${{ steps.envoy.outputs.cache-primary-key }}

      # The ssh-mode tunnel tests (internal/agent) run OpenSSH's sshd as this user, in inetd
      # mode, with no service and no root. With HPCBURST_REQUIRE_FRP=1 a missing sshd fails them.
      # The package is installed only when sshd is missing, with policy-rc.d refusing to start
      # its service. The system ssh units are then disabled every time, installed or not, so
      # the runner keeps no listening sshd.
      - name: Provide OpenSSH's sshd for the tunnel tests
        run: |
          if ! test -x /usr/sbin/sshd; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          sudo systemctl disable --now ssh.socket ssh.service 2> /dev/null || true
          /usr/sbin/sshd -V 2>&1 | head -1
          echo "HPCBURST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"

      # check.sh runs gofmt, vet, tidy, the CRD drift check (hack/verify-generated.sh) and the
      # tests. The tests fetch the pinned Kubernetes binaries through hack/test-binaries.sh,
      # which checks their sha256. The go and tidy jobs repeat some of this on purpose: each
      # failure then shows up under its own check.
      - name: hack/check.sh
        run: |
          log="$RUNNER_TEMP/check.log"
          rc=0
          bash hack/check.sh 2>&1 | tee "$log" || rc=$?
          # check.sh ends with the list of skipped tests; put it in the job summary.
          {
            echo "### crd and envtest"
            echo '```'
            # At most 100 lines, to keep the summary readable; the job log has them all. To show more,
            # change the 100. One awk reads the whole log, so no writer meets a closed pipe, which under
            # pipefail and -e could fail this step once the list passed 100 lines (#237).
            awk '/^== skipped tests/ { on = 1 } on && ++n <= 100 { print } END { if (n > 100) print "... and " (n - 100) " more lines in the job log" }' "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  launcher-k3s:
    name: launcher-k3s
    runs-on: ubuntu-24.04
    # The test step gives each of the script's two test binaries 30 minutes, run one after the
    # other, so 60 minutes of tests plus checkout, the k3s download and compiling. The job must
    # outlive that, so that go test's own timeout (which stops the k3s it started) fires first.
    timeout-minutes: 80
    env:
      # The k3s versions this job fetches. The cache key and the fetch step both read this one list,
      # so a version cannot be added to one and not the other. It is a JSON list because an
      # expression can then join it with a dash for the key and with a space for the command.
      K3S_VERSIONS: '["1.35.9", "1.36.5"]'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose where the k3s binaries go
        run: echo "HPCBURST_BIN_DIR=$RUNNER_TEMP/k3s-bin" >> "$GITHUB_ENV"

      # The pinned binaries come from the cache when it has them (see the top of this file). The
      # path lines of the restore and the save must match.
      - name: Restore the cached pinned binaries
        id: binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/k3s-bin
            ${{ runner.temp }}/frp
          key: binaries-launcher-k3s-${{ join(fromJSON(env.K3S_VERSIONS), '-') }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-frp.sh', 'hack/fetch-k3s.sh', 'internal/launcher/k3s-pins.txt') }}

      - name: Read the Go version from go.mod
        id: goversion
        run: |
          # A failing script must fail this step: "echo ...$(cmd)" would hide its exit status.
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Go archive
        id: goarchive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}

      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"
          echo "::add-matcher::$GITHUB_WORKSPACE/.github/go-problem-matcher.json"

      - name: Save the Go archive to the cache
        if: steps.goarchive.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: ${{ steps.goarchive.outputs.cache-primary-key }}

      - name: Check the Go on PATH is the pinned toolchain
        id: gocheck
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"

      # The modules are downloaded here, before anything builds: go mod download, tried again when it
      # fails, then go mod verify (hack/go-mod-download.sh, issue #346). Nothing is cached between runs.
      - name: Download and verify the Go modules
        run: bash hack/go-mod-download.sh

      # Downloads the two pinned k3s releases the tests start (1.35.9, then upgraded to 1.36.5) and
      # checks their sha256 against internal/launcher/k3s-pins.txt.
      - name: Fetch the pinned k3s binaries
        run: bash hack/fetch-k3s.sh "$HPCBURST_BIN_DIR" ${{ join(fromJSON(env.K3S_VERSIONS), ' ') }}

      # The tunnel tests of HBEP-6 start frps and frpc. HPCBURST_REQUIRE_FRP=1 makes
      # internal/testenv.FrpBinaries fail, instead of skip, when they are missing; the script
      # checks the release's sha256 before it extracts anything.
      - name: Fetch the pinned frp binaries
        run: |
          bash hack/fetch-frp.sh "$RUNNER_TEMP/frp"
          {
            echo "HPCBURST_FRP_DIR=$RUNNER_TEMP/frp"
            echo "HPCBURST_REQUIRE_FRP=1"
          } >> "$GITHUB_ENV"

      - name: Save the pinned binaries to the cache
        if: steps.binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/k3s-bin
            ${{ runner.temp }}/frp
          key: ${{ steps.binaries.outputs.cache-primary-key }}

      # k3s runs as the invoking user (server --rootless --disable-agent), which needs no user
      # namespace, so AppArmor's restriction on them does not matter to it. The size-limited
      # volume of the store-full tests is a FUSE file system that go-fuse mounts through the
      # setuid helper fusermount3, or fusermount when there is no fusermount3. Rather than guess
      # from file modes, the probe does what go-fuse does: it runs that helper to mount a tiny
      # file system as this user, checks the mount, and unmounts it. The three tests are
      # excluded only when that fails. The job cannot install anything, because it never uses sudo.
      - name: Probe what this runner offers
        id: probe
        run: |
          cat > "$RUNNER_TEMP/fuse-probe.py" <<'PY'
          import array, os, shutil, socket, subprocess, sys, tempfile

          mnt = None

          def fail(msg):
              print(msg)
              if mnt:
                  try:
                      os.rmdir(mnt)  # the probe's own empty directory; a live mount cannot be removed
                  except OSError:
                      pass
              sys.exit(1)

          # go-fuse v2.12.1 (fuse/mount_linux.go): fusermount3, else fusermount; PATH, then /bin.
          helper = None
          for name in ("fusermount3", "fusermount"):
              helper = shutil.which(name) or shutil.which(name, path="/bin")
              if helper:
                  break
          if not helper:
              fail("neither fusermount3 nor fusermount is installed")
          if not os.access("/dev/fuse", os.W_OK):
              fail("/dev/fuse is not writable")

          mnt = os.path.realpath(tempfile.mkdtemp(prefix="fuse-probe-"))

          def mounted():
              with open("/proc/self/mountinfo") as f:
                  return any(line.split()[4] == mnt for line in f)

          local, remote = socket.socketpair(socket.AF_UNIX, socket.SOCK_DGRAM)
          local.settimeout(20)
          env = {"_FUSE_COMMFD": str(remote.fileno()), "PATH": os.environ.get("PATH", "")}
          try:
              proc = subprocess.run([helper, mnt, "-o", "fsname=hpcburst-probe"], env=env,
                                    pass_fds=(remote.fileno(),), capture_output=True, text=True, timeout=30)
          except subprocess.TimeoutExpired:
              fail("%s did not finish within 30 s" % helper)
          if proc.returncode != 0:
              fail("%s could not mount as this user: exit %d: %s" % (helper, proc.returncode, proc.stderr.strip()))
          try:
              _, anc, _, _ = local.recvmsg(1, socket.CMSG_LEN(array.array("i").itemsize))
          except OSError as e:
              fail("%s exited 0 but sent no descriptor: %s" % (helper, e))
          fds = array.array("i")
          for level, kind, data in anc:
              if level == socket.SOL_SOCKET and kind == socket.SCM_RIGHTS:
                  fds.frombytes(data[: len(data) - (len(data) % fds.itemsize)])
          if not fds:
              fail("%s exited 0 but sent no descriptor" % helper)
          ok = mounted()
          os.close(fds[0])  # closing the descriptor aborts the connection; nothing serves requests
          un = subprocess.run([helper, "-u", mnt], capture_output=True, text=True, timeout=30)
          if not ok:
              fail("%s exited 0 but %s is not in /proc/self/mountinfo" % (helper, mnt))
          if un.returncode != 0 or mounted():
              fail("%s mounted, but unmounting failed: %s" % (helper, un.stderr.strip()))
          os.rmdir(mnt)
          print("mounted and unmounted a FUSE file system as this user with %s" % helper)
          PY
          if out=$(python3 -I "$RUNNER_TEMP/fuse-probe.py" 2>&1); then
            fuse=yes
          else
            fuse=no
          fi
          reason=$(echo "$out" | tr '\n' ' ')
          echo "fuse=$fuse" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "### launcher-k3s: what this runner offers"
            echo '```'
            echo "FUSE probe ($fuse): $reason"
            echo "kernel.apparmor_restrict_unprivileged_userns = $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>&1)"
            echo "/dev/fuse: $(ls -l /dev/fuse 2>&1)"
            echo "memory available: $(awk '/MemAvailable/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo)"
            echo "free disk in /tmp: $(df -h --output=avail /tmp | tail -1 | tr -d ' ')"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: hack/test-launcher.sh
        env:
          FUSE: ${{ steps.probe.outputs.fuse }}
          FUSE_REASON: ${{ steps.probe.outputs.reason }}
        run: |
          # test-launcher.sh gives each of its two test binaries 60 minutes, one after the other.
          # The whole suite took about 7 minutes on a runner, so each gets 30 minutes here: the
          # worst case is 60 minutes of tests plus a few minutes to compile, inside the job's 80,
          # so go test's own timeout (which stops the k3s it started) fires before the job's.
          args=(-timeout 30m)
          # test-launcher.sh turns a failed FUSE mount into a failure, so a runner where the
          # probe's mount failed would fail the whole job. The tests that need the volume are left
          # out instead, and the summary says so. go test -skip leaves no "--- SKIP" line, so the
          # warning and the "excluded" line below are the only record.
          excluded=()
          if [ "$FUSE" != "yes" ]; then
            excluded=(TestCapVolume TestStoreFull TestStoreFullWholeDataDir)
            args+=(-skip "^($(IFS='|'; echo "${excluded[*]}"))\$")
            msg="NOT RUN: ${excluded[*]} need a size-limited FUSE volume, and the mount probe failed on this runner ($FUSE_REASON)"
            echo "::warning title=store-full tests not run::$msg"
            {
              echo "### launcher-k3s"
              echo "$msg"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          log="$RUNNER_TEMP/launcher-test.log"
          rc=0
          bash hack/test-launcher.sh "${args[@]}" 2>&1 | tee "$log" || rc=$?
          {
            echo "### launcher-k3s: results"
            echo '```'
            grep -E '^summary: ' "$log" || echo "no summary line: the run did not finish"
            echo "excluded by -skip, not run: ${#excluded[@]}${excluded[*]:+ (${excluded[*]})}"
            grep -E '^\s*--- SKIP' "$log" | sed 's/^ *//' | head -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # The one-host alpha rehearsal (issue #146): the whole stack on this runner, the real hpcburst
  # up (k3s, the controller, frps and the front) over a fake Slurm cluster in run mode, reached
  # over a real sshd, with the real hb-agent in the fake job. hack/rehearsal.sh builds the four
  # binaries and runs it. It is not one of the required checks: a failure here is a finding to
  # read, not a block on merging.
  rehearsal:
    name: rehearsal
    runs-on: ubuntu-24.04
    # Compiling the four binaries and the test from scratch, then a run whose -test.timeout is 30
    # minutes (hack/rehearsal.sh; the target is under 15). The job must outlive that, so that the
    # test's own waits give up and its clean-up runs before the job is cancelled.
    timeout-minutes: 45
    env:
      # The k3s versions this job fetches; the cache key and the fetch step both read this list (see
      # launcher-k3s).
      K3S_VERSIONS: '["1.36.5"]'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Go version from go.mod
        id: goversion
        run: |
