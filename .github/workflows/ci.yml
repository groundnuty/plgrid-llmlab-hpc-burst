# Continuous integration for the root Go module (issue #54).
#
# It runs the repository's own checks on every pull request and on every push to main:
#   go           gofmt, go vet, go test
#   tidy         go mod tidy -diff, in a job of its own that restores no module cache
#   crd          hack/check.sh: generated-CRD drift, envtest with the pinned binaries, sha256 checks
#   launcher-k3s hack/test-launcher.sh against the pinned k3s binaries, run as an ordinary user
#
# The workflow reads no secret and pushes nothing. Every action is pinned by commit SHA.
#
# Two jobs depend on scripts that arrive in other PRs. Until a script exists on the ref being
# tested, the job says so in its summary and in a check annotation, and does nothing else:
#   crd           needs hack/check.sh            (#48)
#   launcher-k3s  needs hack/test-launcher.sh and hack/fetch-k3s.sh (#49)
# TODO(#54): when #48 and #49 are on main, delete these guards, so that a missing script fails
# the job instead of skipping it.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run in progress for it. A push to main is never
# cancelled: its group is its own commit, so every commit on main keeps its own result (a shared
# group would let a newer waiting run replace an older waiting one).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # setup-go installs the version go.mod names. A go.mod that asks for something newer must fail
  # the job, not make the go command download a toolchain on its own.
  GOTOOLCHAIN: local

defaults:
  run:
    # An explicit shell makes GitHub run bash with -e and -o pipefail; the default has no pipefail,
    # so a failing command in front of "| tee" would pass.
    shell: bash

jobs:
  go:
    name: go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go version
        run: go version

      - name: gofmt
        run: |
          # Only the root module's own files. gofmt on a directory would descend into spikes/
          # and third_party/forked/, which are separate modules.
          # shellcheck disable=SC2016 # the $d is a Go template variable, not a shell one
          files=$(go list -f '{{$d := .Dir}}{{range .GoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}{{range .CgoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}{{range .IgnoredGoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}{{range .TestGoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}{{range .XTestGoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}' ./...)
          echo "checking $(echo "$files" | grep -c .) Go files"
          # gofmt -l exits 0 even when it lists files, so fail on any output.
          unformatted=$(echo "$files" | xargs -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error title=gofmt::these files are not formatted; run gofmt -w on them"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: |
          log="$RUNNER_TEMP/go-test.log"
          rc=0
          go test -count=1 -v ./... 2>&1 | tee "$log" || rc=$?
          # A skipped test reports as success, so list every one in the job summary.
          skips=$(grep -c -E '^\s*--- SKIP' "$log" || true)
          {
            echo "### go test"
            echo "Skipped tests: $skips (each one is coverage that did not run)."
            if [ "$skips" != "0" ]; then
              echo '```'
              grep -E '^\s*--- SKIP' "$log" | sed 's/^ *//' | head -100
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  tidy:
    name: tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cache: false, so that no module cache is restored. A cache could make an untidy go.mod
      # look tidy.
      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Assert that the module cache is empty
        run: |
          modcache=$(go env GOMODCACHE)
          if [ -n "$(find "$modcache" -mindepth 1 -print -quit 2>/dev/null)" ]; then
            echo "::error title=module cache::$modcache is not empty, so a cache was restored"
            du -sh "$modcache"
            exit 1
          fi
          echo "module cache $modcache is empty: nothing was restored"

      - name: go mod tidy -diff
        run: |
          if ! go mod tidy -diff; then
            echo "::error title=go mod tidy::go.mod or go.sum is not tidy; run go mod tidy and commit the result"
            exit 1
          fi
          echo "go.mod and go.sum are tidy"

  crd:
    name: crd and envtest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # TODO(#54): delete this step, and the "if" on the two below, once #48 is on main.
      - name: Is hack/check.sh on this ref?
        id: present
        run: |
          if [ -f hack/check.sh ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            msg="skipped: hack/check.sh is not on this ref (#48 is not merged), so the CRD drift check and the envtest tests did not run"
            echo "::notice title=crd and envtest skipped::$msg"
            echo "### crd and envtest" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      # cache: false here too, because hack/check.sh runs go mod tidy -diff itself.
      - name: Set up Go from go.mod
        if: steps.present.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # check.sh runs the CRD drift check (hack/verify-generated.sh), and the tests, which fetch
      # the pinned Kubernetes binaries through hack/test-binaries.sh and check their sha256.
      - name: hack/check.sh
        if: steps.present.outputs.run == 'true'
        run: bash hack/check.sh

  launcher-k3s:
    name: launcher-k3s
    runs-on: ubuntu-24.04
    # test-launcher.sh gives go test 60 minutes; the job must outlive that, so go test's own
    # timeout fires first. The tests also wait up to 15 minutes for a quiet machine.
    timeout-minutes: 80
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # TODO(#54): delete this step, and the "if" on the ones below, once #49 is on main. Until
      # then the job runs by itself on any ref that carries the two scripts: #49's own pull
      # request is the first real run, after it is retargeted to main with this workflow in it.
      - name: Are the launcher scripts on this ref?
        id: present
        run: |
          if [ -f hack/test-launcher.sh ] && [ -f hack/fetch-k3s.sh ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "HPCBURST_BIN_DIR=$RUNNER_TEMP/k3s-bin" >> "$GITHUB_ENV"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            msg="skipped: hack/test-launcher.sh or hack/fetch-k3s.sh is not on this ref (#49 is not merged), so the launcher tests against k3s did not run"
            echo "::notice title=launcher-k3s skipped::$msg"
            echo "### launcher-k3s" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Go from go.mod
        if: steps.present.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Downloads the pinned k3s releases and checks their sha256 against internal/launcher/k3s-pins.txt.
      - name: Fetch the pinned k3s binaries
        if: steps.present.outputs.run == 'true'
        run: bash hack/fetch-k3s.sh "$HPCBURST_BIN_DIR"

      # k3s runs as the invoking user (server --rootless --disable-agent), which needs no user
      # namespace, so AppArmor's restriction on them does not matter to it. The size-limited
      # volume of the store-full tests is a FUSE file system, which needs a writable /dev/fuse
      # and a setuid fusermount3. The job cannot install either, because it never uses sudo.
      - name: Probe what this runner offers
        id: probe
        if: steps.present.outputs.run == 'true'
        run: |
          fuse=yes
          reason=""
          if [ ! -w /dev/fuse ]; then
            fuse=no
            reason="/dev/fuse is not writable"
          elif ! fm=$(command -v fusermount3) || [ ! -u "$fm" ]; then
            fuse=no
            reason="fusermount3 is missing or not setuid"
          fi
          echo "fuse=$fuse" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "### launcher-k3s: what this runner offers"
            echo '```'
            echo "kernel.apparmor_restrict_unprivileged_userns = $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>&1)"
            echo "/dev/fuse: $(ls -l /dev/fuse 2>&1)"
            echo "fusermount3: $(ls -l "$(command -v fusermount3 || echo /nonexistent)" 2>&1)"
            echo "memory available: $(awk '/MemAvailable/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo)"
            echo "free disk in /tmp: $(df -h --output=avail /tmp | tail -1 | tr -d ' ')"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: hack/test-launcher.sh
        if: steps.present.outputs.run == 'true'
        env:
          FUSE: ${{ steps.probe.outputs.fuse }}
          FUSE_REASON: ${{ steps.probe.outputs.reason }}
        run: |
          # test-launcher.sh turns a failed FUSE mount into a failure, so a runner without FUSE
          # would fail the whole job. The three tests that need the volume are left out instead,
          # and the summary says so. go test -skip leaves no "--- SKIP" line, so that line is
          # the only record.
          storefull='TestCapVolume, TestStoreFull, TestStoreFullWholeDataDir'
          args=()
          if [ "$FUSE" != "yes" ]; then
            args+=(-skip '^(TestCapVolume|TestStoreFull|TestStoreFullWholeDataDir)$')
            msg="NOT RUN: $storefull need a size-limited FUSE volume, and this runner has none ($FUSE_REASON)"
            echo "::warning title=store-full tests not run::$msg"
            {
              echo "### launcher-k3s"
              echo "$msg"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          log="$RUNNER_TEMP/launcher-test.log"
          rc=0
          bash hack/test-launcher.sh "${args[@]}" 2>&1 | tee "$log" || rc=$?
          {
            echo "### launcher-k3s: results"
            echo '```'
            grep -E '^summary: ' "$log" || echo "no summary line: the run did not finish"
            grep -E '^\s*--- SKIP' "$log" | sed 's/^ *//' | head -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
