# THROWAWAY, never merged: #429's Q9 long run (the science agent's ruling: once, before beta's
# graduation, and before PR 4 merges, since it closes #429), on a hosted runner. It runs
# TestEnvoyCarriesHBEP5sLongReplies at the pull request's head: the 7,000-token stream at one token a
# second and a first token after 1,100 s, through the agent's Envoy, about two hours. Read-only.
name: e429-q9-long
on:
  pull_request:
    paths:
      - .github/workflows/e429-q9-long.yml
permissions:
  contents: read
jobs:
  long:
    name: q9 long replies through Envoy
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the pull request's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read the Go version from go.mod
        id: goversion
        run: |
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore the cached Go archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}
      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"
      - name: Check the Go on PATH is the pinned toolchain
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"
      - name: Download and verify the Go modules
        run: bash hack/go-mod-download.sh
      - name: Restore the cached Envoy binary
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/envoy
          key: envoy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-envoy.sh', 'internal/agent/envoypin/envoy-pins.txt') }}
      - name: Fetch the pinned Envoy binary
        run: |
          bash hack/fetch-envoy.sh "$RUNNER_TEMP/envoy"
          {
            echo "HPCBURST_ENVOY_DIR=$RUNNER_TEMP/envoy"
            echo "HPCBURST_REQUIRE_ENVOY=1"
          } >> "$GITHUB_ENV"
      - name: Build the test binary
        run: go test -c -o "$RUNNER_TEMP/agent.test" ./internal/agent
      - name: Run the long replies (about two hours)
        working-directory: internal/agent
        run: |
          HPCBURST_ROUTER_LONG=1 "$RUNNER_TEMP/agent.test" -test.v -test.count=1 -test.timeout 170m \
            -test.run '^TestEnvoyCarriesHBEP5sLongReplies$' 2>&1 | tee "$RUNNER_TEMP/long.log"
          grep -E '^(--- |    --- |PASS|FAIL)|envoy_long_test.go' "$RUNNER_TEMP/long.log"
          ! grep -q -E '^\s*--- (FAIL|SKIP)' "$RUNNER_TEMP/long.log"
