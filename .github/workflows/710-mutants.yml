# DO NOT MERGE. A hosted throwaway for #710 (the instance-router rehearsal's event-log step).
#
# TestRehearsalInstanceRouter's stepEventLog (internal/rehearsal/scenario/eventlog_test.go) must fail
# when one emitter of the durable log's events is missing, and name that emitter's reporting controller
# (stack.DescribeMissing, internal/rehearsal/stack/eventlog.go). This runs the test once per mutant, with
# the mutant applied to the checked-out tree here, and passes only when the run FAILS naming exactly the
# controllers the mutant should take away:
#   controller  the lifecycle controller's and the Provider manager's publisher wiring removed in
#               cmd/hpcburst-controller/main.go: hpcburst-lifecycle and hpcburst-provider are missing.
#   front       the front's removed in cmd/hpcburst-front/main.go: hpcburst-front is missing.
#
# The setup steps are the rehearsal job's of ci.yml, copied as they are, except that the checkout is this
# pull request's head, and that every cache save step is dropped (the caches are only restored here). The
# workflow reads no secret and uploads nothing. The rehearsal's output goes to a file, and only the
# missing-controller line and the exit code reach the job log.

name: "throwaway: #710 mutants"

on:
  pull_request:
    paths:
      - ".github/workflows/710-mutants.yml"

permissions:
  contents: read

# A new push to the pull request cancels the runs in progress for it; both legs of the matrix share it.
concurrency:
  group: 710-mutants-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # As ci.yml's: hack/fetch-go.sh installs the version go.mod names, and a go.mod that asks for something
  # newer must fail the job. The proxy first, then the module's own origin.
  GOTOOLCHAIN: local
  GOPROXY: "https://proxy.golang.org|direct"

defaults:
  run:
    # An explicit shell makes GitHub run bash with -e and -o pipefail.
    shell: bash

jobs:
  mutant:
    name: mutant ${{ matrix.mutant }}
    runs-on: ubuntu-24.04
    # The rehearsal job's 45 minutes (compiling the four binaries and the test from scratch, then a run whose
    # -test.timeout is 30 minutes), and a few more for the mutant step and the judging, which take seconds.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mutant: [controller, front]
    env:
      # The k3s versions this job fetches; the cache key and the fetch step both read this list (see
      # launcher-k3s).
      K3S_VERSIONS: '["1.36.5"]'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The mutant, applied right after the checkout so that a change that no longer applies fails in
      # seconds. Each edit is checked: its text occurs once in the file, and the result is exactly the two
      # changes' line counts in the one file. They are #710's builder's mut-controller.diff and
      # mut-front.diff, written as edits so that this commit adds one file only.
      - name: Apply the mutant
        env:
          MUTANT: ${{ matrix.mutant }}
        run: |
          # once TEXT FILE: TEXT occurs exactly once in FILE.
          once() {
            n=$({ grep -oF -- "$1" "$2" || true; } | wc -l)
            if [ "$n" -ne 1 ]; then
              echo "::error::the mutant's text occurs $n times in $2, not once: $1"
              exit 1
            fi
          }
          case "$MUTANT" in
            controller)
              # The controller's publisher of the durable log removed: not set in the options, not in the
              # wiring, and nil for the extra runnables.
              file=cmd/hpcburst-controller/main.go
              want="2/3 $file"
              once 'opts.EventLog = logPub' "$file"
              once 'eventLog: logPub, ' "$file"
              once 'bulkPath, logPub)' "$file"
              sed -i \
                -e '/^[[:space:]]*opts\.EventLog = logPub$/d' \
                -e 's/eventLog: logPub, //' \
                -e 's/bulkPath, logPub)/bulkPath, nil)/' \
                "$file"
              ;;
            front)
              # No token file for the front's recorder, so it publishes to the API only.
              file=cmd/hpcburst-front/main.go
              want="1/1 $file"
              once '*eventLogTokenFile, agentapi.Host' "$file"
              sed -i 's/\*eventLogTokenFile, agentapi\.Host/"", agentapi.Host/' "$file"
              ;;
            *)
              echo "::error::unknown mutant: $MUTANT"
              exit 1
              ;;
          esac
          got=$(git diff --numstat | awk '{ print $1 "/" $2 " " $3 }')
          if [ "$got" != "$want" ]; then
            echo "::error::the mutant changed '$got', expected '$want' (added/deleted lines, file)"
            exit 1
          fi
          git diff --stat

      - name: Read the Go version from go.mod
        id: goversion
        run: |
          # A failing script must fail this step: "echo ...$(cmd)" would hide its exit status.
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Go archive
        id: goarchive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}

      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"
          echo "::add-matcher::$GITHUB_WORKSPACE/.github/go-problem-matcher.json"

      - name: Check the Go on PATH is the pinned toolchain
        id: gocheck
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"

      # The modules are downloaded here, before anything builds: go mod download, tried again when it
      # fails, then go mod verify (hack/go-mod-download.sh, issue #346). Nothing is cached between runs.
      - name: Download and verify the Go modules
        run: bash hack/go-mod-download.sh

      # The pinned binaries come from the cache when it has them (see the top of this file). The
      # two rehearsal jobs share one entry. The path lines of the restore and the save must match.
      - name: Restore the cached pinned binaries
        id: binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/k3s-bin
            ${{ runner.temp }}/frp
          key: binaries-rehearsal-k3s-${{ join(fromJSON(env.K3S_VERSIONS), '-') }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-frp.sh', 'hack/fetch-k3s.sh', 'internal/launcher/k3s-pins.txt') }}

      # The rehearsal's hpcburst up starts k3s 1.36.5 only.
      - name: Fetch the pinned k3s binary
        run: |
          echo "HPCBURST_BIN_DIR=$RUNNER_TEMP/k3s-bin" >> "$GITHUB_ENV"
          bash hack/fetch-k3s.sh "$RUNNER_TEMP/k3s-bin" ${{ join(fromJSON(env.K3S_VERSIONS), ' ') }}

      - name: Fetch the pinned frp binaries
        run: |
          bash hack/fetch-frp.sh "$RUNNER_TEMP/frp"
          echo "HPCBURST_FRP_DIR=$RUNNER_TEMP/frp" >> "$GITHUB_ENV"

      # Envoy 1.40.2, for TestRehearsalInstanceRouter (#454): up --instance-router envoy places it in
      # the agent builds, and the Provider's controller stages it to the fake job, where the agent runs
      # it bare. As in the go job, its cache entry is its own, and hack/fetch-envoy.sh checks it against
      # envoy-pins.txt on every run; HPCBURST_REQUIRE_ENVOY=1 makes a missing one fail, not skip.
      - name: Restore the cached Envoy binary
        id: envoy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/envoy
          key: envoy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-envoy.sh', 'internal/agent/envoypin/envoy-pins.txt') }}

      - name: Fetch the pinned Envoy binary
        run: |
          bash hack/fetch-envoy.sh "$RUNNER_TEMP/envoy"
          {
            echo "HPCBURST_ENVOY_DIR=$RUNNER_TEMP/envoy"
            echo "HPCBURST_REQUIRE_ENVOY=1"
          } >> "$GITHUB_ENV"

      # The fake login node and the ssh dial-home run OpenSSH's sshd as this user, in inetd mode,
      # with no service and no root, as for the go job's tunnel tests.
      - name: Provide OpenSSH's sshd for the login node
        run: |
          if ! test -x /usr/sbin/sshd; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          sudo systemctl disable --now ssh.socket ssh.service 2> /dev/null || true
          /usr/sbin/sshd -V 2>&1 | head -1
          echo "HPCBURST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"

      # hack/rehearsal.sh runs the test in a transient systemd user scope, which it stops however
      # the run ends, so nothing the test started outlives it. A hosted runner's user has no
      # systemd user manager until lingering starts one.
      - name: Start a systemd user manager for this user
        run: |
          if ! dpkg -s dbus-user-session > /dev/null 2>&1; then
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q dbus-user-session
          fi
          sudo loginctl enable-linger "$(id -un)"
          rt="/run/user/$(id -u)"
          timeout 60 sh -c "until test -S '$rt/systemd/private' && test -S '$rt/bus'; do sleep 1; done"
          echo "XDG_RUNTIME_DIR=$rt" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$rt/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$rt" DBUS_SESSION_BUS_ADDRESS="unix:path=$rt/bus" systemd-run --user --scope -q true

      # TestRehearsalInstanceRouter only, with the mutant applied. The run must FAIL, and its failure must be
      # the durable-log step's, naming the reporting controllers the mutant took away and no other. The
      # failure is stack.DescribeMissing's, wrapped by stack.WaitState ("timed out after ...; last: " or "gave
      # up waiting ...; last: "):
      #   the log holds no event from <controller> [<controller>...], missing: [<event>] ...; the log holds N events [...]
      # The controllers are read from between "the log holds no event from " and ", missing:", and must be
      # exactly the expected ones; the text after the ";" lists the events the log DID hold, and the wait's
      # own words say "the front", so a looser match would count a controller that is present. The output is
      # in a file and never printed: it names this runner's paths. Only the matched text up to its ";" and the
      # exit code reach the log.
      - name: hack/rehearsal.sh with the mutant, and judge it
        env:
          MUTANT: ${{ matrix.mutant }}
        run: |
          case "$MUTANT" in
            controller) expect='hpcburst-lifecycle hpcburst-provider' ;;
            front) expect='hpcburst-front' ;;
            *)
              echo "::error::unknown mutant: $MUTANT"
              exit 1
              ;;
          esac
          fail() {
            echo "::error::$1"
            exit 1
          }
          log="$RUNNER_TEMP/rehearsal-output.log"
          rc=0
          REHEARSAL_OUT="$RUNNER_TEMP/rehearsal" REHEARSAL_RUN='^TestRehearsalInstanceRouter$' bash hack/rehearsal.sh > "$log" 2>&1 || rc=$?
          echo "hack/rehearsal.sh exit code: $rc"
          # -a: the output may hold a byte that is not text, and grep would then print no match, only a notice that names the file.
          matched=$({ grep -aoE 'the log holds no event from [^;]*' "$log" || true; } | sort -u)
          echo "matched: ${matched:-(no line)}"
          [ "$rc" -ne 0 ] || fail "the rehearsal passed with the $MUTANT mutant applied: the step did not notice it"
          [ -n "$matched" ] || fail "the rehearsal failed, but not with the durable-log step's missing-event message"
          [ "$(printf '%s\n' "$matched" | wc -l)" -eq 1 ] || fail "more than one distinct missing-event message"
          names=$(printf '%s\n' "$matched" | sed -E 's/^the log holds no event from (.*), missing:.*$/\1/')
          [ "$names" = "$expect" ] || fail "the step names '$names' as missing, expected '$expect'"
          echo "the step failed naming exactly: $expect"
