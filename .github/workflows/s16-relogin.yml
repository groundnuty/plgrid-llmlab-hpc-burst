# One-off workflow for a throwaway draft PR, never merged: spike S16's re-login measurement (issue #412) against
# #424's fix for #417 (the front's router rebuilt on every tunnel registration change, O(N^2) after a mass re-login).
# It is s16.yml's relogin job alone, unchanged but for its sizes: a mass re-login of 100, 300 and 600 frpc through both of
# frps's plugins (the lifecycle controller's admission plugin and the front's), after an frps restart and after a front
# restart, with a no-restart window and the client hold-off control; 1 stream per tunnel at 5 tokens/s, a request in
# flight across every restart. Three repetitions, each its own job on a fresh runner, which records its CPU model.
# #417's witness is the first request's time to first token through the front after each restart (route.go:66), read
# against S16's baseline (hosted run 43115471218, spikes/s16 on spike/412-s16). The tree is #424's head with
# spike/412-s16 merged in, so the harness measures the fixed front. The figures go into #424's body, not into spikes/s16.
# Go comes from the pinned tarball (hack/fetch-go.sh), as in ci.yml; frp from spikes/s16/fetch.sh, checked against
# internal/launcher/frp-pins.txt. Caches are restored only, never saved. No secret is read, nothing is pushed.
name: s16-relogin

on:
  pull_request:
    paths:
      - .github/workflows/s16-relogin.yml

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  relogin:
    name: relogin rep ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    steps:
      - name: Check out the PR's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Read the Go version from go.mod
        id: goversion
        run: |
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore the cached Go archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}
      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"
      - name: The runner
        run: |
          git log -2 --format='%H %s'
          python3 spikes/s16/s16.py host
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket)'
          free -m
          ulimit -n; ulimit -Hn
          sysctl net.ipv4.ip_local_port_range net.ipv4.tcp_tw_reuse net.core.somaxconn
          python3 --version
          ssh -V
      - name: Fetch frp and build the harness
        env:
          S16_BIN: ${{ runner.temp }}/s16bin
        run: bash spikes/s16/fetch.sh
      - name: The harness's unit tests
        working-directory: spikes/s16
        run: |
          go vet ./...
          go test -count=1 ./...
          python3 -m unittest discover -s tests -v
      - name: The measurements
        env:
          S16_BIN: ${{ runner.temp }}/s16bin
          S16_WORK: ${{ runner.temp }}/w
          S16_RESULTS: ${{ runner.temp }}/s16results/relogin-rep${{ matrix.rep }}
        run: |
          mkdir -p -m 700 "$S16_WORK"
          ulimit -n "$(ulimit -Hn)"
          python3 spikes/s16/s16.py relogin --rep ${{ matrix.rep }} --sizes 100 300 600
          python3 spikes/s16/s16.py leftovers
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s16-${{ github.job }}-${{ matrix.tunnels || 'all' }}-rep${{ matrix.rep }}
          path: ${{ runner.temp }}/s16results
          retention-days: 14
          if-no-files-found: error

