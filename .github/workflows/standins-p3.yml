# One-off workflow for a throwaway draft PR (issue #376, P3), never merged.
# Row A on plgrid-now, alpha-athena-now-serve: its two stand-ins (internal/alpha, standin_test.go), each the LIVE
# steps over the real stack on the runner and a fake Slurm in run mode behind the rehearsal's sshd, which proves the
# wiring and not a cluster. TestStandInNowServe is the requeue's order (the deployment's end set first, the drain seen,
# then the fake's RequeueHold): the Instance ends Requeued, no replacement, the held job cancelled by the failed
# Allocation's release; and, starting cold, the agent's own log shows no warm start, so the run is NOT RUN on that
# alone. TestStandInNowServeRequeueRefused sends scontrol requeuehold over the run's ssh, which the fake refuses: NOT
# RUN, its reason posted. TestStandInNowServeWarm first runs the real stage helper (the pre-staging row's) as a job of
# the stand-in's fake Slurm into the Provider's staging directory, then row A, whose real agent must find the cache
# warm by its own lines: a PASS with every check, the requeue's three parts and the warm start among them; the helper
# is built by the test with go. Each runs -count=10 under two CPU spinners and must pass all 10.
#
# The mutants job applies one stand-in mutant each, by exact-string replacement, to the PR's head, and runs the
# stand-in once: it must FAIL. The baseline is the standins job, the same binary build and command unmutated.
#   - end-not-set: the requeue's step 1 dropped (the deployment's end stays the planned one): the controller is never
#     seen draining the Instance before the requeue, and the run fails; killed by TestStandInNowServe.
#   - warm-from-a-cold-log: the warm-start seam passes every log: the cold stand-in then passes where it must be NOT
#     RUN; killed by TestStandInNowServe.
#   - requeue-not-held: the stream held across the requeue's window dropped, so that the Instance's drain can end it
#     Drained before the requeue lands, or the requeue meets a cancelled job; killed by TestStandInNowServe when the
#     race is lost (it may survive a run that wins it: reported, not required).
#
# HPCBURST_REQUIRE_SSHD=1, so a missing sshd fails instead of skipping. The Go, k3s, frp and sshd steps are ci.yml's
# with the caches restored only, never saved. No secret is read, nothing is pushed.
name: standins-p3

on:
  pull_request:
    paths:
      - .github/workflows/standins-p3.yml

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  HPCBURST_REQUIRE_SSHD: "1"

defaults:
  run:
    shell: bash

jobs:
  standins:
    name: stand-in ${{ matrix.test }} -count=10
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        test:
          - TestStandInNowServe
          - TestStandInNowServeRequeueRefused
          - TestStandInNowServeWarm
    steps:
      - name: Check out the PR's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Read the Go version from go.mod
        id: goversion
        run: |
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Go archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}

      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"

      - name: Check the Go on PATH is the pinned toolchain
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"

      - name: Download and verify the Go modules
        run: bash hack/go-mod-download.sh

      # ci.yml's launcher-k3s steps: the pinned k3s the stand-in's hpcburst up starts, and the pinned frp, each checked
      # against its sha256 by the script before it is used.
      - name: Fetch the pinned k3s and frp
        run: |
          bash hack/fetch-k3s.sh "$RUNNER_TEMP/k3s-bin" 1.36.5
          bash hack/fetch-frp.sh "$RUNNER_TEMP/frp"
          {
            echo "HPCBURST_BIN_DIR=$RUNNER_TEMP/k3s-bin"
            echo "HPCBURST_FRP_DIR=$RUNNER_TEMP/frp"
            echo "HPCBURST_REQUIRE_FRP=1"
          } >> "$GITHUB_ENV"

      - name: Provide OpenSSH's sshd for the rehearsal login node
        run: |
          if ! test -x /usr/sbin/sshd; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          sudo systemctl disable --now ssh.socket ssh.service 2> /dev/null || true
          /usr/sbin/sshd -V 2>&1 | head -1
          echo "HPCBURST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"

      - name: Build the stack's binaries and the test binary
        run: |
          mkdir -p "$RUNNER_TEMP/rbin"
          go build -o "$RUNNER_TEMP/rbin/" ./cmd/hpcburst ./cmd/hpcburst-controller ./cmd/hpcburst-front ./cmd/hb-agent
          go test -c -o "$RUNNER_TEMP/alpha.test" ./internal/alpha/
          echo "HPCBURST_REHEARSAL_BIN=$RUNNER_TEMP/rbin" >> "$GITHUB_ENV"

      - name: Run it 10 times under two CPU spinners
        working-directory: internal/alpha
        env:
          TEST: ${{ matrix.test }}
          HPCBURST_ALPHA_STANDIN: "1"
        run: |
          # Two spinners at the lowest priority, each bounded by timeout, so they
          # end by themselves; the runner ends what is left at the job's end.
          for i in 1 2; do timeout 110m nice -n 19 sh -c 'while :; do :; done' & done
          log="$RUNNER_TEMP/standin.log"
          rc=0
          "$RUNNER_TEMP/alpha.test" -test.run "^${TEST}\$" -test.count 10 -test.v -test.timeout 110m > "$log" 2>&1 || rc=$?
          passes=$(grep -c -E "^--- PASS: ${TEST} " "$log" || true)
          fails=$(grep -c -E "^\s*--- FAIL" "$log" || true)
          skips=$(grep -c -E "^\s*--- SKIP" "$log" || true)
          leaks=$(grep -E '^rehearsal: [0-9]+ leaked' "$log" || echo "no leak line")
          {
            echo "### ${TEST}"
            echo "passes: $passes of 10; fails: $fails; skips: $skips; $leaks; exit $rc"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E '^(\s*--- FAIL|    [a-z_]+_test\.go:[0-9]+: alpha-athena-now-serve: (NOT RUN|FAIL))' "$log" | head -100 || true
          tail -3 "$log"
          test "$rc" = 0 && test "$passes" = 10 && test "$fails" = 0 && test "$skips" = 0 && grep -q '^rehearsal: 0 leaked' "$log"

  mutants:
    name: stand-in mutant ${{ matrix.mutant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - mutant: end-not-set
            file: internal/alpha/now_flows_test.go
            old: "if _, err := r.endAt(time.Now()); err != nil {"
            new: "if _, err := r.endAt(r.oneEnd); err != nil {"
            required: "true"
          - mutant: warm-from-a-cold-log
            file: internal/alpha/nowserve.go
            old: "\te := &WarmUnshownError{LogRead: w.LogRead, FilesOf: len(w.Files)}\n\tif !w.LogRead {"
            new: "\te := &WarmUnshownError{LogRead: w.LogRead, FilesOf: len(w.Files)}\n\tif true {\n\t\treturn nil\n\t}\n\tif !w.LogRead {"
            required: "true"
          - mutant: requeue-not-held
            file: internal/alpha/now_flows_test.go
            old: "\thold := r.openStream(n, r.fc.KeyFor(&in), \"\")\n\t<-hold.first\n"
            new: "\thold := r.openStream(1, r.fc.KeyFor(&in), \"\")\n\t<-hold.first\n\t_ = r.finish(hold)\n"
            required: "false"
    steps:
      - name: Check out the PR's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Read the Go version from go.mod
        id: goversion
        run: |
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Go archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}

      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"

      - name: Download and verify the Go modules
        run: bash hack/go-mod-download.sh

      # ci.yml's launcher-k3s steps: the pinned k3s the stand-in's hpcburst up starts, and the pinned frp, each checked
      # against its sha256 by the script before it is used.
      - name: Fetch the pinned k3s and frp
        run: |
          bash hack/fetch-k3s.sh "$RUNNER_TEMP/k3s-bin" 1.36.5
          bash hack/fetch-frp.sh "$RUNNER_TEMP/frp"
          {
            echo "HPCBURST_BIN_DIR=$RUNNER_TEMP/k3s-bin"
            echo "HPCBURST_FRP_DIR=$RUNNER_TEMP/frp"
            echo "HPCBURST_REQUIRE_FRP=1"
          } >> "$GITHUB_ENV"

      - name: Provide OpenSSH's sshd for the rehearsal login node
        run: |
          if ! test -x /usr/sbin/sshd; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          sudo systemctl disable --now ssh.socket ssh.service 2> /dev/null || true
          echo "HPCBURST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"

      - name: Apply the mutant by exact-string replacement
        env:
          FILE: ${{ matrix.file }}
          OLD: ${{ matrix.old }}
          NEW: ${{ matrix.new }}
        run: |
          python3 - <<'PY'
          import os, sys
          p, old, new = os.environ["FILE"], os.environ["OLD"], os.environ["NEW"]
          s = open(p).read()
          if s.count(old) != 1:
              sys.exit(f"the mutant's text occurs {s.count(old)} times in {p}, want once")
          open(p, "w").write(s.replace(old, new))
          PY
          git diff --stat

      - name: Build the stack's binaries and the mutated test binary
        run: |
          mkdir -p "$RUNNER_TEMP/rbin"
          go build -o "$RUNNER_TEMP/rbin/" ./cmd/hpcburst ./cmd/hpcburst-controller ./cmd/hpcburst-front ./cmd/hb-agent
          go test -c -o "$RUNNER_TEMP/alpha.test" ./internal/alpha/
          echo "HPCBURST_REHEARSAL_BIN=$RUNNER_TEMP/rbin" >> "$GITHUB_ENV"

      - name: Run the stand-in once; the mutant must fail it
        working-directory: internal/alpha
        env:
          HPCBURST_ALPHA_STANDIN: "1"
          REQUIRED: ${{ matrix.required }}
          MUTANT: ${{ matrix.mutant }}
        run: |
          log="$RUNNER_TEMP/mutant.log"
          rc=0
          "$RUNNER_TEMP/alpha.test" -test.run '^TestStandInNowServe$' -test.count 1 -test.v -test.timeout 40m > "$log" 2>&1 || rc=$?
          killed=0
          grep -q -E '^--- FAIL: TestStandInNowServe ' "$log" && killed=1
          echo "### ${MUTANT}: killed $killed (exit $rc; required: ${REQUIRED})" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E '^    (standin|now_flows)_test\.go:[0-9]+:' "$log" | tail -20 || true
          test "$killed" = 1 || test "$REQUIRED" = false
