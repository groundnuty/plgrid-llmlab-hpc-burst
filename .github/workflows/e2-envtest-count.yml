# THROWAWAY, DO NOT MERGE. Runs the envtest rows that PR #697 (E2 of #625) adds or changes in
# internal/providerctl/e2e, 10 times each, on a GitHub-hosted runner. They ran only twice locally,
# because the VM's envtest.lock queue was 35-45 minutes per run.
#
# It triggers on a pull request that changes this file and on nothing else, reads no secret and pushes
# nothing. Its setup steps are ci.yml's go job's, with the same SHA-pinned actions. Both cache steps
# are restore-only: this workflow never writes a cache entry. The restore's path list is ci.yml's own,
# frp included, because GitHub's cache version hashes the paths: a shorter list would not find the
# entry that main saved. No frp, Envoy or sshd step: nothing in this package uses them.
#
# The test binary writes its whole output to a file, not to the job log. The summary step counts each
# test's top-level PASS and FAIL lines, and prints to the job log only the lines of the runs that
# failed (the last 200 of each).

name: "throwaway: #697 envtest rows -count=10"

on:
  pull_request:
    paths: ['.github/workflows/e2-envtest-count.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOPROXY: "https://proxy.golang.org|direct"
  # The rows, once: the test step runs this regex and the summary step reads its names from it.
  E2_RUN: '^(TestEventsSurviveALogCrashDownPastTheRetries|TestWithNoLogRunningTheFirstLossRaisesEventsNotLogged|TestAFailedStatusWriteRaisesJobStartedAgainUnderTheSameID|TestAMovedHardEndRaisesHardEndNearAgain|TestAllocationEventsOnTheFakeSlurm|TestAllocationFailures|TestDeletingARunningAllocationRaisesJobEndedWithTheCause|TestDeletingAnAllocationThatCarriesSubmittedAsOtherRaisesNoEndEvent|TestNoLoggedNoteNamesAPathUserAccountOrGrant|TestRepeatingAllocationConditions|TestTheTypedSeriesAreCreatedAtZero)$'

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: rows
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the pull request's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read the Go version from go.mod
        id: goversion
        run: |
          # A failing script must fail this step: "echo ...$(cmd)" would hide its exit status.
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Go archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}

      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"
          echo "::add-matcher::$GITHUB_WORKSPACE/.github/go-problem-matcher.json"

      - name: Check the Go on PATH is the pinned toolchain
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"

      - name: Download and verify the Go modules
        run: bash hack/go-mod-download.sh

      - name: Go version
        run: go version

      - name: Choose where the Kubernetes test binaries are cached
        run: echo "HPCBURST_TOOLS_CACHE=$RUNNER_TEMP/hpcburst-tools" >> "$GITHUB_ENV"

      - name: Restore the cached pinned binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/frp
            ${{ runner.temp }}/hpcburst-tools
          key: binaries-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-frp.sh', 'hack/test-binaries.sh') }}

      - name: Fetch the pinned Kubernetes binaries
        run: bash hack/test-binaries.sh

      # The binary is built first, so that a build failure shows in this step's own output. Its exit is
      # kept in rc, read with no pipe in front of it, and handed to the summary step.
      - name: Run the rows 10 times
        id: run
        run: |
          go test -c -o "$RUNNER_TEMP/e2e.test" ./internal/providerctl/e2e
          cd internal/providerctl/e2e
          rc=0
          "$RUNNER_TEMP/e2e.test" -test.run "$E2_RUN" -test.count=10 -test.v -test.timeout 55m > "$RUNNER_TEMP/e2e.log" 2>&1 || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # One row per test. A test that did not pass 10 times, a missing log and a missing exit all fail
      # the step; nothing from the log is printed but the failing runs' lines.
      - name: Summarise the rows
        if: always()
        env:
          RC: ${{ steps.run.outputs.rc }}
        run: |
          log="$RUNNER_TEMP/e2e.log"
          if [ ! -f "$log" ]; then
            echo "The test binary wrote no log: the build or an earlier step failed before it ran." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::no test log, nothing ran"
            exit 1
          fi
          names=$(printf '%s\n' "$E2_RUN" | sed -E 's/^\^\(//; s/\)\$$//' | tr '|' '\n')
          # Top-level lines only, at column 0 (a subtest's lines are indented), compared as strings.
          count() { awk -v p="$1" 'index($0, p) == 1 { c++ } END { print c + 0 }' "$log"; }
          total_pass=0
          total_fail=0
          failing=""
          short=""
          {
            echo "### #697 envtest rows, -count=10"
            echo
            echo "| test | PASS | FAIL |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for n in $names; do
            p=$(count "--- PASS: $n (")
            f=$(count "--- FAIL: $n (")
            echo "| $n | $p | $f |" >> "$GITHUB_STEP_SUMMARY"
            total_pass=$((total_pass + p))
            total_fail=$((total_fail + f))
            if [ "$f" -gt 0 ]; then failing="$failing $n"; fi
            if [ "$p" -lt 10 ]; then short="$short $n"; fi
          done
          {
            echo "| **total** | $total_pass | $total_fail |"
            echo
            echo "The test binary's exit: \`${RC:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Each failing run: its lines from "=== RUN" to "--- FAIL", the last 200 of them, to the job log.
          for n in $failing; do
            echo "::group::failing runs of $n"
            awk -v name="$n" -v max=200 '
              $0 == "=== RUN   " name { inrun = 1; n = 0; next }
              inrun && index($0, "--- PASS: " name " (") == 1 { inrun = 0; next }
              inrun && index($0, "--- FAIL: " name " (") == 1 {
                runs++
                print "=== failing run " runs " of " name " (=== RUN ... --- FAIL)"
                if (n > max) print "... " (n - max) " earlier lines cut, the last " max " follow"
                for (i = (n > max ? n - max + 1 : 1); i <= n; i++) print buf[i]
                print $0
                inrun = 0; next
              }
              inrun { n++; buf[n] = $0; if (n > max) delete buf[n - max] }
            ' "$log"
            echo "::endgroup::"
          done
          status=0
          if [ -z "${RC:-}" ] || [ "$RC" != "0" ]; then
            echo "::error::the test binary's exit is '${RC:-unknown}', not 0"
            status=1
          fi
          if [ -n "$short" ]; then
            echo "::error::fewer than 10 passing runs for:$short"
            status=1
          fi
          exit "$status"
