# One-off, never merged: copy it to .github/workflows/s18-rerun.yml on S18's DO-NOT-MERGE draft PR (#531), deleting
# s18-measure.yml in the same commit so the first run's 16 groups do not run again, with the PR's head merging spike
# S18's new head (issue #528). It reruns the 13 F4 cells the first run (43484909319) lost to a bound of 10 minutes
# per F4 cell, fixed in the spike, on 7 jobs, plus the controls on the new head. No secret; nothing written to the
# repository; the uploads hold each cell's records and summary, as in s18-measure.yml.
name: s18-rerun

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/s18-rerun.yml']

permissions:
  contents: read

jobs:
  controls:
    name: s18 controls
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          # The PR's own head, whose parent is the spike branch's head, not the merge with main.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: The runner
        run: |
          git log -1 --format='%P' | sed 's/^/parents /'
          nproc
          lscpu | grep -E '^(Model name|CPU\(s\))'
          free -m

      - name: Vet, the analysis's tests, and the validity controls
        working-directory: spikes/s18
        run: |
          go vet ./...
          go mod tidy -diff
          go test -count=1 -v ./rig
          go test -c -o "$RUNNER_TEMP/run.test" ./run
          cd run && "$RUNNER_TEMP/run.test" -test.count=1 -test.v -test.timeout 30m \
            -test.run '^(TestNoFault|TestF[1-4]UnderAlpha|TestTheLayerAtBudget0EqualsAlphaRequestForRequest|TestEachArmOnEachFault|TestEveryPoisonTrialFires)'

  sweep:
    name: s18 sweep group ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: The runner
        run: |
          nproc
          lscpu | grep -E '^(Model name|CPU\(s\))'
          free -m

      - name: Build the harness
        working-directory: spikes/s18
        run: go test -c -o "$RUNNER_TEMP/run.test" ./run

      - name: The group's cells
        working-directory: spikes/s18/run
        env:
          S18_GROUP: ${{ matrix.group }}
          S18_GROUPS: '7'
          S18_CELLS: 'a-F4-sdk,a-F4-sdk-stream,b-F4-sdk,b-F4-sdk-stream,c-F4-b1-r0.1-sdk,c-F4-b1-r0.1-sdk-stream,c-F4-b10-r1,c-F4-b10-r1-sdk,c-F4-b10-r1-sdk-stream,c-F4-b10-r1-stream,d-F4-b10-r1-sdk,d-F4-b10-r1-sdk-stream,d-F4-b10-r1-stream'
          S18_OUT: ${{ runner.temp }}/s18results
        run: |
          "$RUNNER_TEMP/run.test" -test.count=1 -test.v -test.timeout 65m -test.run '^TestGroup$' 2>&1 | tee "$RUNNER_TEMP/group.log" \
            | grep -E '^(=== RUN|\s*--- |PASS|FAIL)|cell_test.go:[0-9]+'
          exit "${PIPESTATUS[0]}"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s18-rerun-group-${{ matrix.group }}
          path: ${{ runner.temp }}/s18results
          retention-days: 14
          if-no-files-found: error
