# DO NOT MERGE. A throwaway for issue #592's outstanding ask: the full run of hack/mutate-alpha.sh, every mutant of its list, on a hosted
# runner, on main's head. A run on the shared VM would load it for hours.
#
# What it does:
#   preflight  the baseline, first: the first mutant of each kind the script judges apart (script, package, conformance, rehearsal, the dry
#              runs), through the script itself, whose own baseline runs each kind's tests with no mutant under the same command and stops
#              (status 2) when they fail. The shards wait for it.
#   shard      16 jobs, each one kind's share of the list, chosen by --only on the first line of each entry (the script's own filter), so
#              that the script is run as it is. Whole groups of entries that share a first line go to one shard. Each shard runs the script's
#              baseline for its kinds before its first mutant, checks that the list it reads is the script's own (--check-anchors), and puts
#              its KILLED, SURVIVED and BROKEN lines, and nothing else, in an artifact.
#   tally      adds the shards up: every mutant once, or the run says which are missing.
#
# The environment steps are the `go` job's of ci.yml, copied (the cache saves and the gofmt, vet and test steps left out): the baseline must
# pass where CI's go job passes. permissions: contents: read, no secrets, SHA-pinned actions.
name: scratch-592-mutate-alpha-full

on:
  pull_request:
    paths:
      - .github/workflows/scratch-592-mutate-alpha-full.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOPROXY: "https://proxy.golang.org|direct"

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: preflight (the baseline of each kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go comes from a pinned tarball, not from actions/setup-go (see the top of this file).

      - name: Read the Go version from go.mod
        id: goversion
        run: |
          # A failing script must fail this step: "echo ...$(cmd)" would hide its exit status.
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Go archive
        id: goarchive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}

      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"
          echo "::add-matcher::$GITHUB_WORKSPACE/.github/go-problem-matcher.json"

      - name: Check the Go on PATH is the pinned toolchain
        id: gocheck
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"

      # The modules are downloaded here, before anything builds: go mod download, tried again when it
      # fails, then go mod verify (hack/go-mod-download.sh, issue #346). Nothing is cached between runs.

      - name: Download and verify the Go modules
        run: bash hack/go-mod-download.sh

      - name: Go version
        run: go version

      # The pinned binaries come from the cache when it has them (see the top of this file): frp,
      # and the Kubernetes binaries that hack/test-binaries.sh keeps under HPCBURST_TOOLS_CACHE.
      # The go, go own-timeout and crd jobs share one entry. The path lines of the restore and the save must match.

      - name: Choose where the Kubernetes test binaries are cached
        run: echo "HPCBURST_TOOLS_CACHE=$RUNNER_TEMP/hpcburst-tools" >> "$GITHUB_ENV"

      - name: Restore the cached pinned binaries
        id: binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/frp
            ${{ runner.temp }}/hpcburst-tools
          key: binaries-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-frp.sh', 'hack/test-binaries.sh') }}

      # The tunnel tests of HBEP-6 start frps and frpc. HPCBURST_REQUIRE_FRP=1 makes
      # internal/testenv.FrpBinaries fail, instead of skip, when they are missing; the script
      # checks the release's sha256 before it extracts anything.

      - name: Fetch the pinned frp binaries
        run: |
          bash hack/fetch-frp.sh "$RUNNER_TEMP/frp"
          {
            echo "HPCBURST_FRP_DIR=$RUNNER_TEMP/frp"
            echo "HPCBURST_REQUIRE_FRP=1"
          } >> "$GITHUB_ENV"

      # The Kubernetes binaries are fetched here, not inside go test, so that they are verified and
      # saved before any test runs, and a log shows whether this run downloaded them.

      - name: Fetch the pinned Kubernetes binaries
        run: bash hack/test-binaries.sh

      - name: Restore the cached Envoy binary
        id: envoy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/envoy
          key: envoy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-envoy.sh', 'internal/agent/envoypin/envoy-pins.txt') }}

      - name: Fetch the pinned Envoy binary
        run: |
          bash hack/fetch-envoy.sh "$RUNNER_TEMP/envoy"
          {
            echo "HPCBURST_ENVOY_DIR=$RUNNER_TEMP/envoy"
            echo "HPCBURST_REQUIRE_ENVOY=1"
          } >> "$GITHUB_ENV"

      - name: Provide OpenSSH's sshd for the tunnel tests
        run: |
          if ! test -x /usr/sbin/sshd; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          sudo systemctl disable --now ssh.socket ssh.service 2> /dev/null || true
          /usr/sbin/sshd -V 2>&1 | head -1
          echo "HPCBURST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"

      - name: Build the tests the script kind runs, once
        if: true
        run: |
          go test -c -o "$RUNNER_TEMP/alpha.test" ./internal/alpha
          go test -c -o "$RUNNER_TEMP/conf.test" ./internal/providerctl/conformance
          {
            echo "HPCBURST_LIVECHECKS_ALPHA_TEST=$RUNNER_TEMP/alpha.test"
            echo "HPCBURST_LIVECHECKS_CONF_TEST=$RUNNER_TEMP/conf.test"
          } >> "$GITHUB_ENV"

      - name: Run the mutants of this shard
        id: mutate
        run: |

          cat > "$RUNNER_TEMP/shardgen.py" <<'PY'
          import shlex, sys

          def entries():
              text = open('hack/mutate-alpha.sh').read()
              a = text.index('\nmutants=(\n') + 11
              b = text.index('\n)\n', a)
              return shlex.split(text[a:b], comments=True)

          def kind_of(entry):
              f = entry.split('@@')[0]
              if f == 'hack/live-checks.sh':
                  return 'script'
              if f.endswith('alpha_live_test.go') or f.startswith('internal/rehearsal'):
                  return 'misc'
              if f.startswith('internal/providerctl'):
                  return 'conf'
              return 'package'

          def ere(s):
              return ''.join('\\' + c if c in '\\.[]{}()*+?|^$' else c for c in s)

          def pick(es, kind, index, of):
              # Whole groups of entries that share a first line go to one shard, since the regexp can only name a first line.
              ks = [e for e in es if kind_of(e) == kind]
              keys = list(dict.fromkeys(e.split('\n')[0] for e in ks))
              mine = set(keys[index::of])
              return [e for e in ks if e.split('\n')[0] in mine]

          def regex(chosen):
              return '(' + '|'.join('^' + ere(e.split('\n')[0]) + '$' for e in chosen) + ')'

          if __name__ == '__main__':
              mode = sys.argv[1]
              es = entries()
              if mode == 'shard':
                  kind, index, of = sys.argv[2], int(sys.argv[3]), int(sys.argv[4])
                  chosen = pick(es, kind, index, of)
              else:  # preflight: the first mutant of each kind the script judges apart, one baseline each
                  firsts = {}
                  for e in es:
                      f = e.split('@@')[0]
                      k = 'script' if f == 'hack/live-checks.sh' else 'dry' if f.endswith('alpha_live_test.go') else 'rehearsal' if f.startswith('internal/rehearsal') \
                          else 'conf' if f.startswith('internal/providerctl') else 'package'
                      firsts.setdefault(k, e)
                  chosen = list(firsts.values())
              assert chosen, 'no mutant chosen'
              open(sys.argv[-1] + '.regex', 'w').write(regex(chosen))
              open(sys.argv[-1] + '.planned', 'w').write('%d %d\n' % (len(es), len(chosen)))
          PY

          python3 -I "$RUNNER_TEMP/shardgen.py" preflight "$RUNNER_TEMP/shard"
          read -r total planned < "$RUNNER_TEMP/shard.planned"
          anchors=$(bash hack/mutate-alpha.sh --check-anchors)
          echo "$anchors"
          [ "$anchors" = "anchors: $total mutants, 0 not exactly once" ] || { echo "the list read $total mutants, the script's own check says: $anchors"; exit 2; }
          echo "shard preflight: $planned of $total mutants"
          set +e
          timeout 90m bash hack/mutate-alpha.sh --only "$(cat "$RUNNER_TEMP/shard.regex")" 2>&1 | tee "$RUNNER_TEMP/shard.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "the script ended with status $rc"
          {
            echo "shard: preflight"
            echo "planned: $planned"
            echo "total: $total"
            echo "status: $rc"
            grep -E '^(KILLED|SURVIVED|BROKEN) |^mutants: |^kills by what failed|^  +[0-9]+ ' "$RUNNER_TEMP/shard.log" | sed -E 's#/home/runner[^ ]*#<runner>#g; s#/tmp/[^ ]*#<tmp>#g'
          } > "$RUNNER_TEMP/shard-summary.txt"
          # Status 0 (all killed) and 1 (a survivor or a broken mutant) are results; anything else (2: a baseline that failed; 124: the limit) is not.
          [ "$rc" -le 1 ] || exit "$rc"

      - name: Upload the shard's result lines
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight
          path: ${{ runner.temp }}/shard-summary.txt
          retention-days: 7
          if-no-files-found: warn

  shard:
    name: shard ${{ matrix.name }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {name: script-1, kind: script, index: 0, of: 5}
          - {name: script-2, kind: script, index: 1, of: 5}
          - {name: script-3, kind: script, index: 2, of: 5}
          - {name: script-4, kind: script, index: 3, of: 5}
          - {name: script-5, kind: script, index: 4, of: 5}
          - {name: package-1, kind: package, index: 0, of: 8}
          - {name: package-2, kind: package, index: 1, of: 8}
          - {name: package-3, kind: package, index: 2, of: 8}
          - {name: package-4, kind: package, index: 3, of: 8}
          - {name: package-5, kind: package, index: 4, of: 8}
          - {name: package-6, kind: package, index: 5, of: 8}
          - {name: package-7, kind: package, index: 6, of: 8}
          - {name: package-8, kind: package, index: 7, of: 8}
          - {name: conf-1, kind: conf, index: 0, of: 2}
          - {name: conf-2, kind: conf, index: 1, of: 2}
          - {name: misc-1, kind: misc, index: 0, of: 1}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
