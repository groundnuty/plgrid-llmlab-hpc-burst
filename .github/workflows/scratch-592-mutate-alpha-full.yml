  tally:
    name: tally
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download the shards' result lines
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shard-*
          path: results

      - name: Add the shards up
        run: |
          python3 -I - <<'PY' | tee "$GITHUB_STEP_SUMMARY"
          import glob, re
          rows, killed, survived, broken, planned_sum, total = [], 0, 0, 0, 0, set()
          lines = {'SURVIVED': [], 'BROKEN': []}
          for f in sorted(glob.glob('results/*/shard-summary.txt')):
              name = status = planned = None
              k = s = b = 0
              for line in open(f).read().splitlines():
                  m = re.match(r'(shard|planned|total|status): (.*)', line)
                  if m:
                      if m.group(1) == 'shard': name = m.group(2)
                      if m.group(1) == 'planned': planned = int(m.group(2))
                      if m.group(1) == 'total': total.add(int(m.group(2)))
                      if m.group(1) == 'status': status = m.group(2)
                      continue
                  if line.startswith('KILLED'): k += 1
                  if line.startswith('SURVIVED'): s += 1; lines['SURVIVED'].append(line)
                  if line.startswith('BROKEN'): b += 1; lines['BROKEN'].append(line)
              rows.append((name, planned, k, s, b, status))
              killed += k; survived += s; broken += b; planned_sum += planned or 0
          print('## mutate-alpha, the full run')
          print('| shard | planned | killed | survived | broken | not run | script status |')
          print('|---|---|---|---|---|---|---|')
          for name, planned, k, s, b, status in rows:
              print('| %s | %s | %s | %s | %s | %s | %s |' % (name, planned, k, s, b, (planned or 0) - k - s - b, status))
          ran = killed + survived + broken
          print()
          print('**%d shards; the list has %s mutants; planned %d; ran %d: killed %d, survived %d, broken %d.**' % (len(rows), ','.join(map(str, sorted(total))), planned_sum, ran, killed, survived, broken))
          for kind in ('SURVIVED', 'BROKEN'):
              print()
              print('### %s (%d)' % (kind.lower(), len(lines[kind])))
              print('```')
              for line in lines[kind]:
                  print(line)
              print('```')
          PY
