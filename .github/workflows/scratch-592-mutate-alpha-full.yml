          if __name__ == '__main__':
              mode = sys.argv[1]
              es = entries()
              if mode == 'shard':
                  kind, index, of = sys.argv[2], int(sys.argv[3]), int(sys.argv[4])
                  chosen = pick(es, kind, index, of)
              else:  # preflight: the first mutant of each kind the script judges apart, one baseline each
                  firsts = {}
                  for e in es:
                      f = e.split('@@')[0]
                      k = 'script' if f == 'hack/live-checks.sh' else 'dry' if f.endswith('alpha_live_test.go') else 'rehearsal' if f.startswith('internal/rehearsal') \
                          else 'conf' if f.startswith('internal/providerctl') else 'package'
                      firsts.setdefault(k, e)
