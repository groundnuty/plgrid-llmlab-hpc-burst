# THROWAWAY, never merged: #429's PR 2 timed and concurrent tests under -count=50 with load, on hosted
# runners (IMPL-COMMON: heavy runs go on hosted runners). Read-only: no secret, cache restore only.
# The 5-minute stream-idle test cannot fit -count=50 in one job, so it runs in seven shards of -count=8
# each (IMPL-COMMON's rule for minutes-long tests: report the exact count).
name: e429-count50
on:
  pull_request:
    paths:
      - .github/workflows/e429-count50.yml
permissions:
  contents: read
jobs:
  count:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quick
            count: 50
            timeout: 170m
            run: "^(TestTheAgentRunsTheRouterInFrontOfItsWorker|TestTheAgentNeverRestartsTheRouterByItself|TestAWorkerRestartLeavesTheRouterRunning|TestAWorkerBehindTheRouterGetsTheKeepAlive|TestARouterThatCannotStartIsReportedAndBypassesNothing|TestAlphaAgentStartsNoRouter|TestStartEnvoyListensOnlyOnItsPipes|TestCheckEnvoySocketsSeesWhatAProcessListensOn|TestEnvoySuppressesItsOwnHeaders|TestEnvoyPassesAuthorizationAndSessionIDUnchanged|TestEnvoyCircuitBreakersSitAboveEnvoysDefault|TestEnvoyAdminSocketIsReadOnly|TestTheForwarderAddsNothingOnTheWayToTheRouter|TestTheForwarderCheckSeesAnAddedHeader)$"
          - name: route-timeout
            count: 50
            timeout: 60m
            run: "^TestEnvoyRouteTimeoutOutlivesTheDefault$"
          - name: upstream-idle
            count: 50
            timeout: 80m
            run: "^TestEnvoyClosesIdleUpstreamConnectionsFirst$"
          - {name: stream-idle-1, count: 8, timeout: 60m, run: "^TestEnvoyStreamIdleOutlivesTheDefault$"}
          - {name: stream-idle-2, count: 8, timeout: 60m, run: "^TestEnvoyStreamIdleOutlivesTheDefault$"}
          - {name: stream-idle-3, count: 8, timeout: 60m, run: "^TestEnvoyStreamIdleOutlivesTheDefault$"}
          - {name: stream-idle-4, count: 8, timeout: 60m, run: "^TestEnvoyStreamIdleOutlivesTheDefault$"}
          - {name: stream-idle-5, count: 8, timeout: 60m, run: "^TestEnvoyStreamIdleOutlivesTheDefault$"}
          - {name: stream-idle-6, count: 8, timeout: 60m, run: "^TestEnvoyStreamIdleOutlivesTheDefault$"}
          - {name: stream-idle-7, count: 8, timeout: 60m, run: "^TestEnvoyStreamIdleOutlivesTheDefault$"}
    name: count50 ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the pull request's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read the Go version from go.mod
        id: goversion
        run: |
          version=$(bash hack/fetch-go.sh --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore the cached Go archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-download
          key: go-toolchain-${{ steps.goversion.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-go.sh', 'hack/go-pins.txt') }}
      - name: Install the pinned Go toolchain
        run: |
          bash hack/fetch-go.sh "$RUNNER_TEMP/go-download" "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go-toolchain/go" >> "$GITHUB_ENV"
      - name: Check the Go on PATH is the pinned toolchain
        run: bash hack/fetch-go.sh --check "$RUNNER_TEMP/go-toolchain"
      - name: Download and verify the Go modules
        run: bash hack/go-mod-download.sh
      - name: Restore the cached Envoy binary
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/envoy
          key: envoy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/fetch-envoy.sh', 'internal/agent/envoypin/envoy-pins.txt') }}
      - name: Fetch the pinned Envoy binary
        run: |
          bash hack/fetch-envoy.sh "$RUNNER_TEMP/envoy"
          {
            echo "HPCBURST_ENVOY_DIR=$RUNNER_TEMP/envoy"
            echo "HPCBURST_REQUIRE_ENVOY=1"
          } >> "$GITHUB_ENV"
      - name: Build the test binary
        run: go test -c -o "$RUNNER_TEMP/agent.test" ./internal/agent
      - name: Run under load (two spinners at nice 19)
        working-directory: internal/agent
        run: |
          for i in 1 2; do nice -n 19 sh -c 'while :; do :; done' & done
          trap 'kill $(jobs -p) 2> /dev/null' EXIT
          log="$RUNNER_TEMP/count.log"
          rc=0
          "$RUNNER_TEMP/agent.test" -test.v -test.count=${{ matrix.count }} -test.timeout ${{ matrix.timeout }} -test.run '${{ matrix.run }}' > "$log" 2>&1 || rc=$?
          echo "exit=$rc"
          echo "pass lines: $(grep -c -E '^--- PASS' "$log")"
          echo "fail lines: $(grep -c -E '^--- FAIL' "$log")"
          echo "skip lines: $(grep -c -E '^\s*--- SKIP' "$log")"
          grep -E '^--- (PASS|FAIL)' "$log" | sed 's/ (.*//' | sort | uniq -c
          grep -B2 -A20 -E '^\s*--- FAIL' "$log" | head -200 || true
          exit "$rc"
