# One-off, never merged: spike S14's measurements (issue #313, HBEP-6 open question 11) on GitHub-hosted
# runners. A 300-tunnel load would breach the shared development VM's load limits, so the brief puts the
# measurements here. Each repetition is its own job, so each runs on a fresh runner; each records the
# runner's CPU model and count with its results, runs the whole matrix from 1 to 300 tunnels, and uploads
# its runs.csv and raw files as an artifact. The jobs use no secret and write nothing to the repository.
name: s14-measure

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/s14-measure.yml']

permissions:
  contents: read

jobs:
  measure:
    name: s14 rep ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          # The PR's own head, whose parent is the spike branch's head, not the merge with main.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: The runner
        run: |
          git rev-parse HEAD^ | sed 's/^/spike head /'
          python3 spikes/s14/s14.py host
          nproc
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket)'
          free -m
          ulimit -n; ulimit -Hn
          sysctl net.ipv4.ip_local_port_range net.ipv4.tcp_tw_reuse net.core.somaxconn
          python3 --version

      - name: Fetch the pinned binaries and build the harness
        env:
          S14_BIN: ${{ runner.temp }}/s14bin
        run: bash spikes/s14/fetch.sh

      - name: The harness's unit tests
        working-directory: spikes/s14
        run: |
          go vet ./...
          go test -count=1 ./...
          python3 -m unittest discover -s tests -v

      - name: The measurements
        env:
          S14_BIN: ${{ runner.temp }}/s14bin
          S14_WORK: ${{ runner.temp }}/s14w
          S14_RESULTS: ${{ runner.temp }}/s14results/rep${{ matrix.rep }}
        run: |
          python3 spikes/s14/s14.py run --rep ${{ matrix.rep }}
          python3 spikes/s14/s14.py leftovers
          python3 - <<'EOF'
          import csv, os
          path = os.path.join(os.environ["S14_RESULTS"], "runs.csv")
          keys = ["mode", "tunnels", "streams", "status", "valid", "host_busy", "tokens_per_s", "ttft_p50_ms", "ttft_p99_ms",
                  "gap_p50_ms", "gap_p99_ms", "cpu_frps", "cpu_listener", "cpu_owner", "cpu_bridges", "rss_mb_frps",
                  "fds_frps", "drops_api", "frpc_relogins", "relay_restarts"]
          print("\t".join(keys))
          for r in csv.DictReader(open(path)):
              print("\t".join(str(r.get(k, "")) for k in keys))
          EOF

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s14-rep${{ matrix.rep }}
          path: ${{ runner.temp }}/s14results/rep${{ matrix.rep }}
          retention-days: 14
          if-no-files-found: error
