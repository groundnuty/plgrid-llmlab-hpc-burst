apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: allocations.spike.hpc-burst.example
spec:
  group: spike.hpc-burst.example
  names:
    kind: Allocation
    listKind: AllocationList
    plural: allocations
    singular: allocation
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: TAG, type: string, jsonPath: .status.atProvider.tag}
        - {name: JOB, type: integer, jsonPath: .status.atProvider.jobId}
        - {name: PHASE, type: string, jsonPath: .status.atProvider.phase}
        - {name: SOURCE, type: string, jsonPath: .status.atProvider.source}
        - {name: HELD, type: boolean, jsonPath: .status.atProvider.held}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                managementPolicies:
                  type: array
                  items:
                    type: string
                    enum: [Observe, Create, Update, Delete, LateInitialize, "*"]
                  default: [Observe, Create, Delete, LateInitialize]
                providerConfigRef:
                  type: object
                  properties:
                    kind: {type: string}
                    name: {type: string}
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    name: {type: string}
                forProvider:
                  type: object
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "forProvider is immutable: a submitted job is never edited; cancel and create a new Allocation"
                  properties:
                    partition: {type: string}
                    account: {type: string}
                    timeLimit: {type: string}
                    wrap: {type: string}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
