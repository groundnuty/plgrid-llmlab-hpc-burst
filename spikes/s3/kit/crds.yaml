# Spike-only API group. The real group and kinds are the owner's decision (HBEP-11).
# Fleet ~ ModelDeployment, Worker ~ Instance, Slot ~ Allocation (HBEP-3).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fleets.s3.spike.invalid
spec:
  group: s3.spike.invalid
  scope: Namespaced
  names: {kind: Fleet, listKind: FleetList, plural: fleets, singular: fleet}
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [model, revision]
            properties:
              model: {type: string, minLength: 1, maxLength: 63}
              # HBEP-9: an unpinned revision is refused. Pinned = 40 hex chars. Immutable once set.
              revision:
                type: string
                pattern: '^[0-9a-f]{40}$'
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: revision is immutable
              replicas: {type: integer, minimum: 0, maximum: 50, default: 1}
          status:
            type: object
            properties:
              observedGeneration: {type: integer, format: int64}
              readyWorkers: {type: integer}
              lastReconcileTime: {type: string, format: date-time}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workers.s3.spike.invalid
spec:
  group: s3.spike.invalid
  scope: Namespaced
  names: {kind: Worker, listKind: WorkerList, plural: workers, singular: worker}
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              fleet: {type: string}
              index: {type: integer, minimum: 0}
          status:
            type: object
            properties:
              phase: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: slots.s3.spike.invalid
spec:
  group: s3.spike.invalid
  scope: Namespaced
  names: {kind: Slot, listKind: SlotList, plural: slots, singular: slot}
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              provider: {type: string}
              jobID: {type: string}
          status:
            type: object
            properties:
              state: {type: string}
