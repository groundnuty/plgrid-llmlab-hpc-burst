# One-off, never merged (copy it to .github/workflows/s17-rekey.yml on the DO-NOT-MERGE draft PR whose head merges this
# spike's branch): the rekey group of spike S17 (issue #413; the review of PR 416) on GitHub-hosted runners. The ssh
# runs of the first hosted run stalled every token stream once, at 1 GiB; this group tests the reading that the stall is
# OpenSSH's rekey. Layout (c), four 40 MiB or 64 MiB downloads at once through the real relay (a real ssh client, sshd
# and the fake Slurm's srun streams), nine batches, with every relay client run under `ssh -v` so that its key exchanges
# and negotiated algorithms are logged: (A) the default, (B) the same with -o RekeyLimit=256M, (C) the default with
# 64 MiB downloads for 2.25 GiB. Two repetitions, each its own job on a fresh runner. A separate file from
# s17-measure.yml so that the 12 measurement jobs of the first run are not run again. No secret; nothing written to the
# repository; the debug logs name the host and the user, stay on the runner and are not uploaded: only parsed facts are.
name: s17-rekey

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/s17-rekey.yml']

permissions:
  contents: read

jobs:
  rekey:
    name: s17 rekey rep ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          # The PR's own head, whose parent is the spike branch's head, not the merge with main.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # As in ci.yml and s17-measure.yml: OpenSSH's sshd is installed only when missing, never started as a service.
      - name: Provide OpenSSH's sshd
        run: |
          if ! test -x /usr/sbin/sshd; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          sudo systemctl disable --now ssh.socket ssh.service 2> /dev/null || true
          /usr/sbin/sshd -V 2>&1 | head -1
          ssh -V 2>&1 | head -1
          echo "HPCBURST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"

      - name: The runner
        run: |
          git log -1 --format='%P' | sed 's/^/parents /'
          python3 spikes/s17/s17.py host
          nproc
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket)'
          free -m
          ulimit -n; ulimit -Hn
          python3 --version

      - name: Fetch the pinned binaries and build the harness
        env:
          S17_BIN: ${{ runner.temp }}/s17bin
        run: bash spikes/s17/fetch.sh

      - name: The harness's unit tests
        working-directory: spikes/s17
        run: |
          go vet ./...
          go test -count=1 ./...
          python3 -m unittest discover -s tests -v

      - name: The measurements
        env:
          S17_BIN: ${{ runner.temp }}/s17bin
          S17_WORK: ${{ runner.temp }}/s17w
          S17_RESULTS: ${{ runner.temp }}/s17results/rekey/rep${{ matrix.rep }}
          # The ssh node's scratch directory (sshd's files, the relay socket and the control socket have path limits).
          S17_TMP: /tmp
        run: |
          python3 spikes/s17/s17.py run --group rekey --rep ${{ matrix.rep }} --ready-timeout 90
          python3 spikes/s17/s17.py leftovers
          python3 - <<'PY'
          import csv, os
          path = os.path.join(os.environ["S17_RESULTS"], "runs.csv")
          keys = ["group", "variant", "ssh_opts", "status", "valid", "invalid_reason", "ssh_version", "ssh_cipher_in", "ssh_mac_in",
                  "ssh_kex_algorithm", "ssh_rekey_in_blocks", "ssh_key_exchanges", "recv_rate_median", "gap_bulk_p99_ms", "gap_bulk_max_ms",
                  "node_leaked", "drops_api", "frpc_relogins"]
          print("\t".join(keys))
          for r in csv.DictReader(open(path)):
              print("\t".join(str(r.get(k, "")) for k in keys))
          PY

      # The debug logs are in the work directory, never in the results: they name the host and the user.
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s17-rekey-rep${{ matrix.rep }}
          path: ${{ runner.temp }}/s17results/rekey/rep${{ matrix.rep }}
          retention-days: 14
          if-no-files-found: error
